  const goDemand=(id,tab)=>()=>{view="demands";activeId=id;activeTab=tab||"work";renderApp();};
  const byDue=(a,b)=>(earliestOpenDue(a)||"9999").localeCompare(earliestOpenDue(b)||"9999");
  const overdue=tasks.filter(t=>{const d=earliestOpenDue(t);return d&&daysUntil(d)<0;}).sort(byDue);
  const dueWeek=tasks.filter(t=>{const d=earliestOpenDue(t);return d&&daysUntil(d)>=0&&daysUntil(d)<=7;}).sort(byDue);
  const bugs=tasks.filter(t=>t.status==="bug");
  const waiting=tasks.filter(isWaiting).sort((a,b)=>(a.waiting.since||"").localeCompare(b.waiting.since||""));
  const golive=tasks.filter(t=>["progress","delivered","bug"].includes(t.status)&&golivePending(t));
  /* a demand deliberately parked with a future next action isn't stale */
  const stale=tasks.filter(t=>["open","progress"].includes(t.status)&&(Date.now()-t.updatedAt)>14*86400000&&!(t.nextAction&&t.nextAction.date>todayStr()));
  const actions=[];state.meetings.forEach(m=>m.actions.forEach(a=>{if(!a.done)actions.push({a,m});}));
  actions.sort((x,y)=>(x.a.due||"9999").localeCompare(y.a.due||"9999"));
  const mytodos=state.todos.filter(x=>!x.done).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
  const todayJ=state.journal.find(j=>j.date===todayStr());

  const cards=[];
  const card=(title,icon,tone,items)=>{if(items.length)cards.push({title,icon,tone,items});};
  const dlabel=t=>`${t.demandId?esc(t.demandId)+" · ":""}${esc(t.title)}`;
  card("Overdue","⚑","alert",overdue.map(t=>({main:dlabel(t),sub:`${-daysUntil(earliestOpenDue(t))}d late`,go:goDemand(t.id)})));
  {const cidx=clashIndex(),pairs=[],seen=new Set();
   tasks.forEach(t=>taskClashes(t,cidx).forEach(({o,open})=>open.forEach(x=>{const k=objKey(o.name)+"|"+[t.id,x.t.id].sort().join("|");
     if(seen.has(k))return;seen.add(k);pairs.push({t,o,x});})));
   card("Object clashes — in flight in two demands","⚠","alert",pairs.map(({t,o,x})=>({main:`<span class="mono">${esc(o.name)}</span>`,
     sub:`${esc(t.demandId||t.title)} ↔ ${esc(x.t.demandId||x.t.title)}`,go:goDemand(t.id,"objects")})));}
  card("Next actions due","⏰","warn",tasks.filter(nextActionDue).sort((a,b)=>a.nextAction.date.localeCompare(b.nextAction.date))
    .map(t=>({main:dlabel(t),sub:`${t.nextAction.note?esc(t.nextAction.note.length>38?t.nextAction.note.slice(0,37)+"…":t.nextAction.note)+" · ":""}${t.nextAction.date===todayStr()?"today":t.nextAction.date}`,go:goDemand(t.id)})));
  card("Bugs / Rework","🐞","alert",bugs.map(t=>({main:dlabel(t),sub:reworkCount(t)?`↻ ${reworkCount(t)}`:"",go:goDemand(t.id)})));
  card("Go-live: transports not at their destination","🚚","warn",golive.map(t=>{const g=golivePending(t);return {main:dlabel(t),sub:`${g.missing.length} TR(s) → ${g.target}`,go:goDemand(t.id,"transports")};}));
  card("Waiting on","⏳","warn",waiting.map(t=>({main:dlabel(t),sub:`${esc(t.waiting.on)}${waitDays(t)!=null?" · "+waitDays(t)+"d":""}`,go:goDemand(t.id)})));
  card("Due this week","📅","",dueWeek.map(t=>({main:dlabel(t),sub:`${earliestOpenDue(t)} (${daysUntil(earliestOpenDue(t))}d)`,go:goDemand(t.id)})));
  card("Open action points","☑","",actions.map(({a,m})=>({main:esc(a.text||"(no text)"),sub:`${esc(a.owner||"—")}${m.team?" · "+esc(m.team):""}`,go:()=>{view="meetings";meetingRollup=false;activeMeetingId=m.id;renderApp();}})));
  card("My action items","✅","",mytodos.map(x=>({main:esc(x.text||"(no text)"),sub:x.due?(daysUntil(x.due)<0?"⚠ "+x.due:x.due):"",go:()=>{view="journal";journalTodos=true;renderApp();}})));
  card("Expired images — delete for data hygiene","🧹","warn",expiredImages().map(im=>({main:esc(im.label||im.file),sub:"expired "+im.expiry,go:()=>gotoImage(im)})));
  const epicsDue=state.epics.filter(e=>!["delivered","closed"].includes(e.status)&&e.targetDate&&daysUntil(e.targetDate)<=21)
    .sort((a,b)=>a.targetDate.localeCompare(b.targetDate));
  card("Epics nearing target","◆","warn",epicsDue.map(e=>{const r=epicRollup(e),n=daysUntil(e.targetDate);
    return{main:esc(epicLabel(e)),sub:`${r.done}/${r.ts.length} done · ${n<0?(-n)+"d over":e.targetDate}`,
      go:()=>{view="epics";activeEpicId=e.id;renderApp();}};}));
  const wavesDue=[];state.epics.filter(e=>!["delivered","closed"].includes(e.status)).forEach(e=>e.waves.forEach(w=>{
    if(!w.target||daysUntil(w.target)>21)return;
    const ws=tasksForEpic(e.id).filter(t=>t.wave===w.name);
    if(!ws.length||ws.every(t=>["delivered","closed"].includes(t.status)))return;
    wavesDue.push({e,w,ws});}));
  wavesDue.sort((a,b)=>a.w.target.localeCompare(b.w.target));
  card("Waves nearing target","🎯","warn",wavesDue.map(({e,w,ws})=>{const n=daysUntil(w.target);
    return{main:`◆ ${esc(e.code||e.name)} · ${esc(w.name)}`,sub:`${ws.filter(t=>["delivered","closed"].includes(t.status)).length}/${ws.length} done · ${n<0?(-n)+"d over":w.target}`,
      go:()=>{view="epics";activeEpicId=e.id;epicTab="overview";renderApp();}};}));
  const epicFU=[];state.epics.filter(e=>e.status!=="closed").forEach(e=>e.deps.forEach(x=>{const why=depFollowDue(e,x);if(why)epicFU.push({e,x,why});}));
  card("Epic follow-ups — chase other teams","📞","warn",epicFU.map(({e,x,why})=>({main:`◆ ${esc(e.code||e.name)} — ${esc(x.team||"(team?)")}`,sub:`${esc(x.what||"")}${x.what?" · ":""}${why}`,
    go:()=>{view="epics";activeEpicId=e.id;epicTab="deps";renderApp();}})));
  const recDue=state.playbook.filter(p=>p.kind==="recurring"&&p.due&&daysUntil(p.due)<=14).sort((a,b)=>a.due.localeCompare(b.due));
  card("Recurring processes due","🔁","warn",recDue.map(p=>({main:esc(p.title),sub:(daysUntil(p.due)<0?"⚠ overdue · ":"")+p.due,go:()=>{view="playbook";activePlayId=p.id;renderApp();}})));
  const frz=state.playbook.filter(p=>p.kind==="freeze"&&p.from&&p.to&&p.to>=todayStr()&&daysUntil(p.from)<=14).sort((a,b)=>a.from.localeCompare(b.from));
  card("Freeze periods","❄","warn",frz.map(p=>{const act=p.from<=todayStr();return{main:esc(p.title),sub:(act?"ACTIVE until "+p.to:"from "+p.from)+" · "+(p.systems||[]).length+" system(s)",go:()=>{view="playbook";activePlayId=p.id;renderApp();}};}));
  card("Stale (open, untouched 14d+)","🕸","",stale.map(t=>({main:dlabel(t),sub:`${Math.floor((Date.now()-t.updatedAt)/86400000)}d`,go:goDemand(t.id)})));

  let html="";
  if(!cards.length)html+=`<div class="dashcard" style="max-width:440px"><h3>✓ All clear</h3><div class="dash-empty">Nothing overdue, no bugs, nothing waiting. Nice.</div></div>`;
  else html+=`<div class="dash-grid">`+cards.map((c,ci)=>{const exp=renderToday._exp&&renderToday._exp[c.title];const shown=exp?c.items:c.items.slice(0,8);
    return `<div class="dashcard ${c.tone}"><h3>${c.icon} ${c.title}<span class="cnt">${c.items.length}</span></h3>${shown.map((it,ii)=>`<div class="dashitem" data-c="${ci}" data-i="${ii}"><span class="di-main">${it.main}</span>${it.sub?`<span class="di-sub">${it.sub}</span>`:""}</div>`).join("")}${c.items.length>shown.length?`<div class="dashitem" data-more="${ci}"><span class="di-main" style="color:var(--accent)">＋ ${c.items.length-shown.length} more…</span></div>`:""}</div>`;}).join("")+`</div>`;
  html+=`<div class="dash-grid" style="margin-top:14px"><div class="dashcard"><h3>📓 Today's journal</h3>${(todayJ&&(todayJ.body||todayJ.title))?`<div style="font-size:13px;white-space:pre-wrap;max-height:120px;overflow:auto;line-height:1.5">${esc(((todayJ.title?todayJ.title+"\n":"")+todayJ.body)).slice(0,400)}</div><button class="sm" id="openJ" style="margin-top:8px">Open journal</button>`:`<div class="dash-empty">No entry for today yet.</div><button class="sm" id="openJ" style="margin-top:8px">＋ Start today's note</button>`}</div></div>`;
  const attn=cards.reduce((n,c)=>n+c.items.length,0);
  host.innerHTML=benchOn()
    ?`<div class="dash cockpit"><div class="ck-in">${cockpitHTML()}<div class="ck-sech"><span class="ck-lbl">Needs attention · ${attn}</span></div>${html}</div></div>`
    :`<div class="dash"><div class="dash-head"><h1>Today</h1><span class="faint">${new Date().toDateString()}</span></div>${html}</div>`;
  if(benchOn())mountCockpit(host);
  host.querySelectorAll(".dashitem[data-c]").forEach(el=>el.onclick=()=>cards[+el.dataset.c].items[+el.dataset.i].go());
  host.querySelectorAll(".dashitem[data-more]").forEach(el=>el.onclick=()=>{(renderToday._exp=renderToday._exp||{})[cards[+el.dataset.more].title]=true;renderToday();});
  const oj=host.querySelector("#openJ");if(oj)oj.onclick=newJournalToday;
}

/* ===================== DEMANDS ===================== */
/* ===================== DEMAND LIST VIEW =====================
   One "view" decides what the list shows: grouping, sort order, statuses, field filters
   and "only …" toggles. It's edited in the ⚙ View panel, summed up as removable chips
   above the list, and can be saved as named one-click views. Per viewer (localStorage),
   never in the data file. */
const DV_GROUPS={none:"No grouping",epic:"Epic",wave:"Epic wave",status:"Status",system:"System",project:"Project",theme:"Theme",requestor:"Requestor",type:"Demand type",due:"Due date",next:"Next action"};
const DV_SORTS={due:{label:"Due date",dir:"asc"},next:{label:"Next action",dir:"asc"},received:{label:"Received",dir:"desc"},updated:{label:"Last updated",dir:"desc"},
  age:{label:"Age",dir:"desc"},waiting:{label:"Time waiting",dir:"desc"},status:{label:"Status",dir:"asc"},clash:{label:"Object clashes",dir:"desc"},
  demand:{label:"Demand ID",dir:"asc"},title:{label:"Title",dir:"asc"}};
const DV_ONLY={overdue:"Overdue",waiting:"Waiting on someone",clash:"With object clashes",notprod:"Transports not yet in Prod",next:"Next action due"};
const DV_FIELDS={epic:"Epic",system:"System",project:"Project",theme:"Theme",requestor:"Requestor",type:"Type"};
const STATUS_ORDER=Object.keys(STATUS),STATUS_RANK={bug:0,progress:1,open:2,delivered:3,closed:4};
const DV_PRESETS=[
  {name:"My active",view:{group:"epic",sort:"due",status:["open","progress","bug"]}},
  {name:"Go-live",view:{group:"system",sort:"due",only:["notprod"]}},
  {name:"Waiting",view:{group:"none",sort:"waiting",dir:"desc",only:["waiting"]}},
  {name:"Clashes",view:{group:"none",sort:"clash",dir:"desc",only:["clash"]}},
  {name:"Everything",view:{group:"none",sort:"updated",dir:"desc"}}];
let dvQuery=""; /* the quick text filter is deliberately not part of a saved view */
function dvBlank(){return{group:"none",sort:"due",dir:"asc",status:[],hideClosed:false,hideDelivered:false,only:[],f:{}};}
/* normalised + canonically ordered, so two views compare equal as JSON */
function dvNorm(v){v=(v&&typeof v==="object")?v:{};const f={};
  Object.keys(DV_FIELDS).forEach(k=>{if(v.f&&v.f[k])f[k]=String(v.f[k]);});
  return{group:DV_GROUPS[v.group]?v.group:"none",sort:DV_SORTS[v.sort]?v.sort:"due",
    dir:v.dir==="desc"||(v.dir!=="asc"&&DV_SORTS[v.sort]&&DV_SORTS[v.sort].dir==="desc")?"desc":"asc",
    status:STATUS_ORDER.filter(s=>Array.isArray(v.status)&&v.status.includes(s)),
    hideClosed:!!v.hideClosed,hideDelivered:!!v.hideDelivered,
    only:Object.keys(DV_ONLY).filter(k=>Array.isArray(v.only)&&v.only.includes(k)),f};}
function dvGet(){let v=null;try{v=JSON.parse(viewPref("view","null"));}catch(e){}
  return dvNorm(v||{group:groupByEpic()?"epic":"none"}); /* first run keeps the old group-by-epic choice */}
function dvSet(v){setViewPref("view",JSON.stringify(dvNorm(v)));}
function dvSame(a,b){return JSON.stringify(dvNorm(a))===JSON.stringify(dvNorm(b));}
function dvSaved(){let a=null;try{a=JSON.parse(viewPref("savedViews","null"));}catch(e){}
  if(!Array.isArray(a))a=DV_PRESETS.map(p=>({name:p.name,view:p.view}));
  let fresh=false;
  const out=a.filter(x=>x&&x.name).map(x=>{if(!x.id)fresh=true;return {id:x.id||uid(),name:String(x.name),view:dvNorm(x.view)};});
  if(fresh)dvSetSaved(out); /* ids must be stable, or a chip click can't find its view */
  return out;}
function dvSetSaved(a){setViewPref("savedViews",JSON.stringify(a.map(x=>({id:x.id,name:x.name,view:dvNorm(x.view)}))));}
function dvSaveCurrent(){const v=dvGet(),saved=dvSaved();
  const name=(prompt("Name this view — it becomes a one-click chip above the list:","")||"").trim();if(!name)return false;
  const ex=saved.find(s=>s.name.toLowerCase()===name.toLowerCase());
  if(ex){if(!confirm(`Replace the saved view “${ex.name}” with the current settings?`))return false;ex.view=v;}
  else saved.push({id:uid(),name,view:v});
  dvSetSaved(saved);toast(`Saved view “${name}”`);return true;}

function dvMatches(v,cidx){
  const today=todayStr(),words=dvQuery.trim().toLowerCase().split(/\s+/).filter(Boolean),f=v.f;
  return t=>{
    if(v.status.length){if(!v.status.includes(t.status))return false;}
    else if((v.hideClosed&&t.status==="closed")||(v.hideDelivered&&t.status==="delivered"))return false;
    if(f.epic&&(f.epic==="__none"?!!epicById(t.epicId):t.epicId!==f.epic))return false;
    if(f.system&&t.system!==f.system)return false;
    if(f.project&&t.project!==f.project)return false;
    if(f.theme&&t.theme!==f.theme)return false;
    if(f.requestor&&t.requestor!==f.requestor)return false;
    if(f.type&&t.type!==f.type)return false;
    for(const k of v.only){
      if(k==="overdue"){const d=earliestOpenDue(t);if(!(d&&d<today))return false;}
      else if(k==="waiting"){if(!isWaiting(t))return false;}
      else if(k==="clash"){if(!openClashCount(t,cidx))return false;}
      else if(k==="notprod"){if(t.status==="closed"||!golivePending(t))return false;}
      else if(k==="next"){if(!nextActionDue(t))return false;}}
    if(words.length){const e=epicById(t.epicId);
      const blob=[t.demandId,t.title,t.requestor,t.project,t.theme,t.wave,t.system,t.client,t.type,e?epicLabel(e):"",
        ...t.objects.map(o=>o.name),...t.transports.map(tr=>tr.number),...(t.tocs||[]).map(c=>c.number)].join(" ").toLowerCase();
      if(!words.every(w=>blob.includes(w)))return false;}
    return true;};
}
function dvSortVal(t,k,cidx){
  switch(k){
    case "due":return earliestOpenDue(t)||null;
    case "next":return (t.nextAction&&t.nextAction.date&&t.status!=="closed")?t.nextAction.date:null;
    case "received":return t.receivedDate||null;
    case "updated":return t.updatedAt||0;
    case "age":return t.receivedDate?-daysUntil(t.receivedDate):Math.floor((Date.now()-t.createdAt)/86400000);
    case "waiting":return isWaiting(t)?(waitDays(t)??0):null;
    case "status":return STATUS_RANK[t.status];
    case "clash":return openClashCount(t,cidx)||null;
    case "demand":return (t.demandId||"").toLowerCase()||null;
    default:return (t.title||"").toLowerCase();}
}
function dvSort(list,v,cidx){const m=v.dir==="desc"?-1:1,val=new Map(list.map(t=>[t,dvSortVal(t,v.sort,cidx)]));
  return list.sort((a,b)=>{const x=val.get(a),y=val.get(b);
    if(x==null)return y==null?0:1; /* empty values always last, whichever direction */
    if(y==null)return -1;
    const c=typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),undefined,{numeric:true});
    return c*m||(earliestOpenDue(a)||"9999").localeCompare(earliestOpenDue(b)||"9999");});}
/* which block a demand falls into for the chosen grouping */
function dvGroupOf(t,g){
  const none=label=>({k:"",label:`<span class="faint">${label}</span>`,rank:9});
  switch(g){
    case "epic":{const e=epicById(t.epicId);
      return e?{k:e.id,label:`◆ ${e.code?`<b>${esc(e.code)}</b> · `:""}${esc(e.name)}`,rank:EPIC_GROUP_RANK[e.status],sl:epicLabel(e),epic:e}:none("No epic");}
    case "wave":{const e=epicById(t.epicId);if(!e)return none("No epic");
      const first=tasksForEpic(e.id).filter(x=>(x.wave||"")===(t.wave||"")).map(x=>x.receivedDate||"9999").sort()[0];
      return{k:e.id+"|"+(t.wave||""),label:`◆ ${esc(e.code||e.name)} · ${t.wave?`<b>${esc(t.wave)}</b>`:"no wave"}${waveTarget(e,t.wave)?` <span class="faint">🎯 ${waveTarget(e,t.wave)}</span>`:""}`,
        rank:EPIC_GROUP_RANK[e.status],sl:epicLabel(e)+"|"+first};}
    case "status":return{k:t.status,label:`<span class="pill ${STATUS[t.status].cls}">${STATUS[t.status].label}</span>`,rank:STATUS_RANK[t.status]};
    case "system":{if(!t.system)return none("No system");const m=tierMeta(t.system);
      return{k:t.system,label:`<b class="mono">${esc(t.system)}</b>${m?` <span class="faint">${m.label}</span>`:""}`,rank:0,sl:t.system};}
    case "due":{const d=earliestOpenDue(t);if(!d)return{k:"none",label:`<span class="faint">No due date</span>`,rank:4};const n=daysUntil(d);
      return n<0?{k:"over",label:`<span style="color:var(--red)">⚑ Overdue</span>`,rank:0}:n<=7?{k:"week",label:"Due within 7 days",rank:1}
        :n<=30?{k:"month",label:"Due within 30 days",rank:2}:{k:"later",label:"Due later",rank:3};}
    case "next":{const n=t.nextAction;if(!n||!n.date||t.status==="closed")return{k:"none",label:`<span class="faint">No next action</span>`,rank:3};
      return n.date<=todayStr()?{k:"due",label:`<span style="color:var(--amber)">⏰ Next action due</span>`,rank:0}
        :daysUntil(n.date)<=7?{k:"week",label:"⏰ Within 7 days",rank:1}:{k:"later",label:"⏰ Later",rank:2};}
    default:{const val=t[g];return val?{k:val,label:esc(val),rank:0,sl:val}:none("No "+DV_GROUPS[g].toLowerCase());}
  }
}
function dvCollapsed(key){try{return new Set(JSON.parse(viewPref(key,"[]")));}catch(e){return new Set();}}
/* the one-line summary of the view, as chips: click to change, ✕ to remove */
function dvChipList(v){const c=[];
  c.push({t:`▦ ${v.group==="none"?"Not grouped":"Group: "+DV_GROUPS[v.group]}`,open:1,rm:v.group!=="none"?x=>{x.group="none";}:null});
  c.push({t:`↕ ${DV_SORTS[v.sort].label} ${v.dir==="asc"?"↑":"↓"}`,flip:1});
  if(v.status.length)c.push({t:"Status: "+v.status.map(s=>STATUS[s].label).join(", "),rm:x=>{x.status=[];}});
  else{if(v.hideClosed)c.push({t:"Closed hidden",rm:x=>{x.hideClosed=false;}});
    if(v.hideDelivered)c.push({t:"Delivered hidden",rm:x=>{x.hideDelivered=false;}});}
  Object.entries(v.f).forEach(([k,val])=>{const e=k==="epic"&&val!=="__none"?epicById(val):null;
    c.push({t:`${DV_FIELDS[k]}: ${k==="epic"?(val==="__none"?"none":(e?epicLabel(e):"?")):val}`,rm:x=>{delete x.f[k];}});});
  v.only.forEach(k=>c.push({t:"Only: "+DV_ONLY[k].toLowerCase(),rm:x=>{x.only=x.only.filter(y=>y!==k);}}));
  return c;}
function dvFilterCount(v){return dvChipList(v).length-2;}
function renderDemandSidebar(){
  {const v=dvGet();if(v.f.epic&&v.f.epic!=="__none"&&!epicById(v.f.epic)){delete v.f.epic;dvSet(v);}} /* epic deleted since */
  const v=dvGet(),saved=dvSaved(),n=dvFilterCount(v),cur=saved.find(s=>dvSame(s.view,v));
  document.getElementById("side").innerHTML=`
    <div class="side-tools">
      <div class="dvviews">${saved.map(s=>`<button class="dvview ${cur&&cur.id===s.id?"on":""}" data-id="${s.id}" title="Apply this saved view">${esc(s.name)}</button>`).join("")}${cur?"":`<button class="dvview save" id="dvSave" title="Save the current grouping, sort and filters as a one-click view">★ Save view</button>`}</div>
      <div class="dvbar"><div class="dvq"><input id="dvQ" placeholder="Filter: ID, title, object, TR…" value="${esc(dvQuery)}" autocomplete="off"><button class="ghost sm ${dvQuery?"":"hide"}" id="dvQx" title="Clear">✕</button></div>
        <button class="sm" id="dvOpen" title="Group, sort and filter the list">⚙ View${n?`<b class="dvn">${n}</b>`:""}</button></div>
      <div class="dvchips" id="dvChips"></div>

function renderList(){
  const el=document.getElementById("taskList");if(!el)return;
  const v=dvGet(),cidx=clashIndex();
  const list=dvSort(state.tasks.filter(dvMatches(v,cidx)),v,cidx);
  if(!list.length){el.innerHTML=state.tasks.length
    ?`<div class="empty">No demands match this view.<br><a id="dvNone" style="cursor:pointer">Clear the filters</a></div>`
    :`<div class="empty">No demands yet.<br>Click <b>＋ New Demand</b>.</div>`;
    const c=el.querySelector("#dvNone");if(c)c.onclick=()=>{dvQuery="";dvSet({group:v.group,sort:v.sort,dir:v.dir});renderDemandSidebar();};return;}
  if(v.group==="none"){el.innerHTML=list.map(t=>demandCard(t,false,cidx)).join("");}
  else{
    /* one collapsible block per group; the chosen sort order is kept inside each block */
    const groups=new Map();
    list.forEach(t=>{const g=dvGroupOf(t,v.group);if(!groups.has(g.k))groups.set(g.k,{...g,ts:[]});groups.get(g.k).ts.push(t);});
    const gs=[...groups.values()].sort((a,b)=>a.rank-b.rank||String(a.sl??a.label).localeCompare(String(b.sl??b.label),undefined,{numeric:true}));
    const ckey=v.group==="epic"?"epicCollapsed":"collapsed."+v.group; /* collapsed blocks remembered per grouping */
    const coll=dvCollapsed(ckey),act=state.tasks.find(t=>t.id===activeId),today=todayStr();
    el.innerHTML=gs.map(g=>{const gid=g.k||"__none",ts=g.ts;
      const shut=coll.has(gid)&&!(act&&ts.includes(act));
      const total=v.group==="epic"?(g.epic?tasksForEpic(g.epic.id).length:state.tasks.filter(t=>!epicById(t.epicId)).length):ts.length;
      const open=ts.filter(t=>!["delivered","closed"].includes(t.status)).length;
      const over=ts.filter(t=>{const d=earliestOpenDue(t);return d&&d<today;}).length;
      return `<div class="egroup ${shut?"shut":""}" data-g="${esc(gid)}">
        <div class="eghead" title="${shut?"Expand":"Collapse"}">
          <span class="egtw">${shut?"▶":"▼"}</span>

          ${over&&v.group!=="due"?`<span class="lc-badge" style="color:var(--red)">⚑ ${over}</span>`:""}
          <span class="egcount" title="${ts.length} shown${total>ts.length?" of "+total+" in this epic":""}">${open&&open<ts.length?`${open} open · `:""}${ts.length}${total>ts.length?`<span class="faint">/${total}</span>`:""}</span>
          ${g.epic?`<button class="ghost sm eggo" data-e="${g.epic.id}" title="Open the epic">›</button>`:""}
        </div>
        ${shut?"":`<div class="egbody">${ts.map(t=>demandCard(t,v.group==="epic"&&!!g.epic,cidx)).join("")}</div>`}</div>`;}).join("");
    el.querySelectorAll(".eghead").forEach(h=>h.onclick=ev=>{
      if(ev.target.classList.contains("eggo")){view="epics";activeEpicId=ev.target.dataset.e;epicTab="overview";renderApp();return;}
      const gid=h.parentElement.dataset.g,c=dvCollapsed(ckey);if(c.has(gid))c.delete(gid);else c.add(gid);
      setViewPref(ckey,JSON.stringify([...c]));renderList();});
  }
  el.querySelectorAll(".tcard").forEach(c=>c.onclick=()=>{activeId=c.dataset.id;activeTab="work";renderApp();});
}

  function drawReadiness(){

    if(!t.transports.length){host.innerHTML="";return;}
    const target=goliveTargetFor(t),routed=t.transports.filter(tr=>trTargets(t,tr).length),missing=routed.filter(tr=>!trComplete(t,tr));
    const own=t.transports.filter(tr=>trDest(t,tr).length).length,ok=routed.length&&!missing.length;
    const frozen=[...new Set(missing.flatMap(m=>trMissing(t,m)))].map(x=>[x,freezeFor(x)]).filter(x=>x[1]);
    host.innerHTML=`<div class="readybar ${routed.length?(ok?"ok":"warn"):""}">
      <span>Go-live target</span>
      <select id="rdy-sys" style="width:auto" title="Where transports go when they have no destinations of their own">${systemOptions(target)}</select>
      ${own?`<span class="faint" style="font-size:12px">· ${own} transport(s) have their own destinations</span>`:""}
      ${routed.length?(ok
        ?`<b style="color:var(--green)">✓ all ${routed.length} transport(s) have reached their destinations</b>`
        :`<b style="color:var(--amber)">⚠ ${missing.length} of ${routed.length} not complete:</b> <span class="mono" style="font-size:12px">${missing.map(m=>esc(m.number||"(unnumbered)")+" → "+esc(trMissing(t,m).join("/"))+(isCust(m)&&m.client?" · 🗂"+esc(m.client):"")).join(", ")}</span>`)
        :`<span class="faint">pick a go-live target, or give the transports their own destinations</span>`}
      ${frozen.map(([x,f])=>`<b style="color:var(--teal)">❄ ${esc(x)} is FROZEN until ${f.to} — ${esc(f.title)}</b>`).join(" ")}</div>`;
    host.querySelector("#rdy-sys").onchange=e=>{t.goliveTarget=e.target.value;touch(t);drawReadiness();drawTrs();};
  }

  function drawTrs(){
    const host=body.querySelector("#trList");host.innerHTML="";const cidx=clashIndex();
    if(!t.transports.length){host.innerHTML=`<div class="faint" style="font-size:12px;padding:4px 2px">No transports yet.</div>`;return;}
    t.transports.forEach((tr,idx)=>{
      const toc=tocFor(t,tr);const reached=reachedSystems(t,tr);const target=goliveTargetFor(t);const cust=isCust(tr);
      const card=document.createElement("div");card.className="trcard"+(cust?" cust":"");
      const tocOpts=`<option value="">— not bundled —</option>`+(t.tocs||[]).map(c=>`<option value="${c.id}" ${c.id===tr.tocId?"selected":""}>${esc(c.number||"(unnamed ToC)")}</option>`).join("");
      card.innerHTML=`
        <div class="trtop">
          <span class="seq">${idx+1}</span>
          <span class="reorder"><button class="ghost sm up" title="Move up" ${idx===0?"disabled":""}>↑</button><button class="ghost sm down" title="Move down" ${idx===t.transports.length-1?"disabled":""}>↓</button></span>
          <input class="mono num" value="${esc(tr.number)}" placeholder="H03K9..">
          <input class="dsc" value="${esc(tr.desc)}" placeholder="Short description">
          <select class="kind" title="Workbench = client-independent · Customizing = client-specific">
            <option value="workbench" ${!cust?"selected":""}>🔧 Workbench</option>
            <option value="customizing" ${cust?"selected":""}>🗂 Customizing</option></select>
          <select class="org" title="Origin system">${systemOptions(tr.system)}</select>
          <select class="cli ${cust?"":"hide"}" title="Origin client (mandant)">${clientOptions(tr.system,tr.client)}</select>
          <label style="display:flex;align-items:center;gap:5px;text-transform:none;font-size:12px;color:var(--muted);margin:0"><input type="checkbox" class="rel" ${tr.released?"checked":""} style="width:auto">Released</label>
          <button class="ghost sm danger del">🗑</button>
        </div>
        <canvas class="trroute" title="Where this transport has reached — ringed system = go-live target"></canvas>
        ${destHTML(t,tr)}
        ${trClashHtml(t,tr,cidx)}
        <div style="display:flex;gap:14px;flex-wrap:wrap">
          <div style="flex:1;min-width:260px">
            <label>Synced to systems (directly)</label>
            <div class="syncs"></div>
            <button class="sm addsync" style="margin-top:4px">＋ Add sync target</button>
          </div>
          <div style="flex:0 0 230px">
            <label>Bundled in Transport of Copies</label>
            <select class="tocsel">${tocOpts}</select>
            ${toc&&toc.syncs.filter(s=>s.system).length?`<div class="chiprow" style="margin-top:6px">${toc.syncs.filter(s=>s.system).map(s=>`<span class="sys ${sysTierCls(s.system)}" title="via ToC ${esc(toc.number)}">${esc(s.system)}<span class="d">via ToC</span>${cust&&tr.client?" · <span class='d'>🗂 "+esc(tr.client)+"</span>":""}${s.date?" · <span class='d'>"+s.date+"</span>":""}</span>`).join("")}</div>`:(toc?`<div class="faint" style="font-size:11px;margin-top:6px">ToC not moved anywhere yet</div>`:"")}
            <label style="margin-top:10px">Notes</label>
            <input class="notes" value="${esc(tr.notes)}">
          </div>
        </div>
        <div style="margin-top:8px"><label>Objects in this TR</label><div class="objlink"></div></div>`;
      const q=s=>card.querySelector(s);
      if(benchOn())DK.scope(q(".trroute"),trRouteDraw(t,tr));
      /* destinations: add a whole route (H43 → H42 → H41) or single systems; a pending one can be ticked reached */
      q(".dadd").onchange=e=>{const v=e.target.value;if(!v)return;tr.dest=tr.dest||[];
        const add=v.startsWith("L:")?routeTiers().map(d=>v.slice(2)+d):[v];
        add.forEach(x=>{if(!tr.dest.includes(x))tr.dest.push(x);});touch(t);drawTrs();drawReadiness();};
      card.querySelectorAll(".dchip").forEach(ch=>{const x=ch.dataset.s,rm=ch.querySelector(".x");
        if(rm)rm.onclick=ev=>{ev.stopPropagation();tr.dest=(tr.dest||[]).filter(y=>y!==x);touch(t);drawTrs();drawReadiness();};
        if(ch.classList.contains("no"))ch.onclick=()=>{tr.syncs.push({system:x,date:todayStr()});touch(t);drawTrs();drawReadiness();toast(`Recorded ${tr.number||"the transport"} reached ${x} today`);};});
      {const dr=q(".dreset");if(dr)dr.onclick=()=>{tr.dest=[];touch(t);drawTrs();drawReadiness();};}
      q(".num").onchange=e=>{tr.number=e.target.value;touch(t);drawReadiness();};
      q(".dsc").onchange=e=>{tr.desc=e.target.value;touch(t);};
      q(".kind").onchange=e=>{tr.kind=e.target.value;if(tr.kind!=="customizing")tr.client="";touch(t);drawTrs();drawReadiness();};
      q(".org").onchange=e=>{tr.system=e.target.value;if(tr.client&&!clientsForSystem(tr.system).includes(tr.client))tr.client="";touch(t);drawTrs();drawReadiness();};
      const cliSel=q(".cli");if(cliSel)cliSel.onchange=e=>{tr.client=e.target.value;touch(t);drawTrs();drawReadiness();};
      q(".rel").onchange=e=>{tr.released=e.target.checked;touch(t);};
      q(".notes").onchange=e=>{tr.notes=e.target.value;touch(t);};
      q(".tocsel").onchange=e=>{tr.tocId=e.target.value;touch(t);drawTrs();drawReadiness();};
      q(".del").onclick=()=>{if((tr.number||tr.syncs.some(x=>x.system))&&!confirm(`Delete transport ${tr.number||"(unnumbered)"}? Its sync history goes with it.`))return;t.transports=t.transports.filter(x=>x.id!==tr.id);touch(t);renderTransports(body,t);renderDetail();};
      q(".up").onclick=()=>{if(idx>0){[t.transports[idx-1],t.transports[idx]]=[t.transports[idx],t.transports[idx-1]];touch(t);drawTrs();drawReadiness();}};
      q(".down").onclick=()=>{if(idx<t.transports.length-1){[t.transports[idx+1],t.transports[idx]]=[t.transports[idx],t.transports[idx+1]];touch(t);drawTrs();drawReadiness();}};
      const syncHost=q(".syncs");
      const drawSyncs=()=>{syncHost.innerHTML="";
        tr.syncs.forEach((sy,i)=>{const r=document.createElement("div");r.className="syncrow";
          r.innerHTML=`<select class="s-sys">${systemOptions(sy.system)}</select><input type="date" class="s-date" value="${sy.date||""}"><button class="ghost sm danger s-del">✕</button>`;
          r.querySelector(".s-sys").onchange=e=>{sy.system=e.target.value;touch(t);drawReadiness();drawTrs();};
          r.querySelector(".s-date").onchange=e=>{sy.date=e.target.value;touch(t);};
          r.querySelector(".s-del").onclick=()=>{tr.syncs.splice(i,1);touch(t);drawSyncs();drawReadiness();};
          syncHost.appendChild(r);});
        if(tr.syncs.filter(s=>s.system).length){const chips=document.createElement("div");chips.className="chiprow";chips.innerHTML=tr.syncs.filter(s=>s.system).map(s=>sysPill(s.system,s.date,cust?tr.client:"")).join("");syncHost.appendChild(chips);}
      };
      q(".addsync").onclick=()=>{tr.syncs.push({system:"",date:todayStr()});touch(t);drawSyncs();};
      drawSyncs();
      const ol=q(".objlink");
      const drawOl=()=>{tr.objectIds=tr.objectIds||[];
        const linked=tr.objectIds.map(id=>t.objects.find(o=>o.id===id)).filter(Boolean);
        ol.innerHTML=linked.map(o=>`<span class="chip" data-id="${o.id}">${esc(o.name||"(obj)")} <span class="x">✕</span></span>`).join("")+`<button class="ghost sm pickobj">＋ object</button>`;
        ol.querySelectorAll(".chip").forEach(ch=>ch.querySelector(".x").onclick=()=>{tr.objectIds=tr.objectIds.filter(x=>x!==ch.dataset.id);touch(t);drawOl();});
        ol.querySelector(".pickobj").onclick=()=>openObjPicker(t,tr,drawOl);
      };
      drawOl();
      host.appendChild(card);
    });
  }

  function drawTocs(){
    const host=body.querySelector("#tocList");host.innerHTML="";
    const tocs=t.tocs||[];
    if(!tocs.length){host.innerHTML=`<div class="faint" style="font-size:12px;padding:4px 2px">No Transports of Copies. Create one, then bundle TRs into it above — the bundled TRs inherit wherever the ToC is moved.</div>`;return;}
    tocs.forEach(c=>{
      const members=t.transports.filter(tr=>tr.tocId===c.id);
      const card=document.createElement("div");card.className="trcard toc";
      card.innerHTML=`
        <div class="trtop">
          <span class="toctag">ToC</span>
          <input class="mono cnum" value="${esc(c.number)}" placeholder="ToC number">
          <input class="cdsc" value="${esc(c.desc)}" placeholder="Description">
          <span class="faint" style="font-size:12px;white-space:nowrap">📦 ${members.length} TR(s)</span>
          <button class="ghost sm danger cdel">🗑</button>
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap">
          <div style="flex:1;min-width:260px"><label>ToC moved to systems</label><div class="csyncs"></div><button class="sm caddsync" style="margin-top:4px">＋ Add sync target</button></div>
          <div style="flex:0 0 230px"><label>Bundled TRs</label><div class="faint mono" style="font-size:12px">${members.map(m=>esc(m.number||"(unnumbered)")).join(", ")||"—"}</div><label style="margin-top:10px">Notes</label><input class="cnotes" value="${esc(c.notes)}"></div>
        </div>`;
      const q=s=>card.querySelector(s);
      q(".cnum").onchange=e=>{c.number=e.target.value;touch(t);drawTrs();drawReadiness();};
      q(".cdsc").onchange=e=>{c.desc=e.target.value;touch(t);};
      q(".cnotes").onchange=e=>{c.notes=e.target.value;touch(t);};
      q(".cdel").onclick=()=>{if(members.length&&!confirm("Delete this ToC? "+members.length+" TR(s) will become un-bundled."))return;t.transports.forEach(tr=>{if(tr.tocId===c.id)tr.tocId="";});t.tocs=t.tocs.filter(x=>x.id!==c.id);touch(t);renderTransports(body,t);};
      const sh=q(".csyncs");
      const drawCs=()=>{sh.innerHTML="";
        c.syncs.forEach((sy,i)=>{const r=document.createElement("div");r.className="syncrow";
          r.innerHTML=`<select class="s-sys">${systemOptions(sy.system)}</select><input type="date" class="s-date" value="${sy.date||""}"><button class="ghost sm danger s-del">✕</button>`;
          r.querySelector(".s-sys").onchange=e=>{sy.system=e.target.value;touch(t);drawTrs();drawReadiness();};
          r.querySelector(".s-date").onchange=e=>{sy.date=e.target.value;touch(t);drawTrs();};
          r.querySelector(".s-del").onclick=()=>{c.syncs.splice(i,1);touch(t);drawCs();drawTrs();drawReadiness();};
          sh.appendChild(r);});
        if(c.syncs.filter(s=>s.system).length){const chips=document.createElement("div");chips.className="chiprow";chips.innerHTML=c.syncs.filter(s=>s.system).map(s=>sysPill(s.system,s.date)).join("");sh.appendChild(chips);}
      };
      q(".caddsync").onclick=()=>{c.syncs.push({system:"",date:todayStr()});touch(t);drawCs();};
      drawCs();
      host.appendChild(card);
    });
  }
}

function routeTiers(){return state.settings.tiers.map(x=>x.d).sort().reverse();}   /* "3","2","1" = Dev → QA → Prod */
function destHTML(t,tr){const own=trDest(t,tr),T=trTargets(t,tr),R=reachedSystems(t,tr),when={};
  effectiveSyncs(t,tr).forEach(x=>{if(!when[x.system])when[x.system]=x.date;});
  const done=T.length&&T.every(x=>R.has(x)),tiers=routeTiers();
  return `<div class="dests"><span class="dl ${done?"ok":""}">${done?"✓ complete":"Destinations"}</span>
    ${T.map(x=>{const ok=R.has(x);return `<span class="dchip ${ok?"ok":"no"}" data-s="${esc(x)}" title="${ok?"Reached"+(when[x]?" "+when[x]:""):"Not there yet — click to record it reached today"}">${ok?"✓":"○"} ${esc(x)}${ok&&when[x]?` <span class="d">${when[x]}</span>`:""}${own.length?`<span class="x" title="Remove this destination">✕</span>`:""}</span>`;}).join("")||`<span class="faint">none yet</span>`}
    ${own.length?`<button class="ghost sm dreset" title="Drop these and follow the demand's go-live target again">↺ use go-live target</button>`:`<span class="faint dhint">(the demand's go-live target)</span>`}
    <select class="dadd" title="Where this transport has to end up — e.g. built in H03, only ever synced to H43 → H42 → H41"><option value="">＋ destination…</option>
      <optgroup label="Whole route">${state.settings.landscapes.map(L=>`<option value="L:${esc(L)}">${esc(L)} route — ${tiers.map(d=>esc(L+d)).join(" → ")}</option>`).join("")}</optgroup>
      <optgroup label="Single system">${state.settings.landscapes.flatMap(L=>tiers.map(d=>L+d)).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</optgroup></select></div>`;}
function csvCell(v){v=(v==null?"":String(v));return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportTransportsCSV(){
  const tier=id=>{const m=tierMeta(id);return m?m.short:"";};
  const head=["Demand ID","Demand Title","Demand Status","Seq","TR Number","TR Description","Kind","Origin System","Origin Tier","Client","Released","Direct syncs","ToC Number","Effective syncs (incl. via ToC)","Destinations","Complete","Notes"];
  const rows=[head];
  state.tasks.forEach(t=>t.transports.forEach((tr,idx)=>{
    const direct=tr.syncs.filter(s=>s.system).map(s=>`${s.system} (${tier(s.system)})${s.date?" @"+s.date:""}`).join("; ");
    const toc=tocFor(t,tr);
    const eff=effectiveSyncs(t,tr).map(s=>`${s.system} (${tier(s.system)})${s.date?" @"+s.date:""}${s.via?" [via ToC "+s.via+"]":""}`).join("; ");
    rows.push([t.demandId,t.title,STATUS[t.status].label,idx+1,tr.number,tr.desc,isCust(tr)?"Customizing":"Workbench",tr.system,tier(tr.system),isCust(tr)?tr.client:"",tr.released?"Yes":"No",direct,toc?toc.number:"",eff,trTargets(t,tr).join(" → "),trComplete(t,tr)?"Yes":"No",tr.notes]);
  }));
  if(rows.length===1){toast("No transports to export",true);return;}
  const csv="﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
  const b=new Blob([csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="transports-"+todayStr()+".csv";a.click();URL.revokeObjectURL(a.href);
  toast("Exported "+(rows.length-1)+" transports (CSV)");
}

/* ----- TECH SPEC ----- */
function specSubsHtml(list){return `<ul>${list.map(s=>`<li>[${s.done?"✓":"&nbsp;"}] ${esc(s.title)}${s.dueDate?` <i>(due ${s.dueDate})</i>`:""}${s.children.length?specSubsHtml(s.children):""}</li>`).join("")}</ul>`;}
function specSubsMd(list,d){let o="";list.forEach(s=>{o+=`${"  ".repeat(d)}- [${s.done?"x":" "}] ${s.title}${s.dueDate?` _(due ${s.dueDate})_`:""}\n`;o+=specSubsMd(s.children,d+1);});return o;}
function buildTechSpecHTML(t){
  const calls=meetingsForTask(t.id);
  return `<h1>Post-Delivery Technical Specification</h1>
   <h2>${esc(t.demandId||"(no demand id)")} — ${esc(t.title)}</h2>
   <p class="meta"><b>Type:</b> ${esc(t.type)} &nbsp;|&nbsp; <b>Status:</b> ${STATUS[t.status].label} &nbsp;|&nbsp; <b>System:</b> ${esc(t.system)||"—"}${t.client?" / "+esc(t.client):""} &nbsp;|&nbsp; <b>Requestor:</b> ${esc(t.requestor)||"—"} &nbsp;|&nbsp; <b>Received:</b> ${t.receivedDate||"—"} &nbsp;|&nbsp; <b>Due:</b> ${t.dueDate||"—"} &nbsp;|&nbsp; <b>Generated:</b> ${todayStr()}</p>
   ${(()=>{const e=epicById(t.epicId);return e?`<p class="meta"><b>Epic:</b> ${esc(epicLabel(e))}${e.owner?" ("+esc(e.owner)+")":""}</p>`:"";})()}
   ${(t.project||t.theme)?`<p class="meta"><b>Project:</b> ${esc(t.project)||"—"} &nbsp;|&nbsp; <b>Theme:</b> ${esc(t.theme)||"—"}</p>`:""}
   ${(reworkCount(t)||deliveredDates(t).length)?`<p class="meta"><b>Delivered:</b> ${deliveredDates(t).join(", ")||"—"} &nbsp;|&nbsp; <b>Rework cycles:</b> ${reworkCount(t)}</p>`:""}
   <h3>1. Functional Requirement</h3><p>${esc(t.description)||"<i>none captured</i>"}</p>
   <h3>2. Work Breakdown (as delivered)</h3>${t.subtasks.length?specSubsHtml(t.subtasks):"<p><i>no subtasks</i></p>"}
   <h3>3. Objects Changed</h3>${t.objects.length?`<table><tr><th>Object</th><th>Type</th><th>Action</th><th>Description</th><th>In TR(s)</th></tr>${t.objects.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.type)}</td><td>${esc(o.action)}</td><td>${esc(o.desc)}</td><td>${trsForObject(t,o.id).map(x=>esc(x.number||"")).join(", ")||"—"}</td></tr>`).join("")}</table>`:"<p><i>none logged</i></p>"}
   <h3>4. Transports</h3>${t.transports.length?`<table><tr><th>#</th><th>TR</th><th>Kind</th><th>Origin</th><th>Reached (incl. via ToC)</th><th>Destinations</th><th>ToC</th><th>Released</th></tr>${t.transports.map((tr,i)=>{const toc=tocFor(t,tr);const cl=isCust(tr)&&tr.client?" / "+esc(tr.client):"";return `<tr><td>${i+1}</td><td>${esc(tr.number)}${tr.desc?" – "+esc(tr.desc):""}</td><td>${isCust(tr)?"Customizing":"Workbench"}</td><td>${esc(tr.system)}${cl}</td><td>${effectiveSyncs(t,tr).map(s=>esc(s.system)+cl+(s.date?" ("+s.date+")":"")+(s.via?" via ToC":"")).join(", ")||"—"}</td><td>${esc(trTargets(t,tr).join(" → "))||"—"}${trComplete(t,tr)?" ✓":""}</td><td>${toc?esc(toc.number):"—"}</td><td>${tr.released?"Yes":"No"}</td></tr>`;}).join("")}</table>${(t.tocs&&t.tocs.length)?`<p style="margin-top:6px"><b>Transports of Copies:</b> ${t.tocs.map(c=>esc(c.number)+(c.syncs.filter(s=>s.system).length?" → "+c.syncs.filter(s=>s.system).map(s=>esc(s.system)).join(", "):"")).join(" · ")}</p>`:""}`:"<p><i>none logged</i></p>"}
   <h3>5. Decisions &amp; Clarifications (from meetings)</h3>${calls.length?calls.map(c=>`<p><b>${c.date} — ${esc(c.title)}</b> ${c.team?"["+esc(c.team)+"] ":""}${c.attendees?"("+esc(c.attendees)+")":""}</p><div class="note">${esc(c.body)}</div>`).join(""):"<p><i>no linked meetings</i></p>"}
   <h3>6. Working Notes &amp; Change History</h3><div class="note">${esc(t.notes)||"<i>none</i>"}</div>${(t.comments&&t.comments.length)?`<p style="margin-top:8px"><b>Comments:</b></p><ul>${t.comments.map(c=>`<li><i>${fmtTs(c.ts)}</i> — ${esc(c.text)}</li>`).join("")}</ul>`:""}
   ${(t.reference&&t.reference.length)?`<h3>7. Reference / Endpoints</h3><table><tr><th>Label</th><th>Value</th></tr>${t.reference.map(r=>`<tr><td>${esc(r.label)}</td><td>${r.secret?"<i>(secret — held in app)</i>":esc(r.value)}</td></tr>`).join("")}</table>`:""}`;
}
function buildTechSpecMarkdown(t){
  const calls=meetingsForTask(t.id);const L=[];
  L.push(`# Post-Delivery Technical Specification`,``,`## ${t.demandId||"(no demand id)"} — ${t.title}`,``);
  L.push(`- **Type:** ${t.type}`,`- **Status:** ${STATUS[t.status].label}`,`- **System:** ${t.system||"—"}${t.client?" / "+t.client:""}`,`- **Requestor:** ${t.requestor||"—"}`);
  {const e=epicById(t.epicId);if(e)L.push(`- **Epic:** ${epicLabel(e)}${e.owner?" ("+e.owner+")":""}`);}
  if(t.project||t.theme)L.push(`- **Project:** ${t.project||"—"} | **Theme:** ${t.theme||"—"}`);
  L.push(`- **Received:** ${t.receivedDate||"—"} | **Due:** ${t.dueDate||"—"}`);
  if(reworkCount(t)||deliveredDates(t).length)L.push(`- **Delivered:** ${deliveredDates(t).join(", ")||"—"} | **Rework cycles:** ${reworkCount(t)}`);
  L.push(`- **Spec generated:** ${todayStr()}`,``);
  L.push(`### 1. Functional Requirement`,t.description||"_(none captured)_",``);
  L.push(`### 2. Work Breakdown (as delivered)`,t.subtasks.length?specSubsMd(t.subtasks,0):"_(no subtasks)_",``);
  L.push(`### 3. Objects Changed`);
  if(t.objects.length){L.push(`| Object | Type | Action | Description | In TR(s) |`,`|---|---|---|---|---|`);t.objects.forEach(o=>L.push(`| ${o.name} | ${o.type} | ${o.action} | ${(o.desc||"").replace(/\n/g," ")} | ${trsForObject(t,o.id).map(x=>x.number||"").join(", ")||"—"} |`));}else L.push("_(none logged)_");
  L.push(``,`### 4. Transports`);
  if(t.transports.length){L.push(`| # | TR | Kind | Origin | Reached (incl. via ToC) | Destinations | ToC | Released |`,`|---|---|---|---|---|---|---|---|`);t.transports.forEach((tr,i)=>{const toc=tocFor(t,tr);const cl=isCust(tr)&&tr.client?" / "+tr.client:"";const sy=effectiveSyncs(t,tr).map(s=>`${s.system}${cl}${s.date?" ("+s.date+")":""}${s.via?" via ToC":""}`).join(", ");L.push(`| ${i+1} | ${tr.number}${tr.desc?" – "+tr.desc:""} | ${isCust(tr)?"Customizing":"Workbench"} | ${tr.system}${cl} | ${sy||"—"} | ${trTargets(t,tr).join(" → ")||"—"}${trComplete(t,tr)?" ✓":""} | ${toc?toc.number:"—"} | ${tr.released?"Yes":"No"} |`);});if(t.tocs&&t.tocs.length){L.push(``,`**Transports of Copies:** `+t.tocs.map(c=>c.number+(c.syncs.filter(s=>s.system).length?" → "+c.syncs.filter(s=>s.system).map(s=>s.system).join(", "):"")).join(" · "));}}else L.push("_(none logged)_");
  L.push(``,`### 5. Decisions & Clarifications (from meetings)`);
  if(calls.length)calls.forEach(c=>{L.push(`**${c.date} — ${c.title}** ${c.team?"["+c.team+"] ":""}${c.attendees?"("+c.attendees+")":""}`,``,c.body||"",``);});else L.push("_(no linked meetings)_");
  L.push(``,`### 6. Working Notes & Change History`,t.notes||"_(none)_");
  if(t.comments&&t.comments.length){L.push(``,`**Comments:**`);t.comments.forEach(c=>L.push(`- _${fmtTs(c.ts)}_ — ${c.text.replace(/\n/g," ")}`));}
  if(t.reference&&t.reference.length){L.push(``,`### 7. Reference / Endpoints`,`| Label | Value |`,`|---|---|`);t.reference.forEach(r=>L.push(`| ${r.label} | ${r.secret?"(secret — held in app)":(r.value||"").replace(/\n/g," ")} |`));}
  return L.join("\n");
}

/* ----- WEEKLY SUMMARY ----- */
function weekStartOf(offset){const d=new Date(todayStr()+"T00:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);return d;}
function isoD(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function isoTs(ts){return isoD(new Date(ts));}
function weekData(offset){
  const s=weekStartOf(offset),e=new Date(s.getTime()+7*86400000);
  const s0=isoD(s),e0=isoD(new Date(e.getTime()-86400000));
  const inTs=ts=>ts>=s.getTime()&&ts<e.getTime();
  const inD=d=>d&&d>=s0&&d<=e0;
  const delivered=[],bugs=[],created=[],closed=[];
  state.tasks.forEach(t=>{
    (t.timeline||[]).forEach(ev=>{if(ev.type!=="status"||!inTs(ev.ts))return;
      if(ev.to==="delivered")delivered.push({t,ts:ev.ts});
      else if(ev.to==="bug")bugs.push({t,ts:ev.ts});
      else if(ev.to==="closed")closed.push({t,ts:ev.ts});});
    if(inTs(t.createdAt))created.push(t);
  });
  const moves=[];
  state.tasks.forEach(t=>{
    t.transports.forEach(tr=>tr.syncs.forEach(sy=>{if(sy.system&&inD(sy.date))moves.push({t,num:tr.number||"(TR)",sys:sy.system,date:sy.date,via:"",client:isCust(tr)?tr.client:""});}));
    (t.tocs||[]).forEach(c=>c.syncs.forEach(sy=>{if(sy.system&&inD(sy.date))moves.push({t,num:c.number||"(ToC)",sys:sy.system,date:sy.date,via:"ToC",client:""});}));
  });
  moves.sort((a,b)=>a.date.localeCompare(b.date));
  const journal=state.journal.filter(j=>inD(j.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const meetings=state.meetings.filter(m=>inD(m.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const findings=[];state.debug.forEach(sx=>sx.findings.forEach(f=>{if(inTs(f.ts))findings.push({s:sx,f});}));
  return {s0,e0,delivered,bugs,created,closed,moves,journal,meetings,findings};
}
function weekIsEmpty(w){return !w.delivered.length&&!w.bugs.length&&!w.created.length&&!w.closed.length&&!w.moves.length&&!w.journal.length&&!w.meetings.length&&!w.findings.length;}
function buildWeeklyHTML(w){
  const dl=t=>esc((t.demandId?t.demandId+" — ":"")+t.title);
  const sec=(title,inner)=>inner?`<h3>${title}</h3>${inner}`:"";
  const ul=items=>items.length?`<ul>${items.join("")}</ul>`:"";
  return `<h1>Weekly Summary</h1><h2>${w.s0} → ${w.e0}</h2>
    <p class="meta"><b>Delivered:</b> ${w.delivered.length} &nbsp;|&nbsp; <b>Bugs/rework raised:</b> ${w.bugs.length} &nbsp;|&nbsp; <b>New demands:</b> ${w.created.length} &nbsp;|&nbsp; <b>Closed:</b> ${w.closed.length} &nbsp;|&nbsp; <b>Transport moves:</b> ${w.moves.length} &nbsp;|&nbsp; <b>Generated:</b> ${todayStr()}</p>
    ${sec("Delivered this week",ul(w.delivered.map(x=>`<li>${dl(x.t)} <i>(${isoTs(x.ts)})</i></li>`)))}
    ${sec("Bugs / rework raised",ul(w.bugs.map(x=>`<li>${dl(x.t)} <i>(${isoTs(x.ts)})</i></li>`)))}
    ${sec("New demands received",ul(w.created.map(t=>`<li>${dl(t)}${t.requestor?` <i>— ${esc(t.requestor)}</i>`:""}</li>`)))}
    ${sec("Closed",ul(w.closed.map(x=>`<li>${dl(x.t)}</li>`)))}
    ${sec("Transport movements",w.moves.length?`<table><tr><th>Date</th><th>TR / ToC</th><th>To</th><th>Demand</th></tr>${w.moves.map(m=>`<tr><td>${m.date}</td><td>${esc(m.num)}${m.via?" ("+m.via+")":""}</td><td>${esc(m.sys)}${m.client?" / "+esc(m.client):""}</td><td>${dl(m.t)}</td></tr>`).join("")}</table>`:"")}
    ${sec("Meetings",ul(w.meetings.map(m=>`<li>👥 ${m.date}${m.team?" · "+esc(m.team):""} — ${esc(m.title)}${m.actions.length?` <i>(${m.actions.filter(a=>!a.done).length} open action(s))</i>`:""}</li>`)))}
    ${sec("Debug findings",ul(w.findings.map(({s,f})=>`<li><i>${esc(s.title)}:</i> ${esc(f.text)}</li>`)))}
    ${sec("Journal",w.journal.map(j=>`<p><b>${j.date}${j.title?" — "+esc(j.title):""}</b></p><div class="note">${esc(j.body)}</div>`).join(""))}
    ${weekIsEmpty(w)?"<p><i>Nothing recorded in this week.</i></p>":""}`;
}
function buildWeeklyMarkdown(w){
  const L=[];const dl=t=>(t.demandId?t.demandId+" — ":"")+t.title;
  L.push(`# Weekly Summary — ${w.s0} → ${w.e0}`,``);
  L.push(`Delivered: ${w.delivered.length} | Bugs/rework: ${w.bugs.length} | New demands: ${w.created.length} | Closed: ${w.closed.length} | TR moves: ${w.moves.length}`,``);
  const sec=(h,arr,fn)=>{if(arr.length){L.push(`### ${h}`);arr.forEach(x=>L.push("- "+fn(x)));L.push("");}};
  sec("Delivered this week",w.delivered,x=>`${dl(x.t)} (${isoTs(x.ts)})`);
  sec("Bugs / rework raised",w.bugs,x=>`${dl(x.t)} (${isoTs(x.ts)})`);
  sec("New demands received",w.created,t=>dl(t)+(t.requestor?` — ${t.requestor}`:""));
  sec("Closed",w.closed,x=>dl(x.t));
  sec("Transport movements",w.moves,m=>`${m.date} · ${m.num}${m.via?" ("+m.via+")":""} → ${m.sys}${m.client?" / "+m.client:""} · ${dl(m.t)}`);
  sec("Meetings",w.meetings,m=>`👥 ${m.date}${m.team?" · "+m.team:""} — ${m.title}${m.actions.length?` (${m.actions.filter(a=>!a.done).length} open action(s))`:""}`);
  sec("Debug findings",w.findings,({s,f})=>`${s.title}: ${f.text}`);
  if(w.journal.length){L.push(`### Journal`);w.journal.forEach(j=>{L.push(`**${j.date}${j.title?" — "+j.title:""}**`,``,j.body||"",``);});}
  if(weekIsEmpty(w))L.push("_Nothing recorded in this week._");
  return L.join("\n");
}
function openWeekly(){
  let off=0;const root=document.getElementById("modalRoot");
  const draw=()=>{
    const w=weekData(off);
    root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:780px"><h2>🗓 Weekly summary</h2>
      <p class="faint" style="font-size:12px;margin-top:-8px">Assembled from the timeline, transports, journal, meetings and debug findings — ready for a status report.</p>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
        <button class="sm" id="wk-prev">◀ prev</button>
        <b class="mono" style="font-size:13px">${w.s0} → ${w.e0}${off===0?" · this week":off===-1?" · last week":""}</b>
        <button class="sm" id="wk-next" ${off>=0?"disabled":""}>next ▶</button></div>
      <div class="specpaper specdoc">${buildWeeklyHTML(w)}</div>
      <div class="modal-foot"><button id="wk-copy">📋 Copy Markdown</button><button id="wk-md">⬇ Download .md</button><button id="wk-print">🖨 Print / Save PDF</button><button id="wk-close" class="primary">Close</button></div></div></div>`;
    const close=()=>root.innerHTML="";
    root.querySelector("#wk-close").onclick=close;
    root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
    root.querySelector("#wk-prev").onclick=()=>{off--;draw();};
    root.querySelector("#wk-next").onclick=()=>{if(off<0){off++;draw();}};
    root.querySelector("#wk-copy").onclick=()=>{navigator.clipboard.writeText(buildWeeklyMarkdown(w)).then(()=>toast("Markdown copied to clipboard")).catch(()=>toast("Copy failed",true));};
    root.querySelector("#wk-md").onclick=()=>{const b=new Blob([buildWeeklyMarkdown(w)],{type:"text/markdown"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="weekly-"+w.s0+".md";a.click();URL.revokeObjectURL(a.href);};
    root.querySelector("#wk-print").onclick=()=>{const pa=document.getElementById("printArea");pa.className="specdoc";pa.innerHTML=buildWeeklyHTML(w);window.print();};
  };
  draw();
}

  md.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();root.querySelector("#m-save").click();}});
  root.querySelector("#m-cancel").onclick=close;
  root.querySelector(".modal-bg").onclick=e=>{if(e.target!==root.querySelector(".modal-bg"))return;
    if(!edited||confirm(existing?"Discard your changes to this demand?":"Discard this new demand?"))close();};
  {const sy=root.querySelector("#m-sys"),cl=root.querySelector("#m-client");
   sy.onchange=()=>{cl.innerHTML=clientOptions(sy.value,"");};}
  root.querySelector("#m-title").focus();

    const won=g("#m-wait").trim();let wsince=g("#m-waitsince");if(won&&!wsince)wsince=todayStr();if(!won)wsince="";
    const data={demandId:g("#m-demand").trim(),type:g("#m-type"),title:g("#m-title").trim()||"(untitled)",requestor:g("#m-req").trim(),epicId:g("#m-epic"),wave:g("#m-wave").trim(),system:g("#m-sys"),client:g("#m-client"),project:g("#m-proj").trim(),theme:g("#m-theme").trim(),waiting:{on:won,since:wsince},receivedDate:g("#m-rec"),dueDate:g("#m-due"),status:g("#m-status"),description:g("#m-desc")};
    if(existing){if(existing.status!==data.status)logTimeline(existing,"status",existing.status,data.status);Object.assign(existing,data);touch(existing);}
    else{const nt={id:uid(),...data,goliveTarget:"",nextAction:{date:"",note:""},notes:"",timeline:[],subtasks:[],objects:[],transports:[],tocs:[],comments:[],reference:[],createdAt:Date.now(),updatedAt:Date.now()};
      logTimeline(nt,"status","",data.status);state.tasks.push(nt);activeId=nt.id;markDirty();}
    close();renderApp();};
}
function clientsUsedFor(sysId){return [...new Set(state.tasks.filter(t=>t.system===sysId&&t.client).map(t=>t.client))].sort();}
function distinctVals(field){return [...new Set(state.tasks.map(t=>t[field]).filter(Boolean))].sort();}
function logTimeline(t,type,from,to,note){(t.timeline=t.timeline||[]).push({id:uid(),ts:Date.now(),type,from,to,note:note||""});}
function reworkCount(t){return (t.timeline||[]).filter(e=>e.type==="status"&&e.to==="bug").length;}
function deliveredDates(t){return (t.timeline||[]).filter(e=>e.type==="status"&&e.to==="delivered").map(e=>dstr(new Date(e.ts)));}

function renderActionRollup(host){

    row.querySelector(".chk").onclick=()=>{a.done=true;touch(m);renderActionRollup(host);renderMeetingSidebar();};
    row.querySelector(".go").onclick=()=>{meetingRollup=false;activeMeetingId=m.id;renderApp();};
    const arEl=row.querySelector(".ares");if(arEl)arEl.onclick=()=>editInline(arEl,a.resolution||"",v=>{a.resolution=v;touch(m);renderActionRollup(host);});

function credLandscape(sys){return sys?String(sys).slice(0,-1):"";}

function credRow(c){const rv=revealPw[c.id];
  return `<tr data-id="${c.id}">

function wireCredRow(tr){const c=state.credentials.find(x=>x.id===tr.dataset.id);if(!c)return;
  tr.querySelector(".c-sys").onchange=e=>{c.system=e.target.value;if(c.client&&!clientsForSystem(c.system).includes(c.client))c.client="";c.updatedAt=Date.now();markDirty();drawVault();};
  const cliEl=tr.querySelector(".c-cli");if(cliEl)cliEl.onchange=e=>{c.client=e.target.value;c.updatedAt=Date.now();markDirty();};
  const bind=(sel,key)=>{const el=tr.querySelector(sel);if(el)el.onchange=e=>{c[key]=e.target.value;c.updatedAt=Date.now();markDirty();};};
  bind(".c-label","label");bind(".c-user","username");bind(".c-pass","password");bind(".c-url","url");bind(".c-notes","notes");
  tr.querySelector(".c-eye").onclick=()=>{revealPw[c.id]=!revealPw[c.id];drawVault();};
  tr.querySelector(".c-copy").onclick=()=>{navigator.clipboard.writeText(c.password).then(()=>toast("Password copied")).catch(()=>toast("Copy failed",true));};
  tr.querySelector(".c-del").onclick=()=>{if(confirm("Delete this credential?")){state.credentials=state.credentials.filter(x=>x.id!==c.id);delete revealPw[c.id];markDirty();renderVault();}};
}
function drawVault(){
  const body=document.getElementById("vaultBody");if(!body)return;
  const note=`<p class="faint" style="font-size:12px;margin-top:6px">2FA protects the login, but treat this file like a password manager export: keep encryption on and the file on your own drive.</p>`;
  if(!state.credentials.length){body.innerHTML=`<div class="faint" style="padding:16px;text-align:center">No credentials yet. Use “＋ Add credential”.</div>${note}`;return;}
  const groups={};state.credentials.forEach(c=>{const L=credLandscape(c.system)||"—";(groups[L]=groups[L]||[]).push(c);});
  const extra=Object.keys(groups).filter(k=>k!=="—"&&!state.settings.landscapes.includes(k)).sort();
  const order=[...state.settings.landscapes,...extra,"—"];
  const seen=new Set();let html="";
  const thead=`<thead><tr><th style="width:130px">System</th><th style="width:96px">Client</th><th>Label</th><th>Username</th><th style="width:200px">Password</th><th>URL</th><th>Notes</th><th style="width:34px"></th></tr></thead>`;
  order.forEach(L=>{if(seen.has(L))return;seen.add(L);const list=groups[L];if(!list||!list.length)return;
    list.sort((a,b)=>(a.system||"").localeCompare(b.system||"")||(a.client||"").localeCompare(b.client||"")||(a.label||"").localeCompare(b.label||""));
    const lbl=L==="—"?"Unassigned":("Landscape "+esc(L));
    html+=`<div class="sec-title" style="margin-top:6px"><h3>${lbl}</h3><div class="ln"></div><span class="faint" style="font-size:12px">${list.length} credential(s)</span></div>`;
    html+=`<div class="tbl-wrap"><table>${thead}<tbody>${list.map(credRow).join("")}</tbody></table></div>`;
  });
  body.innerHTML=html+note;
  body.querySelectorAll("tr[data-id]").forEach(wireCredRow);
}
async function openEncryptionDialog(){
  if(!state.settings.encryption){
    const pw=await promptPassword("🔒 Set master password (encrypts the whole file)",true);
    if(pw===null)return;
    state.settings.encryption=true;masterPassword=pw;markDirty();
    recryptSnapshots(null,pw); /* no plaintext snapshots left behind */
    toast("Encryption on — Save to write the encrypted file");renderApp();
    return;
  }
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:400px"><h2>🔒 Master password</h2>
    <p class="faint" style="font-size:12px">The file is currently encrypted. Lose this password and the data is unrecoverable — there is no backdoor.</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
      <button id="e-change">Change master password</button>
      <button id="e-remove" class="danger">Remove encryption (store as plain text)</button>
      <button id="e-close" class="primary">Cancel</button></div></div></div>`;
  const close=()=>root.innerHTML="";
  root.querySelector("#e-close").onclick=close;
  root.querySelector("#e-change").onclick=async()=>{close();const pw=await promptPassword("New master password",true);if(pw===null)return;const old=masterPassword;masterPassword=pw;recryptSnapshots(old,pw);markDirty();toast("Password changed — Save to apply");};
  root.querySelector("#e-remove").onclick=()=>{if(confirm("Remove encryption? The file will be saved as PLAIN TEXT, including any stored passwords.")){const old=masterPassword;state.settings.encryption=false;masterPassword=null;recryptSnapshots(old,null);markDirty();close();toast("Encryption removed — Save to write plain text");renderApp();}};
}

    host.innerHTML=`<div class="tbl-wrap" style="max-height:300px;overflow:auto"><table><tbody>${list.map((x,i)=>{const n=objTypeUsage(x);
      return `<tr data-i="${i}"><td style="width:26px;text-align:right" class="faint mono">${i+1}</td>
        <td><input class="ot-n" value="${esc(x)}"></td>
        <td style="width:74px" class="faint" title="Objects logged with this type">${n?n+" used":""}</td>
        <td style="width:96px;text-align:right;white-space:nowrap"><button class="ghost sm ot-up" ${i?"":"disabled"}>↑</button><button class="ghost sm ot-dn" ${i<list.length-1?"":"disabled"}>↓</button><button class="ghost sm danger ot-x">🗑</button></td></tr>`;}).join("")}</tbody></table></div>`;
    const save=arr=>{state.settings.objTypes=arr;markDirty();draw();};
    host.querySelectorAll("tr[data-i]").forEach(tr=>{const i=+tr.dataset.i,arr=objTypes().slice();
      tr.querySelector(".ot-n").onchange=ev=>{const v=ev.target.value.trim();
        if(!v){ev.target.value=arr[i];return;}
        if(arr.some((y,j)=>j!==i&&y===v)){toast("That type already exists",true);ev.target.value=arr[i];return;}
        arr[i]=v;save(arr);};
      tr.querySelector(".ot-up").onclick=()=>{if(i){[arr[i-1],arr[i]]=[arr[i],arr[i-1]];save(arr);}};
      tr.querySelector(".ot-dn").onclick=()=>{if(i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]];save(arr);}};
      tr.querySelector(".ot-x").onclick=()=>{
        if(arr.length===1){toast("Keep at least one type",true);return;}
        const n=objTypeUsage(arr[i]);
        if(n&&!confirm(`"${arr[i]}" is used by ${n} object(s).\n\nThose objects keep the type — it just won't be offered for new ones. Remove it from the list?`))return;
        arr.splice(i,1);save(arr);};});};
  const add=()=>{const el=root.querySelector("#ot-new"),v=el.value.trim();if(!v)return;
    const arr=objTypes().slice();
    if(arr.includes(v)){toast("That type already exists",true);return;}
    arr.push(v);state.settings.objTypes=arr;markDirty();el.value="";draw();el.focus();};
  root.querySelector("#ot-add").onclick=add;
  root.querySelector("#ot-new").onkeydown=ev=>{if(ev.key==="Enter")add();};
  root.querySelector("#ot-reset").onclick=()=>{if(confirm("Restore the built-in list of object types?\n\nObjects already logged keep their current type."))
    {state.settings.objTypes=[...DEF_OBJ_TYPES];markDirty();draw();}};
  const close=()=>{root.innerHTML="";if(onDone)onDone();};
  root.querySelector("#ot-close").onclick=close;
  root.querySelector(".modal-bg").onclick=ev=>{if(ev.target===root.querySelector(".modal-bg"))close();};
  draw();
}

        ${uses.map(u=>{const trs=trsForObject(u.t,u.o.id);return `<div style="font-size:12px;margin:3px 0 0 6px"><a class="oi-go" data-id="${u.t.id}" style="cursor:pointer">📋 ${esc(u.t.demandId||u.t.title)}</a> <span class="faint">— ${esc(u.o.action)}${u.o.desc?": "+esc(u.o.desc):""}${trs.length?" · in "+trs.map(x=>esc(x.number||"(TR)")).join(", "):""}</span></div>`;}).join("")}
        ${duses.map(u=>`<div style="font-size:12px;margin:3px 0 0 6px"><a class="oi-dgo" data-id="${u.s.id}" style="cursor:pointer">🐞 ${esc(u.s.title)}</a> <span class="faint">${u.note?"— "+esc(u.note):""}</span></div>`).join("")}</div>`;}).join("");

        ${(objs.size||trs.size)?`<div style="font-size:11px;margin:6px 0 0 6px" class="faint">${objs.size?"Objects: "+[...objs].map(esc).join(", "):""}${objs.size&&trs.size?" · ":""}${trs.size?"TRs: "+[...trs].map(esc).join(", "):""}</div>`:""}

/* ===================== AGING INSIGHTS ===================== */
function openAging(){
  const root=document.getElementById("modalRoot");
  const now=Date.now();
  const days=ms=>Math.floor(ms/86400000);
  const statusSince=t=>{let last=null;(t.timeline||[]).forEach(e=>{if(e.type==="status"&&(!last||e.ts>last))last=e.ts;});return last||t.createdAt;};
  const open=state.tasks.filter(t=>!["closed","delivered"].includes(t.status))
    .map(t=>({t,age:t.receivedDate?Math.max(0,-daysUntil(t.receivedDate)):days(now-t.createdAt),inStatus:days(now-statusSince(t))}))
    .sort((a,b)=>b.age-a.age);
  const leads=[];state.tasks.forEach(t=>{
    const first=(t.timeline||[]).filter(e=>e.type==="status"&&e.to==="delivered").map(e=>e.ts).sort((a,b)=>a-b)[0];
    if(first&&t.receivedDate){const lead=days(first-new Date(t.receivedDate+"T00:00:00").getTime());if(lead>=0)leads.push({t,lead,rw:reworkCount(t)});}});
  leads.sort((a,b)=>b.lead-a.lead);
  const avg=leads.length?Math.round(leads.reduce((s,x)=>s+x.lead,0)/leads.length):0;
  const med=leads.length?leads.map(x=>x.lead).sort((a,b)=>a-b)[Math.floor(leads.length/2)]:0;
  const ageCol=n=>n>30?"var(--red)":n>14?"var(--amber)":"var(--txt)";
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:760px"><h2>📈 Aging insights</h2>
    <p class="faint" style="font-size:12px;margin-top:-8px">How long things have been sitting, and how long delivery actually takes. Click a row to open the demand.</p>
    <div class="sec-title"><h3>Open demands by age</h3><div class="ln"></div><span class="faint" style="font-size:12px">${open.length} open · red &gt;30d · amber &gt;14d</span></div>
    ${open.length?`<div class="tbl-wrap"><table><thead><tr><th>Demand</th><th style="width:110px">Status</th><th style="width:64px">Age</th><th style="width:86px">In status</th><th style="width:150px">Waiting on</th><th style="width:100px">Due</th></tr></thead><tbody>
      ${open.map(({t,age,inStatus})=>`<tr class="ag-go" data-id="${t.id}" style="cursor:pointer"><td style="padding:7px 9px">${esc(t.demandId||"—")} · ${esc(t.title)}</td><td><span class="pill ${STATUS[t.status].cls}" style="font-size:10px">${STATUS[t.status].label}</span></td><td class="mono" style="color:${ageCol(age)};font-weight:700">${age}d</td><td class="mono">${inStatus}d</td><td style="font-size:12px">${isWaiting(t)?"⏳ "+esc(t.waiting.on)+(waitDays(t)!=null?" · "+waitDays(t)+"d":""):"—"}</td><td class="mono due ${dueClass(t.dueDate,t.status)}">${t.dueDate||"—"}</td></tr>`).join("")}</tbody></table></div>`
    :`<p class="faint">No open demands. 🎉</p>`}
    <div class="sec-title" style="margin-top:16px"><h3>Delivery lead times</h3><div class="ln"></div><span class="faint" style="font-size:12px">received → first delivered</span></div>
    ${leads.length?`<div class="stats" style="border:none;padding:0;margin-bottom:10px"><div class="stat"><b>${leads.length}</b>delivered</div><div class="stat op"><b>${avg}d</b>avg lead</div><div class="stat"><b>${med}d</b>median</div><div class="stat ov"><b>${leads.filter(x=>x.rw).length}</b>with rework</div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Demand</th><th style="width:100px">Lead time</th><th style="width:100px">Rework</th></tr></thead><tbody>
      ${leads.map(({t,lead,rw})=>`<tr class="ag-go" data-id="${t.id}" style="cursor:pointer"><td style="padding:7px 9px">${esc(t.demandId||"—")} · ${esc(t.title)}</td><td class="mono">${lead}d</td><td>${rw?`<span style="color:var(--red)">↻ ${rw}</span>`:"—"}</td></tr>`).join("")}</tbody></table></div>`
    :`<p class="faint">No delivered demands with a received date yet — lead times appear once you deliver.</p>`}
    <div class="modal-foot"><button id="ag-close" class="primary">Close</button></div></div></div>`;
  const close=()=>root.innerHTML="";
  root.querySelector("#ag-close").onclick=close;
  root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
  root.querySelectorAll(".ag-go").forEach(r=>r.onclick=()=>{view="demands";activeId=r.dataset.id;activeTab="work";close();renderApp();});
}

/* Shared by meetings and journal entries: an item can link to whole epics
   (epicIds — for epic-wide calls that aren't about one demand) and to demands (taskIds). */
function drawLinkChips(host,o,redraw,emptyMsg){
  if(!host)return;o.taskIds=o.taskIds||[];o.epicIds=o.epicIds||[];
  const eps=o.epicIds.map(epicById).filter(Boolean),ts=o.taskIds.map(id=>state.tasks.find(x=>x.id===id)).filter(Boolean);
  if(!eps.length&&!ts.length){host.innerHTML=`<span class="faint" style="font-size:12px">${emptyMsg}</span>`;return;}
  host.innerHTML="";
  const add=(label,go,remove,epic)=>{const chip=document.createElement("span");chip.className="chip"+(epic?" epicchip":"");
    chip.innerHTML=`<span class="go">${esc(label)}</span> <span class="x">✕</span>`;
    chip.querySelector(".go").onclick=go;chip.querySelector(".x").onclick=()=>{remove();touch(o);redraw();};host.appendChild(chip);};
  eps.forEach(e=>add("◆ "+epicLabel(e),()=>{view="epics";activeEpicId=e.id;epicTab="story";renderApp();},()=>{o.epicIds=o.epicIds.filter(x=>x!==e.id);},true));
  ts.forEach(t=>add(taskLabel(t),()=>{view="demands";activeId=t.id;activeTab="work";renderApp();},()=>{o.taskIds=o.taskIds.filter(x=>x!==t.id);},false));
}
function openLinkPicker(o,title,onClose){
  const root=document.getElementById("modalRoot");o.taskIds=o.taskIds||[];o.epicIds=o.epicIds||[];
  const eps=state.epics.slice().sort((a,b)=>(a.status==="closed")-(b.status==="closed")||epicLabel(a).localeCompare(epicLabel(b)));
  const rows=state.tasks.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  root.innerHTML=`<div class="modal-bg"><div class="modal"><h2>${title}</h2>
    ${eps.length?`<div class="picksec">◆ Epics <span class="faint">— for talk about the initiative as a whole</span></div><div class="picklist" style="max-height:190px">${eps.map(e=>`<label class="pickrow"><input type="checkbox" data-ep="${e.id}" ${o.epicIds.includes(e.id)?"checked":""} style="width:auto"><div><div class="demand">◆ ${esc(e.code||"epic")}</div><div>${esc(e.name)}</div></div></label>`).join("")}</div>`:""}
    <div class="picksec">Demands</div>
    ${rows.length?`<div class="picklist">${rows.map(t=>{const ep=epicById(t.epicId);return `<label class="pickrow"><input type="checkbox" data-id="${t.id}" ${o.taskIds.includes(t.id)?"checked":""} style="width:auto"><div><div class="demand">${esc(t.demandId||"—")}${ep?` · ◆ ${esc(ep.code||ep.name)}`:""}</div><div>${esc(t.title)}</div></div></label>`;}).join("")}</div>`:`<p class="faint">No demands yet.</p>`}
    <div class="modal-foot"><button id="m-close" class="primary">Done</button></div></div></div>`;
  const toggle=(arr,id,on)=>on?(arr.includes(id)?arr:arr.concat(id)):arr.filter(x=>x!==id);
  root.querySelectorAll("input[data-id]").forEach(cb=>cb.onchange=()=>{o.taskIds=toggle(o.taskIds,cb.dataset.id,cb.checked);touch(o);});
  root.querySelectorAll("input[data-ep]").forEach(cb=>cb.onchange=()=>{o.epicIds=toggle(o.epicIds,cb.dataset.ep,cb.checked);touch(o);});
  const close=()=>{root.innerHTML="";onClose();};
  root.querySelector("#m-close").onclick=close;
  root.querySelector(".modal-bg").onclick=ev=>{if(ev.target===root.querySelector(".modal-bg"))close();};
}

  tb.querySelectorAll("tr[data-id]").forEach(tr=>{const x=e.deps.find(d=>d.id===tr.dataset.id);
    /* text fields don't redraw (Tab to the next field keeps working); dates do, they drive the nudges */
    const bind=(sel,k,redraw)=>{const el=tr.querySelector(sel);if(el)el.onchange=ev=>{x[k]=ev.target.value;touch(e);if(redraw)renderEpicDetail();};};

    const ro=tr.querySelector(".d-reopen");if(ro)ro.onclick=()=>{x.done=false;x.doneDate="";touch(e);renderEpicDetail();};

function depCheckIn(e,x){const who=x.team||"the other team";
  const note=prompt(`What did ${who} say? (goes into the epic's Story — blank is fine)`,"");if(note===null)return;
  const nd=(prompt("New expected date, if they gave one (YYYY-MM-DD). Blank keeps: "+(x.expected||"none"),"")||"").trim();
  x.lastCheck=todayStr();x.snoozeUntil="";
  const newExp=/^\d{4}-\d{2}-\d{2}$/.test(nd);if(newExp)x.expected=nd;
  e.log.push({id:uid(),date:todayStr(),kind:"followup",text:`Checked with ${who}${x.what?" re "+x.what:""}${note.trim()?": "+note.trim():""}${newExp?" · now expected "+nd:""}`});
  touch(e);renderEpicDetail();toast("Follow-up logged in the Story");}
function depSnooze(e,x){const who=x.team||"the other team";
  const v=prompt(`Remind me about ${who} again in how many days?\n(or type a date, YYYY-MM-DD)`,"14");if(v===null)return;const t=v.trim();
  let until="";if(/^\d{4}-\d{2}-\d{2}$/.test(t))until=t;else if(/^\d+$/.test(t)&&+t>0){const d=new Date();d.setDate(d.getDate()+(+t));until=isoD(d);}
  if(!until||until<=todayStr()){toast("Give a number of days, or a future date",true);return;}
  x.snoozeUntil=until;touch(e);renderEpicDetail();toast("No follow-up nudges until "+until);}
function depDelivered(e,x){x.done=true;x.doneDate=todayStr();x.lastCheck=todayStr();touch(e);
  if(!e.deps.some(d=>!d.done))toast("Nothing left blocking this epic — time to move your transports?");
  renderEpicDetail();}

    <h3>Go-live readiness</h3><p>${!r.trs.length?"No transports recorded.":!r.pending.length?"✓ Every transport has reached its go-live target.":r.pending.map(x=>`${esc(x.t.demandId||x.t.title)} — ${x.g.missing.length} TR(s) not yet in ${x.g.target}`).join("<br>")}</p>

function buildEpicBriefMarkdown(e){
  const {r,pk,story,waves}=epicBriefData(e),L=[];
  const subs=(list,d)=>list.forEach(s=>{L.push(`${"  ".repeat(d)}- [${s.done?"x":" "}] ${s.title}${s.dueDate?` (due ${s.dueDate})`:""}`);subs(s.children,d+1);});
  L.push(`# ◆ ${epicLabel(e)}`,``,`**Status:** ${EPIC_STATUS[e.status].label} · **My role:** ${e.role==="contributor"?"Contributor (one slice)":"Lead"}${e.owner?` · **Owner:** ${e.owner}`:""}${e.targetDate?` · **Target:** ${e.targetDate}`:""}${story.length?` · **Running since:** ${story[0].date}`:""}`,``);
  if(pk)L.push(`**${pk.parked?"⏸ Parked":"⏳ Waiting"}:** ${pk.open} open dependency(ies)${pk.days!=null?`, oldest ${pk.days} day(s)`:""}.`,``);
  if(e.description)L.push(`## Description`,e.description,``);
  if(e.myScope)L.push(`## ${e.role==="contributor"?"My part":"Scope / approach"}`,e.myScope,``);
  L.push(`## Demands (${r.ts.length} · ${r.done} done)`);
  waves.forEach(w=>{if(waves.length>1||w)L.push(``,`### ${w||"No wave"}${waveTarget(e,w)?` — target ${waveTarget(e,w)}`:""}`);
    L.push(`| Demand | Title | System | Status | Received | Transports |`,`|---|---|---|---|---|---|`);
    r.ts.filter(t=>(t.wave||"")===w).sort((a,b)=>(a.receivedDate||"").localeCompare(b.receivedDate||"")).forEach(t=>L.push(`| ${t.demandId||"—"} | ${t.title} | ${t.system||"—"}${t.client?" / "+t.client:""} | ${STATUS[t.status].label} | ${t.receivedDate||"—"} | ${t.transports.map(tr=>tr.number||"(TR)").join(", ")||"—"} |`));});
  L.push(``);
  if(e.deps.length){L.push(`## Dependencies on other teams`,`| Team | What | Since | Expected | State |`,`|---|---|---|---|---|`);
    e.deps.forEach(x=>L.push(`| ${x.team} | ${x.what} | ${x.since||"—"} | ${x.expected||"—"} | ${x.done?"delivered "+x.doneDate:(x.lastCheck?"open · last chased "+x.lastCheck:"open")} |`));L.push(``);}
  L.push(`## Go-live readiness`,!r.trs.length?"No transports recorded.":!r.pending.length?"✓ Every transport has reached its go-live target.":r.pending.map(x=>`- ${x.t.demandId||x.t.title} — ${x.g.missing.length} TR(s) not yet in ${x.g.target}`).join("\n"),``);
  if(e.subtasks.length){L.push(`## Epic subtasks`);subs(e.subtasks,0);L.push(``);}
  L.push(`## Story`);
  if(story.length)story.forEach(x=>L.push(`- **${x.date}** ${x.icon} ${x.src==="log"?EPIC_LOG[x.kind].label+": ":""}${x.text}`));else L.push("_nothing recorded_");
  if(e.notes)L.push(``,`## Notes`,e.notes);
  return L.join("\n");
}

        <button class="sm" id="rc-done">✓ Done — advance to next</button>

        <div class="field"><label>To (inclusive)</label><input type="date" id="fz-to" value="${p.to||""}"></div>
      </div>
      <label>Frozen systems — click to toggle</label>
      <div class="chiprow" id="fz-sys" style="margin-top:6px">${all.map(s=>`<button class="sys ${sysTierCls(s)}" data-s="${s}" style="cursor:pointer;opacity:${(p.systems||[]).includes(s)?"1":".35"}">${s}${(p.systems||[]).includes(s)?" ✓":""}</button>`).join("")}</div>
      <p class="faint" style="font-size:12px;margin-top:10px">While active, the go-live check on every demand warns when its target system is frozen; the freeze also shows on Today from 14 days before it starts.</p>`;

      touch(p);renderPlayKind(body,p);});

  }
  if(p.kind==="contacts"){

/* ===================== IMAGES (screenshots folder) ===================== */
/* Images live as FILES in a folder you pick; the .json stores only records
   {file,label,expiry,links}. Nothing binary ever enters the data file. */
let imagesDir=null, imgDirSaved=null, imgUrlCache={};
const IMG_EXTS=/\.(png|jpe?g|gif|webp|bmp)$/i;
async function restoreImgDir(){
  if(!useIdb||!supportsFS)return;
  try{const h=await idbGet("imgdir");if(!h)return;imgDirSaved=h;
    let p="prompt";try{p=await h.queryPermission({mode:"readwrite"});}catch(e){}
    if(p==="granted")imagesDir=h;
  }catch(e){}
}
async function ensureImgDir(interactive){
  if(imagesDir)return imagesDir;
  if(imgDirSaved){try{
    let p=await imgDirSaved.queryPermission({mode:"readwrite"});
    if(p!=="granted"&&interactive&&imgDirSaved.requestPermission)p=await imgDirSaved.requestPermission({mode:"readwrite"});
    if(p==="granted"){imagesDir=imgDirSaved;return imagesDir;}
  }catch(e){}}
  if(interactive&&window.showDirectoryPicker){
    try{imagesDir=await showDirectoryPicker({mode:"readwrite"});imgDirSaved=imagesDir;
      if(useIdb)idbSet("imgdir",imagesDir).catch(()=>{});
      toast("Images folder connected");return imagesDir;
    }catch(e){if(e.name!=="AbortError")toast("Couldn't open folder: "+e.message,true);}
  }
  return null;
}
async function forgetImgDir(){imagesDir=null;imgDirSaved=null;if(useIdb)await idbDel("imgdir");Object.values(imgUrlCache).forEach(u=>URL.revokeObjectURL(u));imgUrlCache={};}
function imagesFor(kind,id){return state.images.filter(im=>im.links.some(l=>l.kind===kind&&l.id===id));}
function expiredImages(){const t=todayStr();return state.images.filter(im=>im.expiry&&im.expiry<t);}
function isExpired(im){return !!(im.expiry&&im.expiry<todayStr());}
async function imgUrl(im){
  if(imgUrlCache[im.file])return imgUrlCache[im.file];
  if(!imagesDir)return null;
  try{const fh=await imagesDir.getFileHandle(im.file);const f=await fh.getFile();const u=URL.createObjectURL(f);imgUrlCache[im.file]=u;return u;}
  catch(e){return null;}
}
function defaultImgExpiry(){const d=state.settings.imageExpiryDays;return d?dstr(new Date(Date.now()+d*86400000)):"";}
async function saveImageBlob(blob,kind,id){
  const dir=await ensureImgDir(true);
  if(!dir){toast("Connect an images folder first (⋯ menu → Images)",true);return null;}
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const base=`dd-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  let name=base+".png";
  try{
    /* two pastes inside the same second must not overwrite each other's file */
    for(let n=2;;n++){try{await dir.getFileHandle(name);}catch(e){break;}name=`${base}-${n}.png`;}
    const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();
    const im=normImage({file:name,label:"",expiry:defaultImgExpiry(),links:kind?[{kind,id}]:[]});
    state.images.push(im);markDirty();
    toast("📷 Saved "+name+(im.expiry?" · expires "+im.expiry:""));
    return im;
  }catch(e){toast("Image save failed: "+e.message,true);return null;}
}
function pasteTarget(){
  if(view==="demands"&&activeTask())return{kind:"demand",id:activeTask().id};
  if(view==="meetings"&&!meetingRollup&&activeMeeting())return{kind:"meeting",id:activeMeeting().id};
  if(view==="journal"&&!journalTodos&&activeJournal())return{kind:"journal",id:activeJournal().id};
  if(view==="playbook"&&activePlay())return{kind:"playbook",id:activePlay().id};

}
