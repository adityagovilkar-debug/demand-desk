<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demand Desk — ABAP Work Tracker</title>
<style>
  :root{
    --bg:#0f1216; --bg2:#161b22; --panel:#1b222c; --panel2:#212a36;
    --line:#2b3543; --line2:#374454;
    --txt:#e6edf3; --muted:#8b97a7; --faint:#5b6675;
    --accent:#4ea1ff; --accent2:#7c5cff; --on-accent:#06121f;
    --green:#3fb950; --amber:#d29922; --red:#f85149; --teal:#2dd4bf;
    --chip:#243040;
    /* semantic surfaces (themed) */
    --danger-bg:#3a1d1f; --toc-bg:#1a1830;
    --cover-yes-bg:#142a1a; --cover-yes-line:#274b2c;
    --cover-no-bg:#2a2410; --cover-no-line:#5a4a1e;
    --resume-bg:linear-gradient(180deg,#1d2a22,#1a2430);
    --pin-bg:linear-gradient(180deg,#2a2410,#1c2230);
    --exp-bg:#2a1416; --exp-line:#5e2a2a;
    --alert-line:#5e2a2a; --warn-line:#5a4a1e;
    --accent-line:#274b6e; --green-line:#274b2c; --amber-line:#5a4a1e; --red-line:#5e2a2a; --violet-line:#3a2f6b;
    --radius:9px; --mono:"Cascadia Code","Consolas",ui-monospace,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#eef1f5; --bg2:#ffffff; --panel:#ffffff; --panel2:#eef1f5;
    --line:#d8dee4; --line2:#ccd3da;
    --txt:#1f2328; --muted:#59636e; --faint:#818b96;
    --accent:#1f6feb; --accent2:#6b46e0; --on-accent:#ffffff;
    --green:#1a7f37; --amber:#9a6700; --red:#cf222e; --teal:#0f8a80;
    --chip:#eaeef2;
    --danger-bg:#ffebe9; --toc-bg:#f3f0ff;
    --cover-yes-bg:#e6f4ea; --cover-yes-line:#b7e0c3;
    --cover-no-bg:#fbeec2; --cover-no-line:#e6d19a;
    --resume-bg:#eaf5ee; --pin-bg:#fbf3dd;
    --exp-bg:#ffe9e6; --exp-line:#f0b3ab;
    --alert-line:#f0b3ab; --warn-line:#e6d19a;
    --accent-line:#b6d3f5; --green-line:#b7e0c3; --amber-line:#e6d19a; --red-line:#f0b3ab; --violet-line:#d0c4e4;
  }
  /* ---- INSTRUMENT WHITE ----
     Scientific-plotter look: white paper, hairlines, drafting-pen signal colours,
     silkscreen micro-labels, tabular mono figures. Adapted from instrument-white/.

     Pen assignment for this app, fixed for its lifetime (§2 colour discipline):
       prussian #1B4FA0 — Open / Development tier / links & accents
       ochre    #B07500 — In progress / QA tier / waiting & warnings
       viridian #0E7C63 — Delivered / Production tier / reached & good
       cinnabar #D93A1E — Bug / overdue / expired  (the "past a limit" pen)
       violet   #6B3FA0 — projects & Transports-of-Copies (structural grouping)
     Ink carries all structure; a colour anywhere means a real state.
     Scoped entirely under the attribute — dark and light are untouched. */
  :root[data-theme="instrument"]{
    color-scheme:light;
    --bg:#FFFFFF; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#F7F7F4;
    --line:#E7E6DF; --line2:#D6D5CC;
    --txt:#12141A; --muted:#5A5E68; --faint:#9A9EA8;
    --accent:#1B4FA0; --accent2:#6B3FA0; --on-accent:#FFFFFF;
    --green:#0E7C63; --amber:#B07500; --red:#D93A1E; --teal:#0E7C63;
    --chip:#FFFFFF;
    /* the system forbids surface gradients and tinted fills — flat paper, ruled edges */
    --danger-bg:#FDF1EE; --toc-bg:#FFFFFF;
    --cover-yes-bg:#FFFFFF; --cover-yes-line:#B4D8CE;
    --cover-no-bg:#FFFFFF; --cover-no-line:#E4D3A6;
    --resume-bg:#FFFFFF; --pin-bg:#FFFFFF;
    --exp-bg:#FFFFFF; --exp-line:#F0C0B6;
    --alert-line:#F0C0B6; --warn-line:#E4D3A6;
    --accent-line:#BFD0E6; --green-line:#B4D8CE; --amber-line:#E4D3A6; --red-line:#F0C0B6; --violet-line:#D0C4E4;
    --radius:3px;
    --mono:ui-monospace,"Cascadia Mono","JetBrains Mono","SF Mono",Consolas,monospace;
    --sans:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    /* Silkscreen face for micro-labels. Bahnschrift is Windows' stock DIN — the
       typeface of engineering drawings — so it needs no install and gives the
       labels a genuinely technical voice instead of falling back to Segoe UI
       (Inter is not installed on a locked-down machine, so --sans alone still
       renders as the old font). Condensed, so tracked uppercase stays compact. */
    --label:"Bahnschrift","Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --rule-strong:#D6D5CC; --grid-dot:#DEDDD6; --ink-3:#9A9EA8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.45;overflow:hidden}
  button{font-family:inherit;font-size:13px;color:var(--txt);background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:6px 11px;cursor:pointer;transition:.12s}
  button:hover{background:var(--line2);border-color:var(--faint)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  button.primary:hover{filter:brightness(1.1)}
  button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:4px 7px}
  button.ghost:hover{background:var(--panel2);color:var(--txt)}
  button.danger:hover{background:var(--danger-bg);border-color:var(--red);color:var(--red)}
  button.sm{padding:3px 8px;font-size:12px}
  input,select,textarea{font-family:inherit;font-size:13px;color:var(--txt);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical;min-height:54px;line-height:1.5}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin:0 0 4px 1px;font-weight:600}
  a{color:var(--accent)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}
  .hide{display:none!important}

  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto}
  header .logo{font-weight:700;letter-spacing:.5px;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  header .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .nav{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
  .navbtn{background:transparent;border:none;color:var(--muted);padding:5px 13px;border-radius:6px;font-weight:600}
  .navbtn:hover{background:var(--panel2);color:var(--txt)}
  .navbtn.active{background:var(--accent);color:var(--on-accent)}
  header .spacer{flex:1}
  /* shrinkable so a cramped header (7 nav tabs, narrow window, or instrument's
     wider letter-spacing) squeezes the search instead of pushing the file buttons
     off-screen — Ctrl+K still focuses it either way */
  .hsearch{position:relative;flex:0 1 300px;min-width:104px}
  .hsearch input{padding-left:30px;background:var(--panel)}
  .hsearch svg{position:absolute;left:9px;top:8px;width:15px;height:15px;opacity:.5}
  .filebar{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .filebar button{white-space:nowrap}
  /* On a cramped header the nav scrolls rather than pushing Save/⋯ off-screen;
     the file controls must always stay reachable. Scrollbar hidden — it's a
     7-item strip, and the workspaces are also on Ctrl+K. */
  .nav{flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .navbtn{flex:0 0 auto}
  .savestate{font-size:11px;color:var(--faint);min-width:74px;text-align:right}
  .savestate.dirty{color:var(--amber)}
  .savestate.saved{color:var(--green)}

  main{display:flex;flex:1;min-height:0}
  aside{width:340px;flex:0 0 340px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .side-tools{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  /* multi-select status filter — click to include, click again to drop */
  .statchips{display:flex;gap:4px;flex-wrap:wrap}
  .statchip{padding:2px 8px;font-size:11px;font-weight:600;border-radius:20px;background:transparent;
    border:1px solid var(--line2);color:var(--faint);transition:.12s}
  .statchip:hover{color:var(--txt);border-color:var(--faint);background:transparent}
  .statchip.on{background:var(--chip)}
  .statchip.on.open{color:var(--accent);border-color:var(--accent)}
  .statchip.on.progress{color:var(--amber);border-color:var(--amber)}
  .statchip.on.delivered{color:var(--green);border-color:var(--green)}
  .statchip.on.bug{color:var(--red);border-color:var(--red)}
  .statchip.on.closed{color:var(--muted);border-color:var(--muted)}
  .statchip.clear{margin-left:auto}
  .statchip.clear.on{color:var(--txt);border-color:var(--faint)}
  .filters select{width:auto;flex:1;min-width:0;padding:5px 6px;font-size:12px}
  .stats{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px}
  .stat{flex:1;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 2px}
  .stat b{display:block;font-size:16px;font-weight:700}
  .stat.ov b{color:var(--red)} .stat.op b{color:var(--accent)} .stat.dl b{color:var(--green)}
  .listwrap{flex:1;overflow:auto;padding:8px}
  .tcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:8px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:.12s}
  .tcard:hover{border-color:var(--line2);background:var(--panel2)}
  .tcard.active{border-color:var(--accent);border-left-color:var(--accent);background:var(--panel2)}
  .tcard .demand{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}
  .tcard .ttitle{font-weight:600;margin:2px 0 5px;font-size:13.5px}
  .tcard .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
  .tcard.s-open{border-left-color:var(--accent)} .tcard.s-progress{border-left-color:var(--amber)}
  .tcard.s-delivered{border-left-color:var(--green)} .tcard.s-bug{border-left-color:var(--red)}
  .tcard.s-closed{border-left-color:var(--faint);opacity:.7}
  .empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:13px}

  .pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--line2);background:var(--chip);white-space:nowrap}
  .pill.open{color:var(--accent);border-color:var(--accent-line)} .pill.progress{color:var(--amber);border-color:var(--amber-line)}
  .pill.delivered{color:var(--green);border-color:var(--green-line)} .pill.bug{color:var(--red);border-color:var(--red-line)}
  .pill.closed{color:var(--faint)} .pill.type{color:var(--teal);border-color:#1f4a45;text-transform:none}
  .due{font-family:var(--mono);font-size:11px}
  .due.over{color:var(--red);font-weight:700} .due.soon{color:var(--amber)}

  /* system pills by tier */
  .sys{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid var(--line2);background:var(--chip)}
  .sys.t3{color:var(--accent);border-color:#274b6e}
  .sys.t2{color:var(--amber);border-color:var(--amber-line)}
  .sys.t1{color:var(--green);border-color:var(--green-line)}
  .sys .d{font-size:9px;opacity:.7;font-family:var(--sans);font-weight:600}

  section.detail{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .detail-head{padding:16px 22px 0;border-bottom:1px solid var(--line)}
  .detail-head .dh-top{display:flex;align-items:flex-start;gap:14px}
  .detail-head h1{font-size:19px;margin:0;flex:1;font-weight:650}
  .dh-demand{font-family:var(--mono);color:var(--accent);font-size:13px;font-weight:600;margin-bottom:3px}
  .dh-dates{display:flex;gap:18px;margin:10px 0 0;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .tabs{display:flex;gap:2px;margin-top:14px;flex-wrap:wrap}
  .tab{padding:8px 15px;border:none;background:transparent;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);font-weight:600;font-size:13px}
  .tab:hover{background:transparent;color:var(--txt)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab .count{font-size:10px;background:var(--panel2);border-radius:10px;padding:0 6px;margin-left:5px;color:var(--muted)}
  .detail-body{flex:1;overflow:auto;padding:20px 22px}
  .nopick{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:14px;color:var(--faint);text-align:center}
  .nopick svg{width:54px;height:54px;opacity:.25}

  .sec-title{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .sec-title h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .sec-title .ln{flex:1;height:1px;background:var(--line)}

  .tree{margin-top:4px}
  .node .children{margin-left:22px;border-left:1px dashed var(--line2);padding-left:14px;margin-top:6px}
  /* wraps when the detail pane is narrow: the two fixed-width date pickers used to
     crush the subtask title into a ~60px column of stacked letters */
  .nrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px;margin-bottom:6px;flex-wrap:wrap}
  .nrow .twist{cursor:pointer;width:14px;color:var(--faint);font-size:11px;flex:0 0 14px;text-align:center;user-select:none}
  .nrow .chk{cursor:pointer;width:16px;height:16px;flex:0 0 16px;border:1.5px solid var(--line2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px}
  .nrow .chk.done{background:var(--green);border-color:var(--green);color:var(--on-accent)}
  .nrow .nm{flex:1 1 170px;min-width:0;font-size:13px;cursor:text;padding:2px 4px;border-radius:4px}
  .nrow .nm:hover{background:var(--bg2)}
  .nrow.done .nm{text-decoration:line-through;color:var(--faint)}
  .nrow .ndates{display:flex;gap:8px;font-size:11px;color:var(--muted);align-items:center;flex:0 0 auto;margin-left:auto}
  .nrow .nact{display:flex;gap:2px;opacity:0;transition:.1s}
  .nrow:hover .nact{opacity:1}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:600;padding:6px 9px;border-bottom:1px solid var(--line)}
  td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  table input,table select,table textarea{background:transparent;border:1px solid transparent;padding:5px 6px}
  table input:hover,table select:hover,table textarea:hover{border-color:var(--line)}
  table input:focus,table select:focus,table textarea:focus{background:var(--bg2);border-color:var(--accent)}
  table textarea{min-height:32px}
  .tbl-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}

  .field{margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  /* transport cards */
  .trcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:12px}
  .trcard.toc{border-left:3px solid var(--accent2);background:var(--toc-bg)}
  .trcard.cust{border-left:3px solid var(--teal)}
  .trcard .trtop{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .trcard .trtop .kind{flex:0 0 128px}
  .trcard .trtop .cli{flex:0 0 118px}
  .kindtag{flex:0 0 auto;font-size:10px;font-weight:700;border-radius:5px;padding:2px 7px;border:1px solid var(--line2);background:var(--chip)}
  .kindtag.wb{color:var(--muted)} .kindtag.cust{color:var(--teal);border-color:#1f4a45}
  .trcard .trtop .num,.trcard .trtop .cnum{flex:0 0 150px} .trcard .trtop .dsc,.trcard .trtop .cdsc{flex:1}
  .trcard .trtop .org{flex:0 0 140px}
  .trcard .seq{flex:0 0 20px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--faint);font-weight:700}
  .trcard .reorder{display:flex;flex-direction:column;gap:1px;flex:0 0 auto}
  .trcard .reorder button{padding:0 5px;line-height:1.1;font-size:11px}
  .trcard .toctag{flex:0 0 auto;font-size:10px;font-weight:700;color:var(--accent2);border:1px solid #3a2f6b;background:var(--chip);border-radius:5px;padding:2px 7px}
  .cover{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:2px 8px;margin-bottom:8px}
  .cover.yes{color:var(--green);background:var(--cover-yes-bg);border:1px solid var(--green-line)}
  .cover.no{color:var(--amber);background:var(--cover-no-bg);border:1px solid var(--amber-line)}
  .readybar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border:1px solid var(--line2);border-radius:8px;padding:9px 12px;margin-bottom:14px;font-size:13px;background:var(--panel)}
  .readybar.ok{border-color:var(--green-line)} .readybar.warn{border-color:var(--amber-line)}
  .syncrow{display:flex;gap:7px;align-items:center;margin-bottom:5px}
  .syncrow select{flex:0 0 200px} .syncrow input{flex:0 0 140px}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

  /* calls / team */
  .callbody{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:1.6;font-size:13.5px;min-height:200px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:18px;background:var(--chip);border:1px solid var(--line2);font-size:12px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip .x{color:var(--faint);font-weight:700}
  .chip .x:hover{color:var(--red)}
  .actitem{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 11px;margin-bottom:6px;flex-wrap:wrap}
  .ares{flex-basis:100%;font-size:11.5px;color:var(--teal);white-space:pre-wrap;padding:1px 0 0 25px;cursor:text;line-height:1.4}
  .ares:hover{color:var(--txt)}
  .actitem .chk{cursor:pointer;width:16px;height:16px;flex:0 0 16px;border:1.5px solid var(--line2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px}
  .actitem .chk.done{background:var(--green);border-color:var(--green);color:var(--on-accent)}
  .actitem.done .at{text-decoration:line-through;color:var(--faint)}
  .actitem .at{flex:1;cursor:text;padding:2px 4px;border-radius:4px} .actitem .at:hover{background:var(--bg2)}
  .actitem .ow{flex:0 0 130px} .actitem .du{flex:0 0 130px}
  .actitem .nact{opacity:0} .actitem:hover .nact{opacity:1}
  .lc-badge{font-size:10px;background:var(--panel2);border-radius:10px;padding:1px 7px;color:var(--muted)}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:520px;max-width:92vw;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 18px 60px rgba(0,0,0,.5)}
  .modal h2{margin:0 0 16px;font-size:16px}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .picklist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .pickrow{display:flex;align-items:center;gap:9px;padding:7px 11px;border-bottom:1px solid var(--line);cursor:pointer}
  .pickrow:hover{background:var(--panel2)}
  .pickrow:last-child{border-bottom:none}
  .pickrow .demand{font-family:var(--mono);font-size:11px;color:var(--accent)}

  .lockveil{position:fixed;inset:0;background:rgba(9,12,16,.98);z-index:200;display:flex;align-items:center;justify-content:center}

  /* images */
  .imgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:8px}
  .imgcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
  .imgcard.expired{border-color:var(--red)}
  .imgcard .thumb{width:100%;height:112px;object-fit:cover;border-radius:5px;cursor:zoom-in;background:#05080c;border:1px solid var(--line)}
  .imgcard .nothumb{width:100%;height:112px;border-radius:5px;background:#05080c;border:1px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:11px;text-align:center;padding:6px}
  .imgcard input{font-size:11.5px;padding:3px 6px}
  .imgcard .im-file{font-family:var(--mono);font-size:10px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .imgcard .im-exp{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted)}
  .imgcard .im-exp input{width:auto;flex:1}
  .imgcard .im-acts{display:flex;gap:3px;justify-content:flex-end}
  .expbadge{font-size:9px;font-weight:700;color:var(--red);border:1px solid var(--exp-line);background:var(--exp-bg);border-radius:4px;padding:1px 5px}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:120;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;cursor:zoom-out}
  .lightbox img{max-width:94vw;max-height:86vh;border-radius:6px;box-shadow:0 20px 80px rgba(0,0,0,.8)}
  .lightbox .lb-meta{color:var(--muted);font-size:12px;background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 14px}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 16px;font-size:13px;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;bottom:26px}
  .toast.err{border-color:var(--red);color:#ffb4ae}

  .gsearch{position:absolute;top:40px;left:0;width:420px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px;max-height:60vh;overflow:auto;z-index:60;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .gsr{padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12px}
  .gsr:hover{background:var(--panel2)}
  .gsr .k{font-size:10px;text-transform:uppercase;color:var(--faint);letter-spacing:.5px;margin-right:6px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg2)}
  ::-webkit-scrollbar-track{background:transparent}

  /* comments */
  .cmt{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px;margin-bottom:6px}
  .cmt-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--faint);margin-bottom:3px}
  .cmt-meta .c-del{opacity:0}
  .cmt:hover .cmt-meta .c-del{opacity:1}
  .cmt-text{white-space:pre-wrap;font-size:13px;cursor:text;line-height:1.5}
  .cmt-add{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
  .cmt-add textarea{min-height:38px}
  .cmt-add button{flex:0 0 auto;align-self:stretch}

  /* tech spec document (modal preview + print share .specdoc) */
  .specpaper{background:#fff;color:#15202b;max-height:62vh;overflow:auto;border-radius:6px;padding:26px 30px}
  .specdoc h1{font-size:21px;margin:0 0 4px;color:#0b3d6e}
  .specdoc h2{font-size:16px;margin:0 0 14px;color:#222;border-bottom:1px solid #d0d7de;padding-bottom:7px}
  .specdoc h3{font-size:13.5px;margin:20px 0 7px;color:#0b3d6e;text-transform:uppercase;letter-spacing:.4px}
  .specdoc p{margin:6px 0;line-height:1.55}
  .specdoc .meta{font-size:12px;color:#475569}
  .specdoc table{border-collapse:collapse;width:100%;font-size:12px;margin:8px 0}
  .specdoc th,.specdoc td{border:1px solid #c7ced6;padding:5px 8px;text-align:left;vertical-align:top}
  .specdoc th{background:#f1f5f9}
  .specdoc .note{white-space:pre-wrap;background:#f6f8fa;border:1px solid #e2e8f0;border-radius:5px;padding:9px 11px;font-size:12.5px}
  .specdoc ul{margin:5px 0 5px 18px;padding:0}
  .specdoc li{margin:2px 0}
  .specdoc i{color:#64748b}

  /* journal + debug */
  .jbody{min-height:48vh;line-height:1.6;font-size:14px}
  .resume-box{background:var(--resume-bg);border:1px solid var(--green-line);border-left:3px solid var(--green);border-radius:8px;padding:12px 14px;margin-bottom:18px}
  .resume-box label{color:var(--green)}
  .resume-box textarea{background:rgba(0,0,0,.18);min-height:60px}
  .finding{display:flex;gap:9px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px;margin-bottom:6px}
  .finding .fk{flex:0 0 84px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
  .finding .ft{flex:1;white-space:pre-wrap;font-size:13px;cursor:text;padding:2px 4px;border-radius:4px}
  .finding .ft:hover{background:var(--bg2)}
  .finding .fts{flex:0 0 130px;font-size:11px;color:var(--faint);font-family:var(--mono)}
  .finding .nact{opacity:0}.finding:hover .nact{opacity:1}
  .add-find{display:flex;gap:7px;align-items:flex-end;margin-bottom:10px}
  .add-find select{flex:0 0 110px}.add-find textarea{flex:1;min-height:36px}
  /* pinned reference box */
  .pinbox{background:var(--pin-bg);border:1px solid var(--amber-line);border-left:3px solid var(--amber);border-radius:8px;padding:10px 13px;margin-bottom:18px}
  .pin-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--amber);font-weight:700;margin-bottom:7px}
  .pin-row{display:flex;align-items:center;gap:8px;padding:3px 0}
  .pin-row .pin-l{flex:0 0 200px;font-size:12px;color:var(--muted)}
  .pin-row .pin-v{flex:1;font-size:13px;word-break:break-all}

  /* today dashboard */
  .dash{padding:18px 22px;overflow:auto;height:100%}
  .dash-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .dash-head h1{margin:0;font-size:20px}
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
  .dashcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .dashcard.alert{border-color:var(--red-line)}.dashcard.warn{border-color:var(--amber-line)}
  .dashcard h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .dashcard h3 .cnt{font-size:11px;background:var(--panel2);border-radius:10px;padding:1px 8px;margin-left:auto}
  .dashitem{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:6px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
  .dashitem:last-child{border-bottom:none}.dashitem:hover{background:var(--panel2)}
  .dashitem .di-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dashitem .di-sub{font-size:11px;color:var(--faint);white-space:nowrap;flex:0 0 auto}
  .dash-empty{color:var(--faint);font-size:12px;padding:4px}
  .getting-started{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:24px 28px;max-width:660px;margin:14px auto}
  .getting-started h1{margin:0 0 4px;font-size:19px}
  .gs-lede{color:var(--muted);margin:0 0 16px}
  .gs-list{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0 16px;align-items:baseline}
  .gs-list dt{font-weight:650;padding:7px 0 0;white-space:nowrap}
  .gs-list dd{margin:0;padding:7px 0 0;color:var(--muted);font-size:12.5px;line-height:1.5}
  .gs-list dt~dt,.gs-list dt:not(:first-of-type){border-top:1px solid var(--line)}
  .gs-list dd:not(:first-of-type){border-top:1px solid var(--line)}
  .gs-tip{color:var(--muted);font-size:12px;margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line)}
  .gs-acts{display:flex;gap:8px;margin-top:14px}
  .objlink{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}

  /* ================= INSTRUMENT WHITE — structural refinements =================
     Colour alone doesn't make the aesthetic; this is the geometry and typography
     that read as an instrument: near-square edges, hairlines, corner registration
     tics, silkscreen micro-labels, tabular mono figures, outlined pills.
     Every rule is scoped under the theme attribute, so dark/light are untouched
     and no render logic changes. ============================================== */
  :root[data-theme="instrument"] body{font-size:13.5px;letter-spacing:.005em}

  /* Engineering dot-grid paper (§4). Even across the whole viewport rather than
     masked to a fade — it reads as blueprint field, and every panel then sits on
     it as a sheet of paper. Kept faint enough to be near-subliminal. */
  :root[data-theme="instrument"] #app::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px,var(--grid-dot) 1px,transparent 0);
    background-size:22px 22px;opacity:.55}
  :root[data-theme="instrument"] header,
  :root[data-theme="instrument"] main{position:relative;z-index:1}
  /* The grid only shows through if the big surfaces stop painting white over it.
     Panels/cards keep their fill, so they read as paper laid on the blueprint. */
  :root[data-theme="instrument"] main,
  :root[data-theme="instrument"] aside,
  :root[data-theme="instrument"] section.detail,
  :root[data-theme="instrument"] .detail-body,
  :root[data-theme="instrument"] .listwrap,
  :root[data-theme="instrument"] .side-tools,
  :root[data-theme="instrument"] .dash{background:transparent}

  /* near-square geometry; depth from hairlines only — no shadows, no glow */
  :root[data-theme="instrument"] button,
  :root[data-theme="instrument"] input,
  :root[data-theme="instrument"] select,
  :root[data-theme="instrument"] textarea,
  :root[data-theme="instrument"] .pill,
  :root[data-theme="instrument"] .chip,
  :root[data-theme="instrument"] .sys,
  :root[data-theme="instrument"] .lc-badge,
  :root[data-theme="instrument"] .expbadge,
  :root[data-theme="instrument"] .kindtag,
  :root[data-theme="instrument"] .toctag{border-radius:2px}
  :root[data-theme="instrument"] .tcard,
  :root[data-theme="instrument"] .dashcard,
  :root[data-theme="instrument"] .trcard,
  :root[data-theme="instrument"] .modal,
  :root[data-theme="instrument"] .imgcard,
  :root[data-theme="instrument"] .actitem,
  :root[data-theme="instrument"] .cmt,
  :root[data-theme="instrument"] .finding,
  :root[data-theme="instrument"] .nrow,
  :root[data-theme="instrument"] .readybar,
  :root[data-theme="instrument"] .resume-box,
  :root[data-theme="instrument"] .pinbox,
  :root[data-theme="instrument"] .tbl-wrap,
  :root[data-theme="instrument"] .getting-started,
  :root[data-theme="instrument"] .picklist,
  :root[data-theme="instrument"] .gsearch,
  :root[data-theme="instrument"] .toast{border-radius:3px;box-shadow:none}
  :root[data-theme="instrument"] .modal,
  :root[data-theme="instrument"] .gsearch,
  :root[data-theme="instrument"] .toast{box-shadow:0 2px 10px rgba(18,20,26,.07)}
  :root[data-theme="instrument"] .lightbox img{box-shadow:none;border:1px solid var(--rule-strong)}

  /* registration tics — the detail that reads "instrument", not "web card".
     Panels only; list rows at this density would be noise. */
  :root[data-theme="instrument"] .dashcard,
  :root[data-theme="instrument"] .trcard,
  :root[data-theme="instrument"] .modal,
  :root[data-theme="instrument"] .resume-box,
  :root[data-theme="instrument"] .pinbox,
  :root[data-theme="instrument"] .readybar,
  :root[data-theme="instrument"] .getting-started,
  :root[data-theme="instrument"] .imgcard{position:relative}
  :root[data-theme="instrument"] .dashcard::before,  :root[data-theme="instrument"] .dashcard::after,
  :root[data-theme="instrument"] .trcard::before,    :root[data-theme="instrument"] .trcard::after,
  :root[data-theme="instrument"] .modal::before,     :root[data-theme="instrument"] .modal::after,
  :root[data-theme="instrument"] .resume-box::before,:root[data-theme="instrument"] .resume-box::after,
  :root[data-theme="instrument"] .pinbox::before,    :root[data-theme="instrument"] .pinbox::after,
  :root[data-theme="instrument"] .readybar::before,  :root[data-theme="instrument"] .readybar::after,
  :root[data-theme="instrument"] .getting-started::before,:root[data-theme="instrument"] .getting-started::after,
  :root[data-theme="instrument"] .imgcard::before,   :root[data-theme="instrument"] .imgcard::after{
    content:"";position:absolute;width:7px;height:7px;border:solid var(--rule-strong);pointer-events:none}
  :root[data-theme="instrument"] .dashcard::before,
  :root[data-theme="instrument"] .trcard::before,
  :root[data-theme="instrument"] .modal::before,
  :root[data-theme="instrument"] .resume-box::before,
  :root[data-theme="instrument"] .pinbox::before,
  :root[data-theme="instrument"] .readybar::before,
  :root[data-theme="instrument"] .getting-started::before,
  :root[data-theme="instrument"] .imgcard::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
  :root[data-theme="instrument"] .dashcard::after,
  :root[data-theme="instrument"] .trcard::after,
  :root[data-theme="instrument"] .modal::after,
  :root[data-theme="instrument"] .resume-box::after,
  :root[data-theme="instrument"] .pinbox::after,
  :root[data-theme="instrument"] .readybar::after,
  :root[data-theme="instrument"] .getting-started::after,
  :root[data-theme="instrument"] .imgcard::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}

  /* silkscreen micro-labels — DIN face, uppercase, wide tracking, quiet ink (§3) */
  :root[data-theme="instrument"] label,
  :root[data-theme="instrument"] .sec-title h3,
  :root[data-theme="instrument"] .dashcard h3,
  :root[data-theme="instrument"] .stat,
  :root[data-theme="instrument"] th,
  :root[data-theme="instrument"] .tab,
  :root[data-theme="instrument"] .pill,
  :root[data-theme="instrument"] .cover,
  :root[data-theme="instrument"] .kindtag,
  :root[data-theme="instrument"] .toctag,
  :root[data-theme="instrument"] .expbadge,
  :root[data-theme="instrument"] .gsr .k{font-family:var(--label)}
  :root[data-theme="instrument"] label{font-size:8.5px;letter-spacing:.17em;color:var(--ink-3)}
  :root[data-theme="instrument"] .sec-title h3,
  :root[data-theme="instrument"] .dashcard h3{font-size:9.5px;letter-spacing:.22em;font-weight:600;color:var(--muted)}
  :root[data-theme="instrument"] .stat{border-radius:2px;background:transparent}
  :root[data-theme="instrument"] .stats{gap:1px;background:var(--line);border:1px solid var(--line);padding:1px}
  :root[data-theme="instrument"] .stat{border:none;background:var(--panel);font-size:8.5px;
    letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);padding:7px 2px}
  :root[data-theme="instrument"] header .logo{font-family:var(--mono);font-size:11px;letter-spacing:.3em}
  :root[data-theme="instrument"] header .logo .dot{box-shadow:none;width:7px;height:7px;border-radius:50%}
  :root[data-theme="instrument"] header{background:var(--panel)}
  :root[data-theme="instrument"] aside{background:transparent;border-right:1px solid var(--line)}
  :root[data-theme="instrument"] .detail-head{border-bottom:1px solid var(--line)}

  /* nav + tabs as instrument controls */
  :root[data-theme="instrument"] .nav{background:transparent;border-color:transparent;padding:0;gap:1px}
  :root[data-theme="instrument"] .navbtn{font-family:var(--label);font-size:10px;letter-spacing:.15em;
    text-transform:uppercase;border-radius:2px;border:1px solid transparent;padding:5px 9px}
  :root[data-theme="instrument"] .navbtn.active{background:transparent;color:var(--txt);border-color:var(--rule-strong)}
  :root[data-theme="instrument"] .tab{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  :root[data-theme="instrument"] .tab .count{font-family:var(--mono);font-variant-numeric:tabular-nums;
    background:transparent;border:1px solid var(--rule-strong);border-radius:2px}

  /* every figure mono + tabular — non-tabular digits jitter as values change (§3) */
  :root[data-theme="instrument"] .stat b,
  :root[data-theme="instrument"] .due,
  :root[data-theme="instrument"] .demand,
  :root[data-theme="instrument"] .dh-demand,
  :root[data-theme="instrument"] .di-sub,
  :root[data-theme="instrument"] .fts,
  :root[data-theme="instrument"] .cmt-meta,
  :root[data-theme="instrument"] .lc-badge{font-family:var(--mono);font-variant-numeric:tabular-nums}
  /* numbers are mono, prose is not — a blanket td rule widens text columns and
     forces titles to wrap. The numeric cells already carry .mono / .due. */
  :root[data-theme="instrument"] .mono,
  :root[data-theme="instrument"] input[type="date"],
  :root[data-theme="instrument"] table td.mono{font-variant-numeric:tabular-nums}
  :root[data-theme="instrument"] .stat b{letter-spacing:-.01em;font-weight:600;font-size:17px}
  :root[data-theme="instrument"] .dh-demand{letter-spacing:.06em}

  /* pills: outlined silkscreen, never filled lozenges */
  :root[data-theme="instrument"] .pill,
  :root[data-theme="instrument"] .lc-badge,
  :root[data-theme="instrument"] .expbadge,
  :root[data-theme="instrument"] .kindtag,
  :root[data-theme="instrument"] .toctag,
  :root[data-theme="instrument"] .cover{background:transparent;font-size:9px;letter-spacing:.11em;
    text-transform:uppercase;font-weight:600;padding:1px 6px}
  :root[data-theme="instrument"] .statchip{font-family:var(--label);border-radius:2px;font-size:9.5px;
    letter-spacing:.12em;text-transform:uppercase}
  :root[data-theme="instrument"] .statchip.on{background:transparent;font-weight:700}
  :root[data-theme="instrument"] .sys{background:transparent;letter-spacing:.06em}
  :root[data-theme="instrument"] .sys .d{letter-spacing:.12em}
  :root[data-theme="instrument"] .chip{background:transparent}

  /* status edge on list cards stays the only heavy colour — it is the value */
  :root[data-theme="instrument"] .tcard{border-left-width:2px}
  :root[data-theme="instrument"] .tcard.active{background:var(--panel2)}
  :root[data-theme="instrument"] .tcard.s-closed{opacity:.55}

  /* tinted boxes lose their fills; the coloured left edge carries the meaning */
  :root[data-theme="instrument"] .resume-box,
  :root[data-theme="instrument"] .pinbox{border-left-width:2px}
  :root[data-theme="instrument"] .cover.yes{border-color:var(--green-line)}
  :root[data-theme="instrument"] .cover.no{border-color:var(--amber-line)}
  /* unknown/absent is outlined, never a fourth status fill (§7) */
  :root[data-theme="instrument"] .nothumb{border-style:dashed;color:var(--ink-3)}

  /* first-run panel reads as a legend/key on the blueprint, not a welcome banner */
  :root[data-theme="instrument"] .getting-started h1{font-family:var(--label);font-size:13px;
    font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--txt)}
  :root[data-theme="instrument"] .gs-lede{font-size:11.5px;color:var(--ink-3)}
  :root[data-theme="instrument"] .gs-list dt{font-family:var(--label);font-size:10px;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;color:var(--accent);min-width:96px}
  :root[data-theme="instrument"] .gs-list dd{font-size:11.5px;color:var(--ink-3);line-height:1.55}
  :root[data-theme="instrument"] .gs-list dt:not(:first-of-type),
  :root[data-theme="instrument"] .gs-list dd:not(:first-of-type){border-top-style:dotted;border-top-color:var(--rule-strong)}
  :root[data-theme="instrument"] .gs-tip{font-size:10.5px;letter-spacing:.03em;color:var(--ink-3)}

  /* dotted row separators, as on plotter paper */
  :root[data-theme="instrument"] .dashitem{border-bottom-style:dotted;border-bottom-color:var(--rule-strong)}
  :root[data-theme="instrument"] th{font-size:8.5px;letter-spacing:.15em;color:var(--ink-3)}
  :root[data-theme="instrument"] td{border-bottom-style:dotted;border-bottom-color:var(--rule-strong)}
  :root[data-theme="instrument"] ::-webkit-scrollbar-thumb{border-radius:2px;background:var(--rule-strong)}

  #printArea{display:none}
  @media print{
    #app,#modalRoot,#toast{display:none!important}
    #printArea{display:block!important;position:static}
    #printArea.specdoc{font-family:Georgia,"Times New Roman",serif;color:#000;padding:0;max-width:none}
    #printArea h1,#printArea h3{color:#000}
  }
</style>
</head>
<body>
<script>try{var _t=localStorage.getItem("demanddesk.theme");if(_t==="light"||_t==="instrument")document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<div id="app">
  <header>
    <div class="logo"><span class="dot"></span> DEMAND&nbsp;DESK</div>
    <div class="nav">
      <button class="navbtn" data-view="today">Today</button>
      <button class="navbtn" data-view="demands">Demands</button>
      <button class="navbtn" data-view="epics">Epics</button>
      <button class="navbtn" data-view="debug">Debug</button>
      <button class="navbtn" data-view="journal">Journal</button>
      <button class="navbtn" data-view="meetings">Meetings</button>
      <button class="navbtn" data-view="playbook">Playbook</button>
      <button class="navbtn" data-view="vault">🔒 Vault</button>
    </div>
    <div class="hsearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="globalSearch" placeholder="Search demands, objects, transports, systems (H42…), meetings…" autocomplete="off">
      <div id="gsearchResults" class="gsearch hide"></div>
    </div>
    <div class="spacer"></div>
    <span class="faint" id="fileLabel" style="font-size:12px"></span>
    <div class="filebar">
      <span class="savestate" id="saveState"></span>
      <button id="btnReconnect" class="hide" title="Re-link the file remembered from last time">🔌 Reconnect</button>
      <button id="btnOpen" title="Open a .json data file">📂 Open</button>
      <button id="btnSave" class="primary" title="Save to file (Ctrl+S)">💾 Save</button>
      <button id="btnTheme" class="ghost" title="Toggle light / dark theme">☀</button>
      <button id="btnMenu" class="ghost" title="More">⋯</button>
    </div>
  </header>

  <main>
    <aside id="side"></aside>
    <section class="detail" id="detail"></section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   DEMAND DESK v2 — ABAP work tracker (demands, calls, PO team).
   Local .json file (File System Access API) + localStorage mirror.
   ============================================================ */

const LS_KEY="demanddesk.backup.v1", LS_HANDLE_HINT="demanddesk.hadfile", SNAP_KEY="demanddesk.snapshots.v1";
const uid=()=>crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(16).slice(2);
function dstr(d){const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
const todayStr=()=>dstr(new Date());

const STATUS={open:{label:"Open",cls:"open"},progress:{label:"In progress",cls:"progress"},delivered:{label:"Delivered",cls:"delivered"},bug:{label:"Bug / Rework",cls:"bug"},closed:{label:"Closed",cls:"closed"}};
const TASK_TYPES=["Report change","New development","Standard object mod","Infotype change","Troubleshooting","Enhancement","Other"];
const OBJ_TYPES=["Report / Program","Include","Function Module","Class / Method","Structure","Table / View","Data Element / Domain","Infotype","Enhancement / BAdI","Smartform / Adobe","Transformation","Search Help","Other"];
const OBJ_ACTIONS=["Created","Modified","Deleted","Analyzed"];

const DEF_LANDSCAPES=["H0","H1","H2","H3","H4","H5","H6"];
const DEF_TIERS=[{d:"3",label:"Development",short:"DEV"},{d:"2",label:"Pre-prod / QA",short:"QA"},{d:"1",label:"Production",short:"PRD"}];

let state={version:15,settings:{landscapes:[...DEF_LANDSCAPES],tiers:DEF_TIERS,defaultSystem:"H03",encryption:false,autosave:true,clients:{},imageExpiryDays:90},tasks:[],epics:[],meetings:[],calls:[],teamMeetings:[],credentials:[],journal:[],todos:[],debug:[],images:[],playbook:[]};
let fileHandle=null, dirty=false, autoSaveTimer=null, lastSaveAuto=false;
let view="today";
let activeId=null, activeTab="work", activeMeetingId=null, meetingRollup=false, rollupOwner="", rollupTeam="";
let activeJournalId=null, activeDebugId=null, journalTodos=false, activePlayId=null, activeEpicId=null;
let masterPassword=null, pendingEncrypted=null, revealPw={};

const DEBUG_STATUS={active:{label:"Active",cls:"open"},paused:{label:"Paused",cls:"progress"},resolved:{label:"Resolved",cls:"delivered"},abandoned:{label:"Abandoned",cls:"closed"}};
const FIND_KINDS={works:{label:"Works",icon:"✓",color:"var(--green)"},fails:{label:"Fails",icon:"✗",color:"var(--red)"},deadend:{label:"Dead end",icon:"⊘",color:"var(--amber)"},note:{label:"Note",icon:"•",color:"var(--muted)"}};

const supportsFS="showSaveFilePicker" in window;

/* ---------- systems ---------- */
function tierFor(d){ return state.settings.tiers.find(t=>t.d===d); }
function tierMeta(sysId){ const d=String(sysId||"").slice(-1); return tierFor(d); }
function sysTierCls(sysId){ return "t"+(String(sysId||"").slice(-1)); }
function sysPill(sysId,date,client){
  const m=tierMeta(sysId);
  return `<span class="sys ${sysTierCls(sysId)}">${esc(sysId)}<span class="d">${m?m.short:""}</span>${client?` · <span class="d">🗂 ${esc(client)}</span>`:""}${date?` · <span class="d">${date}</span>`:""}</span>`;
}
/* ---------- clients (mandants) — kept per landscape, used only by customizing TRs ---------- */
function landscapeOf(sysId){return sysId?String(sysId).slice(0,-1):"";}
function clientsForSystem(sysId){return (state.settings.clients&&state.settings.clients[landscapeOf(sysId)])||[];}
function isCust(tr){return !!(tr&&tr.kind==="customizing");}
function clientOptions(sysId,selected){
  let cs=clientsForSystem(sysId).slice();
  if(selected&&!cs.includes(selected))cs=[selected,...cs];
  if(!cs.length)return `<option value="">(none — set in ⋯ menu)</option>`;
  return `<option value="">— client —</option>`+cs.map(c=>`<option value="${esc(c)}" ${c===selected?"selected":""}>${esc(c)}</option>`).join("");
}
function systemOptions(selected){
  return `<option value="">—</option>`+state.settings.landscapes.map(L=>{
    const opts=state.settings.tiers.map(T=>{const id=L+T.d;return `<option value="${id}" ${id===selected?"selected":""}>${id} · ${T.label}</option>`;}).join("");
    return `<optgroup label="Landscape ${L}">${opts}</optgroup>`;
  }).join("");
}

/* ---------- crypto (Web Crypto, no deps) ---------- */
function isEncrypted(){return !!(state.settings.encryption&&masterPassword);}
function b64(buf){let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function ub64(str){const s=atob(str);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function encryptString(str,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(str));
  return JSON.stringify({_encrypted:true,app:"demand-desk",v:1,salt:b64(salt),iv:b64(iv),data:b64(ct)});}
function encryptStateStr(pw){return encryptString(JSON.stringify(state),pw);}
/* when the master password is set/changed/removed, re-encrypt (or decrypt) the stored
   daily snapshots too, so no plaintext copy lingers after encryption is enabled */
async function recryptSnapshots(oldPw,newPw){try{
  const arr=await getSnapshots();let changed=false;
  for(const s of arr){try{
    let plain=s.data;
    if(s.enc){ if(!oldPw)continue; plain=JSON.stringify(await decryptEnvelope(JSON.parse(s.data),oldPw)); }
    if(newPw){s.data=await encryptString(plain,newPw);s.enc=true;}else{s.data=plain;s.enc=false;}
    changed=true;
  }catch(e){}}
  if(changed)setSnapshots(arr);
}catch(e){}}
async function decryptEnvelope(env,pw){const key=await deriveKey(pw,ub64(env.salt));
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(env.iv)},key,ub64(env.data));return JSON.parse(new TextDecoder().decode(pt));}
async function serializeData(){return isEncrypted()?await encryptStateStr(masterPassword):JSON.stringify(state,null,2);}

/* ---------- persistence ---------- */
let hadContent=false;
function contentCount(){return state.tasks.length+state.epics.length+state.meetings.length+state.credentials.length+state.journal.length+state.todos.length+state.debug.length+state.images.length+state.playbook.length;}
function isValidState(s){return s&&typeof s==="object"&&Array.isArray(s.tasks)&&Array.isArray(s.epics)&&Array.isArray(s.meetings)&&Array.isArray(s.credentials)&&Array.isArray(s.journal)&&Array.isArray(s.todos)&&Array.isArray(s.debug)&&Array.isArray(s.images)&&Array.isArray(s.playbook);}
function noteContent(){if(isValidState(state)&&contentCount()>0)hadContent=true;}
/* defensive guard: returns true if it is SAFE to persist current state */
function safeToPersist(){return isValidState(state)&&!(hadContent&&contentCount()===0);}
function markDirty(){noteContent();dirty=true;renderSaveState();backupLocal();scheduleAutoSave();}
function renderSaveState(){const el=document.getElementById("saveState");if(!el)return;
  const lock=state.settings.encryption?" 🔒":"";
  if(dirty){el.textContent=(fileHandle?"● Unsaved":"● Not saved")+lock;el.className="savestate dirty";}
  else{el.textContent=(fileHandle?(lastSaveAuto?"✓ Auto-saved":"✓ Saved"):"")+lock;el.className="savestate saved";}}
/* ---------- auto-save (writes to the connected file ~30s after the last change) ---------- */
function scheduleAutoSave(){clearTimeout(autoSaveTimer);if(!state.settings.autosave||!supportsFS)return;autoSaveTimer=setTimeout(autoSaveNow,30000);}
async function autoSaveNow(){
  if(!state.settings.autosave||!fileHandle||!dirty)return;
  if(!isValidState(state)||(hadContent&&contentCount()===0))return; /* silent guard — never auto-write a suspicious state; manual Save still asks */
  try{const w=await fileHandle.createWritable();await w.write(await serializeData());await w.close();
    dirty=false;lastSaveAuto=true;renderSaveState();maybeSnapshot();}
  catch(e){/* e.g. permission revoked — stay dirty; manual 💾 Save will surface the error */}
}
/* ---------- IndexedDB layer (optional; falls back to localStorage) ---------- */
/* IndexedDB gives a larger, sturdier backup store and can hold the file handle
   so the app re-links to your .json on next launch. If IndexedDB or the File
   System Access API isn't available (e.g. blocked on a locked-down machine),
   everything below silently falls back to exactly the localStorage behaviour. */
const IDB_NAME="demanddesk", IDB_STORE="kv";
let idb=null, useIdb=false, savedHandle=null;
function idbOpen(){return new Promise((res,rej)=>{let rq;try{rq=indexedDB.open(IDB_NAME,1);}catch(e){return rej(e);}
  rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);};
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);rq.onblocked=()=>rej(new Error("idb blocked"));});}
function idbGet(k){return new Promise((res,rej)=>{try{const tx=idb.transaction(IDB_STORE,"readonly");const r=tx.objectStore(IDB_STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
function idbSet(k,v){return new Promise((res,rej)=>{try{const tx=idb.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}catch(e){rej(e);}});}
function idbDel(k){return new Promise((res)=>{try{const tx=idb.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});}
async function initStore(){
  try{idb=await idbOpen();useIdb=!!idb;}catch(e){idb=null;useIdb=false;}
  if(useIdb){try{ /* one-time migrate existing localStorage backup into IndexedDB */
    if((await idbGet("backup"))==null){const ls=localStorage.getItem(LS_KEY);if(ls){await idbSet("backup",ls);const sn=localStorage.getItem(SNAP_KEY);if(sn)await idbSet("snapshots",sn);await idbSet("hadfile","1");}}
  }catch(e){}}
}

/* ---------- backup (writes localStorage always + IndexedDB when available) ---------- */
let encBackupTimer=null;
function persistBackup(str){
  try{localStorage.setItem(LS_KEY,str);localStorage.setItem(LS_HANDLE_HINT,"1");}catch(e){/* e.g. 5MB quota full — IndexedDB still covers it */}
  if(useIdb){idbSet("backup",str).catch(()=>{});idbSet("hadfile","1").catch(()=>{});}
}
function backupLocal(){
  if(!safeToPersist())return; /* never let a corrupt/emptied state clobber the good backup */
  if(isEncrypted()){clearTimeout(encBackupTimer);encBackupTimer=setTimeout(async()=>{if(!safeToPersist())return;try{persistBackup(await encryptStateStr(masterPassword));}catch(e){}},1000);return;}
  persistBackup(JSON.stringify(state));
}
async function loadBackup(){
  let raw=null;
  if(useIdb){try{const v=await idbGet("backup");if(v!=null)raw=v;}catch(e){}}
  if(raw==null){try{raw=localStorage.getItem(LS_KEY);}catch(e){}}
  if(raw==null)return false;
  try{const p=JSON.parse(raw);if(p&&p._encrypted){pendingEncrypted=p;return "encrypted";}state=migrate(p);return true;}catch(e){return false;}
}
async function getSnapshots(){
  if(useIdb){try{const v=await idbGet("snapshots");if(v!=null)return JSON.parse(v);}catch(e){}}
  try{return JSON.parse(localStorage.getItem(SNAP_KEY)||"[]");}catch(e){return [];}
}
function setSnapshots(arr){const str=JSON.stringify(arr);try{localStorage.setItem(SNAP_KEY,str);}catch(e){}if(useIdb)idbSet("snapshots",str).catch(()=>{});}
async function maybeSnapshot(){try{
  const arr=await getSnapshots();const today=todayStr();
  if(arr.length&&arr[arr.length-1].date===today)return;
  arr.push({date:today,ts:Date.now(),enc:isEncrypted(),data:await serializeData()});
  while(arr.length>14)arr.shift();
  setSnapshots(arr);
}catch(e){}}

/* ---------- persistent file handle ---------- */
function rememberHandle(){if(useIdb&&fileHandle){savedHandle=fileHandle;idbSet("handle",fileHandle).catch(()=>{});}updateReconnectUI();}
async function restoreHandle(){
  if(!useIdb||!supportsFS||fileHandle)return;
  try{savedHandle=await idbGet("handle");}catch(e){savedHandle=null;}
  if(!savedHandle)return;
  let perm="prompt";try{if(savedHandle.queryPermission)perm=await savedHandle.queryPermission({mode:"readwrite"});}catch(e){}
  if(perm==="granted"){fileHandle=savedHandle;setFileLabel(savedHandle.name);}
  updateReconnectUI();renderSaveState();
}
async function reconnectFile(){
  if(!savedHandle)return;
  try{
    let perm="prompt";if(savedHandle.queryPermission)perm=await savedHandle.queryPermission({mode:"readwrite"});
    if(perm!=="granted"&&savedHandle.requestPermission)perm=await savedHandle.requestPermission({mode:"readwrite"});
    if(perm==="granted"){fileHandle=savedHandle;setFileLabel(savedHandle.name);updateReconnectUI();renderSaveState();if(dirty)scheduleAutoSave();toast("Reconnected → "+savedHandle.name+" · saves now go to your file");}
    else toast("Permission not granted — use 📂 Open instead",true);
  }catch(e){toast("Couldn't reconnect: "+e.message,true);}
}
function updateReconnectUI(){const b=document.getElementById("btnReconnect");if(!b)return;
  if(savedHandle&&!fileHandle){b.classList.remove("hide");b.textContent="🔌 Reconnect "+(savedHandle.name||"file");}
  else b.classList.add("hide");}
async function forgetHandle(){savedHandle=null;if(useIdb)await idbDel("handle");updateReconnectUI();}

function migrate(d){
  d.version=15;
  d.settings=d.settings||{};
  d.settings.landscapes=d.settings.landscapes&&d.settings.landscapes.length?d.settings.landscapes:[...DEF_LANDSCAPES];
  d.settings.tiers=d.settings.tiers&&d.settings.tiers.length?d.settings.tiers:DEF_TIERS;
  d.settings.defaultSystem=d.settings.defaultSystem||"H03";
  d.settings.encryption=!!d.settings.encryption;
  d.settings.autosave=d.settings.autosave!==false;
  d.settings.clients=(d.settings.clients&&typeof d.settings.clients==="object")?d.settings.clients:{};
  d.settings.imageExpiryDays=(typeof d.settings.imageExpiryDays==="number")?d.settings.imageExpiryDays:90;
  d.images=(d.images||[]).map(normImage);
  d.playbook=(d.playbook||[]).map(normPlay);
  d.epics=(d.epics||[]).map(normEpic);
  /* referential integrity: a demand pointing at a deleted epic falls back to none,
     so a stale id can never render as a phantom grouping */
  {const eids=new Set(d.epics.map(e=>e.id));
   d.tasks.forEach(t=>{if(t.epicId&&!eids.has(t.epicId))t.epicId="";});}
  d.tasks=(d.tasks||[]).map(t=>{
    const tocs=(t.tocs||[]).map(normToc);
    const transports=(t.transports||[]).map(tr=>({
      id:tr.id||uid(),number:tr.number||"",desc:tr.desc||"",system:tr.system||d.settings.defaultSystem,released:!!tr.released,
      kind:tr.kind==="customizing"?"customizing":"workbench", client:tr.client||"",
      syncs:(tr.syncs||[]).map(s=>({system:s.system||"",date:s.date||""})), tocId:tr.tocId||"", toc:tr.toc||"",
      objectIds:(tr.objectIds||[]).slice(),
      notes:(tr.notes||"")+(tr.syncedTo?` [legacy synced-to: ${tr.syncedTo}]`:"")
    }));
    /* migrate legacy free-text ToC numbers into first-class ToC records */
    transports.forEach(tr=>{ if(!tr.tocId && tr.toc){ let toc=tocs.find(x=>x.number===tr.toc); if(!toc){toc=normToc({number:tr.toc}); tocs.push(toc);} tr.tocId=toc.id; } tr.toc=""; });
    return {
    id:t.id||uid(),demandId:t.demandId||"",title:t.title||"(untitled)",type:t.type||"Other",status:t.status||"open",
    requestor:t.requestor||"",epicId:t.epicId||"",project:t.project||"",theme:t.theme||"",
    waiting:{on:(t.waiting&&t.waiting.on)||"",since:(t.waiting&&t.waiting.since)||""},goliveTarget:t.goliveTarget||"",
    receivedDate:t.receivedDate||"",dueDate:t.dueDate||"",description:t.description||"",notes:t.notes||"",
    timeline:(t.timeline||[]).map(e=>({id:e.id||uid(),ts:e.ts||Date.now(),type:e.type||"note",from:e.from||"",to:e.to||"",note:e.note||""})),
    subtasks:(t.subtasks||[]).map(normSub),
    objects:(t.objects||[]).map(o=>({id:o.id||uid(),name:o.name||"",type:o.type||"",action:o.action||"Modified",desc:o.desc||""})),
    transports, tocs,
    comments:(t.comments||[]).map(normComment),
    reference:(t.reference||[]).map(r=>({id:r.id||uid(),label:r.label||"",value:r.value||"",secret:!!r.secret,pinned:!!r.pinned})),
    createdAt:t.createdAt||Date.now(),updatedAt:t.updatedAt||Date.now(),
  };});
  /* ----- unify legacy calls + teamMeetings into a single meetings collection -----
     Idempotent: after the first migration the legacy arrays are emptied, so a
     saved file re-loaded never double-merges. New data only ever goes to meetings. */
  d.meetings=(d.meetings||[]).map(normMeeting);
  (d.calls||[]).forEach(c=>d.meetings.push(normMeeting({id:c.id,date:c.date,title:c.title||"(untitled call)",team:"",attendees:c.attendees,body:c.body,taskIds:c.taskIds,actions:[],createdAt:c.createdAt,updatedAt:c.updatedAt})));
  (d.teamMeetings||[]).forEach(m=>d.meetings.push(normMeeting({id:m.id,date:m.date,title:m.title||"(untitled meeting)",team:m.team||"",attendees:m.attendees,body:m.body,taskIds:[],actions:m.actions,createdAt:m.createdAt,updatedAt:m.updatedAt})));
  d.calls=[];d.teamMeetings=[];
  d.todos=(d.todos||[]).map(normTodo);
  d.credentials=(d.credentials||[]).map(c=>({id:c.id||uid(),system:c.system||"",client:c.client||"",label:c.label||"",url:c.url||"",username:c.username||"",password:c.password||"",notes:c.notes||"",updatedAt:c.updatedAt||Date.now()}));
  d.journal=(d.journal||[]).map(j=>({id:j.id||uid(),date:j.date||todayStr(),title:j.title||"",body:j.body||"",taskIds:(j.taskIds||[]).slice(),createdAt:j.createdAt||Date.now(),updatedAt:j.updatedAt||Date.now()}));
  d.debug=(d.debug||[]).map(s=>({id:s.id||uid(),title:s.title||"(untitled debug)",demandId:s.demandId||"",taskId:s.taskId||"",status:s.status||"active",resume:s.resume||"",notes:s.notes||"",
    objects:(s.objects||[]).map(o=>({id:o.id||uid(),name:o.name||"",note:o.note||""})),
    breakpoints:(s.breakpoints||[]).map(b=>({id:b.id||uid(),object:b.object||"",line:b.line||"",condition:b.condition||"",hit:!!b.hit,note:b.note||""})),
    findings:(s.findings||[]).map(f=>({id:f.id||uid(),ts:f.ts||Date.now(),kind:f.kind||"note",text:f.text||""})),
    watches:(s.watches||[]).map(w=>({id:w.id||uid(),name:w.name||"",value:w.value||"",where:w.where||""})),
    createdAt:s.createdAt||Date.now(),updatedAt:s.updatedAt||Date.now()}));
  return d;
}
function normSub(s){return{id:s.id||uid(),title:s.title||"",done:!!s.done,receivedDate:s.receivedDate||"",dueDate:s.dueDate||"",collapsed:!!s.collapsed,comments:(s.comments||[]).map(normComment),children:(s.children||[]).map(normSub)};}
function normComment(c){return{id:c.id||uid(),text:c.text||"",ts:c.ts||Date.now()};}
function normAction(a){return{id:a.id||uid(),text:a.text||"",owner:a.owner||"",done:!!a.done,due:a.due||"",resolution:a.resolution||""};}
function normMeeting(m){return{id:m.id||uid(),date:m.date||todayStr(),title:m.title||"(untitled meeting)",team:m.team||"",attendees:m.attendees||"",body:m.body||"",taskIds:(m.taskIds||[]).slice(),actions:(m.actions||[]).map(normAction),createdAt:m.createdAt||Date.now(),updatedAt:m.updatedAt||Date.now()};}
function normTodo(x){return{id:x.id||uid(),text:x.text||"",done:!!x.done,due:x.due||"",resolution:x.resolution||"",createdAt:x.createdAt||Date.now(),doneAt:x.doneAt||null};}
function normImage(x){return{id:x.id||uid(),file:x.file||"",label:x.label||"",expiry:x.expiry||"",links:(x.links||[]).filter(l=>l&&l.kind&&l.id).map(l=>({kind:l.kind,id:l.id})),addedAt:x.addedAt||Date.now()};}
/* ---------- epics ----------
   A first-class grouping for related demands (e.g. "LUCA"): a connection, a report
   and a standard-object change can share one epic while staying separate demands,
   each with its own transports and go-live target. Distinct from `project`/`theme`,
   which remain free-text labels. */
const EPIC_STATUS={active:{label:"Active",cls:"open"},onhold:{label:"On hold",cls:"progress"},
  delivered:{label:"Delivered",cls:"delivered"},closed:{label:"Closed",cls:"closed"}};
function normEpic(e){return{id:e.id||uid(),name:e.name||"(untitled epic)",code:e.code||"",description:e.description||"",
  owner:e.owner||"",targetDate:e.targetDate||"",status:EPIC_STATUS[e.status]?e.status:"active",notes:e.notes||"",
  createdAt:e.createdAt||Date.now(),updatedAt:e.updatedAt||Date.now()};}
const PLAY_KINDS={
  process:{label:"Process / How-to",icon:"📋"},
  faq:{label:"FAQ",icon:"❓"},
  recurring:{label:"Recurring task",icon:"🔁"},
  freeze:{label:"Freeze period",icon:"❄"},
  contacts:{label:"Contacts / Responsibilities",icon:"👥"}
};
function normPlay(p){return{id:p.id||uid(),kind:PLAY_KINDS[p.kind]?p.kind:"process",title:p.title||"(untitled)",category:p.category||"",body:p.body||"",pinned:!!p.pinned,
  steps:(p.steps||[]).map(s=>({id:s.id||uid(),text:s.text||""})),
  due:p.due||"",recur:["annual","quarterly","monthly","once"].includes(p.recur)?p.recur:"annual",lastDone:p.lastDone||null,
  from:p.from||"",to:p.to||"",systems:(p.systems||[]).slice(),
  people:(p.people||[]).map(x=>({id:x.id||uid(),name:x.name||"",role:x.role||"",contact:x.contact||""})),
  createdAt:p.createdAt||Date.now(),updatedAt:p.updatedAt||Date.now()};}
function activeFreezes(date){date=date||todayStr();return state.playbook.filter(p=>p.kind==="freeze"&&p.from&&p.to&&p.from<=date&&date<=p.to);}
function freezeFor(sysId,date){return activeFreezes(date).find(f=>(f.systems||[]).includes(sysId))||null;}
function advanceRecurring(p){
  p.lastDone=Date.now();
  if(!p.due)return;
  if(p.recur==="once"){p.due="";return;}
  const d=new Date(p.due+"T00:00:00"),day=d.getDate();
  if(p.recur==="annual")d.setFullYear(d.getFullYear()+1);
  else if(p.recur==="quarterly")d.setMonth(d.getMonth()+3);
  else d.setMonth(d.getMonth()+1);
  if(d.getDate()!==day)d.setDate(0); /* month overflow (e.g. Jan 31 + 1mo) → clamp to month end */
  p.due=isoD(d);
}
function normToc(x){return{id:x.id||uid(),number:x.number||"",desc:x.desc||"",syncs:(x.syncs||[]).map(s=>({system:s.system||"",date:s.date||""})),notes:x.notes||""};}
/* ToC + effective-sync helpers: a TR bundled into a ToC inherits the ToC's downstream syncs */
function tocFor(t,tr){return tr.tocId?(t.tocs||[]).find(x=>x.id===tr.tocId):null;}
function effectiveSyncs(t,tr){
  const own=tr.syncs.filter(s=>s.system).map(s=>({system:s.system,date:s.date,via:""}));
  const toc=tocFor(t,tr);
  const viaToc=toc?toc.syncs.filter(s=>s.system).map(s=>({system:s.system,date:s.date,via:toc.number||"ToC"})):[];
  return [...own,...viaToc];
}
function reachedSystems(t,tr){const set=new Set();effectiveSyncs(t,tr).forEach(s=>set.add(s.system));return set;}
function prodTargetFor(t){ /* default go-live target = production tier of the first transport's landscape */
  const tr=t.transports[0]; if(!tr||!tr.system)return "";
  const L=tr.system.slice(0,-1); const prod=(state.settings.tiers.find(x=>x.d==="1"));
  return prod?L+prod.d:"";
}
const WAIT_OPTIONS=["QA team","Functional team","Transport import","Business","Basis","Another team","Me (action needed)"];
function isWaiting(t){return !!(t.waiting&&t.waiting.on);}
function waitDays(t){return (t.waiting&&t.waiting.since)?Math.max(0,-daysUntil(t.waiting.since)):null;}
function trsForObject(t,objId){return t.transports.filter(tr=>(tr.objectIds||[]).includes(objId));}
function goliveTargetFor(t){return t.goliveTarget||prodTargetFor(t)||"";}
function golivePending(t){const tgt=goliveTargetFor(t);if(!tgt||!t.transports.length)return null;const missing=t.transports.filter(tr=>!reachedSystems(t,tr).has(tgt));return missing.length?{target:tgt,missing}:null;}

async function loadFromText(txt,labelName){
  let parsed=JSON.parse(txt);
  if(parsed&&parsed._encrypted){
    while(true){const pw=await promptPassword("🔒 Enter master password"+(labelName?" for "+labelName:""));
      if(pw===null)return false;
      try{state=migrate(await decryptEnvelope(parsed,pw));masterPassword=pw;break;}
      catch(e){toast("Wrong password — try again",true);}}
  }else{state=migrate(parsed);masterPassword=null;}
  return true;
}

async function exportDownload(){if(!saveGuardOk("download"))return;const b=new Blob([await serializeData()],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="demand-desk-data.json";a.click();URL.revokeObjectURL(a.href);dirty=false;renderSaveState();maybeSnapshot();toast("Downloaded data file"+(isEncrypted()?" 🔒":""));}
function importViaInput(){const i=document.createElement("input");i.type="file";i.accept=".json,application/json";

/* password prompt — returns Promise<string|null> */
function promptPassword(title,confirm){
  return new Promise(resolve=>{
    const root=document.getElementById("modalRoot");
    root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:400px"><h2>${esc(title)}</h2>
      <div class="field"><label>Password</label><input type="password" id="pw1" autocomplete="off"></div>
      ${confirm?`<div class="field"><label>Confirm password</label><input type="password" id="pw2" autocomplete="off"></div>`:""}
      <div id="pw-err" class="faint" style="color:var(--red);font-size:12px;min-height:14px"></div>
      <div class="modal-foot"><button id="pw-cancel" class="ghost">Cancel</button><button id="pw-ok" class="primary">OK</button></div></div></div>`;
    const p1=root.querySelector("#pw1");p1.focus();
    const done=v=>{root.innerHTML="";resolve(v);};
    const submit=()=>{const v=p1.value;if(confirm){const v2=root.querySelector("#pw2").value;if(v.length<4){root.querySelector("#pw-err").textContent="Use at least 4 characters.";return;}if(v!==v2){root.querySelector("#pw-err").textContent="Passwords don't match.";return;}}else if(!v){return;}done(v);};
    root.querySelector("#pw-ok").onclick=submit;
    root.querySelector("#pw-cancel").onclick=()=>done(null);
    root.querySelectorAll("input").forEach(inp=>inp.onkeydown=e=>{if(e.key==="Enter")submit();if(e.key==="Escape")done(null);});
  });
}

function activeTask(){return state.tasks.find(t=>t.id===activeId);}
function activeMeeting(){return state.meetings.find(m=>m.id===activeMeetingId);}
function touch(o){o.updatedAt=Date.now();markDirty();}
function daysUntil(d){if(!d)return null;return Math.round((new Date(d+"T00:00:00")-new Date(todayStr()+"T00:00:00"))/86400000);}
function dueClass(d,status){if(!d||status==="delivered"||status==="closed")return"";const n=daysUntil(d);if(n===null)return"";if(n<0)return"over";if(n<=3)return"soon";return"";}
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
/* linkify: escape text but render http(s) URLs as clickable links */
const URL_RE=/(https?:\/\/[^\s<>"')\]]+)/g;
function linkify(raw){return String(raw||"").split(URL_RE).map((p,i)=>i%2?`<a href="${esc(p)}" target="_blank" rel="noopener">${esc(p)}</a>`:esc(p)).join("");}
function linkChips(text){const m=String(text||"").match(URL_RE);if(!m)return"";const u=[...new Set(m)];
  return `<div class="chiprow" style="margin-top:6px">${u.map(x=>`<a class="chip" href="${esc(x)}" target="_blank" rel="noopener" style="text-decoration:none">🔗 ${esc(x.length>62?x.slice(0,59)+"…":x)}</a>`).join("")}</div>`;}
function toast(m,err){const t=document.getElementById("toast");t.textContent=m;t.className="toast show"+(err?" err":"");clearTimeout(toast._t);toast._t=setTimeout(()=>t.className="toast",2600);}
function countSubs(list){let n=0,done=0;(function w(a){a.forEach(s=>{n++;if(s.done)done++;w(s.children);});})(list);return{n,done};}
function findSub(list,id){for(const s of list){if(s.id===id)return{sub:s,parent:list};const r=findSub(s.children,id);if(r)return r;}return null;}
function earliestOpenDue(t){let best=null;if(t.dueDate&&t.status!=="delivered"&&t.status!=="closed")best=t.dueDate;(function w(a){a.forEach(s=>{if(!s.done&&s.dueDate&&(!best||s.dueDate<best))best=s.dueDate;w(s.children);});})(t.subtasks);return best;}
function activeEpic(){return state.epics.find(e=>e.id===activeEpicId);}
function epicById(id){return id?state.epics.find(e=>e.id===id):null;}
function tasksForEpic(id){return state.tasks.filter(t=>t.epicId===id);}
function epicLabel(e){return (e.code?e.code+" · ":"")+e.name;}
/* Rollup across an epic's demands: status mix, every object and transport it
   touches, and whether the whole epic has actually reached production. */
function epicRollup(e){
  const ts=tasksForEpic(e.id);
  const counts={};ts.forEach(t=>counts[t.status]=(counts[t.status]||0)+1);
  const objects=[],trs=[];
  ts.forEach(t=>{t.objects.forEach(o=>{if(o.name)objects.push({o,t});});
    t.transports.forEach(tr=>trs.push({tr,t}));});
  const pending=ts.map(t=>({t,g:golivePending(t)})).filter(x=>x.g);
  const overdue=ts.filter(t=>{const d=earliestOpenDue(t);return d&&daysUntil(d)<0;});
  const openTs=ts.filter(t=>!["delivered","closed"].includes(t.status));
  return {ts,counts,objects,trs,pending,overdue,openTs,
    done:ts.filter(t=>["delivered","closed"].includes(t.status)).length};
}

function journalForTask(id){return state.journal.filter(j=>(j.taskIds||[]).includes(id));}
function debugForTask(id){return state.debug.filter(s=>s.taskId===id);}
function linkedCount(id){return meetingsForTask(id).length+journalForTask(id).length+debugForTask(id).length;}
function meetingOpenActions(m){return m.actions.filter(a=>!a.done).length;}
function distinctMeetingTeams(){return [...new Set(state.meetings.map(m=>m.team).filter(Boolean))].sort();}

function renderStats(){const s={open:0,progress:0,delivered:0,bug:0,closed:0,overdue:0};
  state.tasks.forEach(t=>{s[t.status]=(s[t.status]||0)+1;const d=earliestOpenDue(t);if(d&&daysUntil(d)<0)s.overdue++;});
  const el=document.getElementById("stats");if(!el)return;
  const shown=state.tasks.filter(demandFilter()).length,sel=statusSel();
  el.innerHTML=`<div class="stat op"><b>${s.open+s.progress}</b>active</div><div class="stat ov"><b>${s.overdue}</b>overdue</div><div class="stat"><b>${s.bug}</b>bugs</div><div class="stat dl"><b>${s.delivered}</b>delivered</div>`
    +(sel.size?`<div class="stat" title="Matching the selected statuses"><b>${shown}</b>shown</div>`:"");}
/* _fs is an array of statuses (legacy single-string values still load fine) */
function statusSel(){const v=renderDemandSidebar._fs;
  return new Set(Array.isArray(v)?v:(v?[v]:[]));}
function demandFilter(){
  const sel=statusSel(),fReq=renderDemandSidebar._fr||"",fProj=renderDemandSidebar._fp||"",
        fTheme=renderDemandSidebar._ft||"",fEpic=renderDemandSidebar._fe||"",hideClosed=!!renderDemandSidebar._hc;
  return t=>(!fReq||t.requestor===fReq)&&(!fProj||t.project===fProj)&&(!fTheme||t.theme===fTheme)
    &&(!fEpic||(fEpic==="__none"?!t.epicId:t.epicId===fEpic))
    /* explicit chips win; hide-closed is only the default convenience */
    &&(sel.size?sel.has(t.status):!(hideClosed&&t.status==="closed"));
}

        ${due?`<span class="due ${dc}">⚑ ${due}${dc==="over"?" ("+(-daysUntil(due))+"d)":""}</span>`:""}</div></div>`;}).join("");
  el.querySelectorAll(".tcard").forEach(c=>c.onclick=()=>{activeId=c.dataset.id;activeTab="work";renderApp();});

function renderReference(body,t){

function mkSub(){return{id:uid(),title:"New subtask",done:false,receivedDate:todayStr(),dueDate:"",collapsed:false,comments:[],children:[]};}
function renderTree(host,t,list){
  if(!list.length){if(host.classList.contains("tree"))host.innerHTML=`<div class="faint" style="font-size:12px;padding:4px 2px">No subtasks. Use “＋ Add subtask”, then branch each into sub-subtasks with “＋”.</div>`;return;}
  host.innerHTML="";
  list.forEach(s=>{const node=document.createElement("div");node.className="node";const dc=dueClass(s.dueDate,s.done?"closed":"open");const kids=s.children.length>0;const cc=(s.comments||[]).length;
    node.innerHTML=`<div class="nrow ${s.done?"done":""}">
      <span class="twist">${kids?(s.collapsed?"▶":"▼"):"·"}</span>
      <span class="chk ${s.done?"done":""}">${s.done?"✓":""}</span>
      <span class="nm">${esc(s.title)||"<span class='faint'>(click to name)</span>"}</span>
      <span class="ndates"><span title="Received">⇩ <input type="date" value="${s.receivedDate}" class="d-rec" style="width:130px;font-size:11px"></span><span title="Due">⚑ <input type="date" value="${s.dueDate}" class="d-due ${dc}" style="width:130px;font-size:11px"></span></span>
      <span class="nact"><button class="ghost sm a-cmt" title="Comments">💬${cc?`<span style="font-size:10px">${cc}</span>`:""}</button><button class="ghost sm a-add" title="Add sub-subtask">＋</button><button class="ghost sm danger a-del" title="Delete">🗑</button></span></div>
      <div class="children ${s.collapsed?"hide":""}"></div>`;
    const row=node.querySelector(".nrow");
    row.querySelector(".twist").onclick=()=>{if(kids){s.collapsed=!s.collapsed;touch(t);renderDetail();}};
    row.querySelector(".chk").onclick=()=>{s.done=!s.done;touch(t);renderDetail();};
    const nm=row.querySelector(".nm");nm.onclick=()=>editInline(nm,s.title,v=>{s.title=v;touch(t);renderDetail();});
    row.querySelector(".d-rec").onchange=e=>{s.receivedDate=e.target.value;touch(t);};
    row.querySelector(".d-due").onchange=e=>{s.dueDate=e.target.value;touch(t);renderDetail();};
    row.querySelector(".a-cmt").onclick=()=>openSubCommentsModal(t,s);
    row.querySelector(".a-add").onclick=()=>{s.children.push(mkSub());s.collapsed=false;touch(t);renderDetail();};
    row.querySelector(".a-del").onclick=()=>{const r=findSub(t.subtasks,s.id);if(r){r.parent.splice(r.parent.indexOf(s),1);touch(t);renderDetail();}};
    if(kids&&!s.collapsed)renderTree(node.querySelector(".children"),t,s.children);
    host.appendChild(node);});
}
function editInline(span,val,cb){const inp=document.createElement("input");inp.value=val;inp.style.width="100%";span.replaceWith(inp);inp.focus();inp.select();const done=()=>cb(inp.value.trim());inp.onblur=done;inp.onkeydown=e=>{if(e.key==="Enter")inp.blur();if(e.key==="Escape"){inp.value=val;inp.blur();}};}

function fmtTs(ts){const d=new Date(ts);return d.toLocaleDateString()+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function renderComments(host,owner,onChange){
  const list=owner.comments||(owner.comments=[]);
  host.innerHTML=`<div class="cmts">${list.length?list.map(c=>`<div class="cmt" data-id="${c.id}"><div class="cmt-meta"><span>${fmtTs(c.ts)}</span><button class="ghost sm c-del" title="Delete">🗑</button></div><div class="cmt-text">${linkify(c.text)}</div></div>`).join(""):`<div class="faint" style="font-size:12px">No comments yet.</div>`}</div>
    <div class="cmt-add"><textarea placeholder="Add a comment… (Ctrl+Enter to post)" rows="2"></textarea><button class="primary sm c-post">Post</button></div>`;
  const ta=host.querySelector(".cmt-add textarea");
  const post=()=>{const v=ta.value.trim();if(!v)return;list.push({id:uid(),text:v,ts:Date.now()});ta.value="";onChange();renderComments(host,owner,onChange);};
  host.querySelector(".c-post").onclick=post;
  ta.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")post();};
  host.querySelectorAll(".cmt").forEach(el=>{const c=list.find(x=>x.id===el.dataset.id);
    el.querySelector(".c-del").onclick=()=>{if(confirm("Delete this comment?")){list.splice(list.indexOf(c),1);onChange();renderComments(host,owner,onChange);}};
    const txt=el.querySelector(".cmt-text");txt.onclick=e=>{if(e.target.tagName==="A")return;editInline(txt,c.text,v=>{if(v){c.text=v;}onChange();renderComments(host,owner,onChange);});};});
}

function renderTransports(body,t){
  body.innerHTML=`<div id="readiness"></div>
    <div class="sec-title"><h3>Transport requests</h3><div class="ln"></div><button class="sm" id="expTr" title="Export all transports across all demands to CSV">⬇ CSV</button><button class="sm" id="addTr">＋ Add transport</button></div>
    <p class="faint" style="font-size:12px;margin:-4px 0 10px">Order = release order (use ↑↓). Add a sync target for each system a TR was imported to. If a TR is bundled in a <b>Transport of Copies</b>, its downstream systems are inherited from the ToC. Mark client-dependent config as <b>Customizing</b> to record its client (e.g. H13 / 150); <b>Workbench</b> TRs are client-independent.</p>
    <div id="trList"></div>
    <div class="sec-title" style="margin-top:22px"><h3>Transports of Copies (ToC)</h3><div class="ln"></div><button class="sm" id="addToc">＋ New ToC</button></div>
