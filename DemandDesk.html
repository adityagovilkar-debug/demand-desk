  root.querySelector("#mn-snaps").onclick=()=>{close();openSnapshots();};
  root.querySelector("#mn-restore").onclick=async()=>{const r=await loadBackup();if(r==="encrypted"){close();await unlockStartup();if(!pendingEncrypted){dirty=true;renderSaveState();}}else if(r){resetActive();dirty=true;close();renderApp();toast("Restored from local backup — Ctrl+S to write it to your file");}else toast("No local backup found",true);};
  const mf=root.querySelector("#mn-forget");if(mf)mf.onclick=async()=>{await forgetHandle();toast("Forgot the remembered file");close();};
  root.querySelector("#mn-close").onclick=close;
  root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
}
async function openSnapshots(){
  const root=document.getElementById("modalRoot");
  let arr=await getSnapshots();
  arr=arr.slice().reverse();
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:420px"><h2>↺ Daily snapshots</h2>
    ${arr.length?`<div class="picklist">${arr.map((s,i)=>`<div class="pickrow" data-i="${i}"><div><div>${s.date} ${s.enc?"🔒":""}</div><div class="faint" style="font-size:11px">${fmtTs(s.ts)}</div></div></div>`).join("")}</div>`:`<p class="faint">No snapshots yet — they're created when you Save.</p>`}
    <div class="modal-foot"><button id="s-close" class="primary">Close</button></div></div></div>`;
  const close=()=>root.innerHTML="";
  root.querySelector("#s-close").onclick=close;
  root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
  root.querySelectorAll(".pickrow[data-i]").forEach(el=>el.onclick=async()=>{const s=arr[+el.dataset.i];
    if(!confirm("Restore snapshot from "+s.date+"? Current unsaved changes will be replaced."))return;
    try{if(await loadFromText(s.data,"snapshot "+s.date)){resetActive();dirty=true;close();renderApp();toast("Restored snapshot "+s.date+" — Ctrl+S to write it to your file");}}
    catch(e){toast("Snapshot is unreadable: "+e.message,true);}});
}

/* Theme is a UI preference kept in localStorage (NOT the encrypted data file), so
   it works on the lock screen and never sits behind the master password. Purely
   presentational — no logic reads it. */
const THEME_KEY="demanddesk.theme";
const THEMES=["dark","light","instrument"];
const THEME_ICON={dark:"☀",light:"▦",instrument:"🌙"};   /* icon shows what you'd switch TO */
const THEME_NEXT_LABEL={dark:"light",light:"instrument white",instrument:"dark"};
function currentTheme(){try{const t=localStorage.getItem(THEME_KEY);return THEMES.includes(t)?t:"dark";}catch(e){return "dark";}}
function applyTheme(t){const el=document.documentElement;el.setAttribute("data-theme",t);
  /* Chromium doesn't reliably repaint already-rendered persistent chrome (the header)
     when a :root custom property changes. Detaching and reattaching the root forces
     every element to re-resolve the variables; it's synchronous, so no flash. */
  el.style.display="none";void el.offsetHeight;el.style.display="";
  const b=document.getElementById("btnTheme");
  if(b){b.textContent=THEME_ICON[t]||"☀";b.title="Switch to "+THEME_NEXT_LABEL[t]+" theme";}}
function toggleTheme(){const nx=THEMES[(THEMES.indexOf(currentTheme())+1)%THEMES.length];
  try{localStorage.setItem(THEME_KEY,nx);}catch(e){}applyTheme(nx);}
document.getElementById("btnTheme").onclick=toggleTheme;
applyTheme(currentTheme());

/* ---------- idle lock (only when encryption is on) ---------- */
const IDLE_MS=15*60*1000;
let lastActivity=Date.now(),screenLocked=false;
["mousemove","keydown","mousedown","wheel","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{lastActivity=Date.now();},{passive:true}));
setInterval(()=>{if(!screenLocked&&isEncrypted()&&Date.now()-lastActivity>IDLE_MS)lockScreen();},30000);
function lockScreen(){
  if(screenLocked)return;screenLocked=true;revealPw={};
  const veil=document.createElement("div");veil.className="lockveil";
  veil.innerHTML=`<div class="modal" style="width:360px"><h2>🔒 Locked (idle)</h2>
    <p class="faint" style="font-size:12px">Locked after 15 minutes of inactivity. Nothing was lost — unsaved changes are kept.</p>
    <div class="field"><label>Master password</label><input type="password" id="lk-pw" autocomplete="off"></div>
    <div id="lk-err" style="color:var(--red);font-size:12px;min-height:14px"></div>
    <div class="modal-foot"><button id="lk-ok" class="primary" style="width:100%">Unlock</button></div></div>`;
  document.body.appendChild(veil);
  const pw=veil.querySelector("#lk-pw");pw.focus();
  const tryUnlock=()=>{if(pw.value===masterPassword){veil.remove();screenLocked=false;lastActivity=Date.now();renderApp();}
    else{veil.querySelector("#lk-err").textContent="Wrong password.";pw.value="";pw.focus();}};
  veil.querySelector("#lk-ok").onclick=tryUnlock;
  pw.onkeydown=e=>{if(e.key==="Enter")tryUnlock();};
}

async function unlockStartup(){
  while(true){const pw=await promptPassword("🔒 Enter master password to unlock Demand Desk");
    if(pw===null){document.getElementById("detail").innerHTML=nopick("🔒 Locked. <button class='sm' id='retry' style='margin-top:10px'>Unlock</button>");
      const r=document.getElementById("retry");if(r)r.onclick=unlockStartup;return;}
    try{state=migrate(await decryptEnvelope(pendingEncrypted,pw));masterPassword=pw;pendingEncrypted=null;renderApp();toast("Unlocked 🔒");return;}
    catch(e){toast("Wrong password — try again",true);}}
}

async function boot(){

  if(res==="encrypted"){ renderApp(); await unlockStartup(); }
  else {

    let hadFile=false;try{hadFile=useIdb?!!(await idbGet("hadfile")):!!localStorage.getItem(LS_HANDLE_HINT);}catch(e){}
    if(res&&hadFile)toast("Loaded from local backup");
  }
  await restoreHandle();
  await restoreImgDir();
}
