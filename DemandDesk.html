function depSnooze(e,x){const who=x.team||"the other team";
  const v=prompt(`Remind me about ${who} again in how many days?\n(or type a date, YYYY-MM-DD)`,"14");if(v===null)return;const t=v.trim();
  let until="";if(/^\d{4}-\d{2}-\d{2}$/.test(t))until=t;else if(/^\d+$/.test(t)&&+t>0){const d=new Date();d.setDate(d.getDate()+(+t));until=isoD(d);}
  if(!until||until<=todayStr()){toast("Give a number of days, or a future date",true);return;}
  x.snoozeUntil=until;touch(e);renderEpicDetail();toast("No follow-up nudges until "+until);}
function depDelivered(e,x){x.done=true;x.doneDate=todayStr();x.lastCheck=todayStr();touch(e);
  if(!e.deps.some(d=>!d.done))toast("Nothing left blocking this epic — time to move your transports?");
  renderEpicDetail();}
function renderEpicSubtasks(body,e){
  body.innerHTML=`<div class="sec-title"><h3>Epic-level subtasks</h3><div class="ln"></div><button class="sm" id="es-add">＋ Add subtask</button></div>
    <p class="faint" style="font-size:12px;margin:-4px 0 10px">Work that belongs to the initiative rather than any one demand — alignment calls, cut-over prep, the hand-over note, “raise the Wave 3 demand”.</p>
    <div class="tree" id="es-tree"></div>`;
  const rr=()=>renderEpicDetail();
  body.querySelector("#es-add").onclick=()=>{e.subtasks.push(mkSub());touch(e);rr();};
  renderTree(body.querySelector("#es-tree"),e,e.subtasks,rr);
}
/* ---------- epic brief: the whole initiative as one document ---------- */
function epicBriefData(e){const r=epicRollup(e);return{r,pk:epicParked(e,r),story:epicStory(e),waves:waveOrder(r.ts)};}
function buildEpicBriefHTML(e){
  const {r,pk,story,waves}=epicBriefData(e);
  const subs=list=>list.length?`<ul>${list.map(s=>`<li>${s.done?"✓ ":"☐ "}${esc(s.title)}${s.dueDate?` <i>(due ${s.dueDate})</i>`:""}${subs(s.children)}</li>`).join("")}</ul>`:"";
  return `<h1>◆ ${esc(epicLabel(e))}</h1>
    <p><b>Status:</b> ${EPIC_STATUS[e.status].label} · <b>My role:</b> ${e.role==="contributor"?"Contributor (one slice)":"Lead"}${e.owner?` · <b>Owner:</b> ${esc(e.owner)}`:""}${e.targetDate?` · <b>Target:</b> ${e.targetDate}`:""}${story.length?` · <b>Running since:</b> ${story[0].date}`:""}</p>
    ${pk?`<p><b>${pk.parked?"⏸ Parked":"⏳ Waiting"}:</b> ${pk.open} open dependency(ies)${pk.days!=null?`, oldest ${pk.days} day(s)`:""}.</p>`:""}
    ${e.description?`<h3>Description</h3><p style="white-space:pre-wrap">${esc(e.description)}</p>`:""}
    ${e.myScope?`<h3>${e.role==="contributor"?"My part":"Scope / approach"}</h3><p style="white-space:pre-wrap">${esc(e.myScope)}</p>`:""}
    <h3>Demands (${r.ts.length} · ${r.done} done)</h3>
    ${r.ts.length?waves.map(w=>`${waves.length>1||w?`<h4>${w?esc(w):"No wave"}${waveTarget(e,w)?` — target ${waveTarget(e,w)}`:""}</h4>`:""}<table><tr><th>Demand</th><th>Title</th><th>System</th><th>Status</th><th>Received</th><th>Transports</th></tr>${r.ts.filter(t=>(t.wave||"")===w).sort((a,b)=>(a.receivedDate||"").localeCompare(b.receivedDate||"")).map(t=>`<tr><td>${esc(t.demandId||"—")}</td><td>${esc(t.title)}</td><td>${esc(t.system)||"—"}${t.client?" / "+esc(t.client):""}</td><td>${STATUS[t.status].label}</td><td>${t.receivedDate||"—"}</td><td>${t.transports.map(tr=>esc(tr.number||"(TR)")).join(", ")||"—"}</td></tr>`).join("")}</table>`).join(""):"<p><i>none</i></p>"}
    ${e.deps.length?`<h3>Dependencies on other teams</h3><table><tr><th>Team</th><th>What</th><th>Since</th><th>Expected</th><th>State</th></tr>${e.deps.map(x=>`<tr><td>${esc(x.team)}</td><td>${esc(x.what)}</td><td>${x.since||"—"}</td><td>${x.expected||"—"}</td><td>${x.done?"✓ delivered "+x.doneDate:(x.lastCheck?"open · last chased "+x.lastCheck:"open")}</td></tr>`).join("")}</table>`:""}
    <h3>Go-live readiness</h3><p>${!r.trs.length?"No transports recorded.":!r.pending.length?"✓ Every transport has reached its go-live target.":r.pending.map(x=>`${esc(x.t.demandId||x.t.title)} — ${x.g.missing.length} TR(s) not yet in ${x.g.target}`).join("<br>")}</p>
    ${e.subtasks.length?`<h3>Epic subtasks</h3>${subs(e.subtasks)}`:""}
    ${r.objects.length?`<h3>Objects touched</h3><table><tr><th>Object</th><th>Type</th><th>Action</th><th>Demand</th></tr>${r.objects.map(({o,t})=>`<tr><td>${esc(o.name)}</td><td>${esc(o.type)}</td><td>${esc(o.action)}</td><td>${esc(t.demandId||t.title)}</td></tr>`).join("")}</table>`:""}
    <h3>Story</h3>${story.length?`<table><tr><th style="width:95px">Date</th><th>Event</th></tr>${story.map(x=>`<tr><td>${esc(x.date)}</td><td>${x.icon} ${x.src==="log"?`<b>${EPIC_LOG[x.kind].label}:</b> `:""}${esc(x.text)}</td></tr>`).join("")}</table>`:"<p><i>nothing recorded</i></p>"}
    ${e.notes?`<h3>Notes</h3><p style="white-space:pre-wrap">${esc(e.notes)}</p>`:""}
    <p style="color:#888;font-size:11px">Generated by Demand Desk on ${todayStr()}</p>`;
}
function buildEpicBriefMarkdown(e){
  const {r,pk,story,waves}=epicBriefData(e),L=[];
  const subs=(list,d)=>list.forEach(s=>{L.push(`${"  ".repeat(d)}- [${s.done?"x":" "}] ${s.title}${s.dueDate?` (due ${s.dueDate})`:""}`);subs(s.children,d+1);});
  L.push(`# ◆ ${epicLabel(e)}`,``,`**Status:** ${EPIC_STATUS[e.status].label} · **My role:** ${e.role==="contributor"?"Contributor (one slice)":"Lead"}${e.owner?` · **Owner:** ${e.owner}`:""}${e.targetDate?` · **Target:** ${e.targetDate}`:""}${story.length?` · **Running since:** ${story[0].date}`:""}`,``);
  if(pk)L.push(`**${pk.parked?"⏸ Parked":"⏳ Waiting"}:** ${pk.open} open dependency(ies)${pk.days!=null?`, oldest ${pk.days} day(s)`:""}.`,``);
  if(e.description)L.push(`## Description`,e.description,``);
  if(e.myScope)L.push(`## ${e.role==="contributor"?"My part":"Scope / approach"}`,e.myScope,``);
  L.push(`## Demands (${r.ts.length} · ${r.done} done)`);
  waves.forEach(w=>{if(waves.length>1||w)L.push(``,`### ${w||"No wave"}${waveTarget(e,w)?` — target ${waveTarget(e,w)}`:""}`);
    L.push(`| Demand | Title | System | Status | Received | Transports |`,`|---|---|---|---|---|---|`);
    r.ts.filter(t=>(t.wave||"")===w).sort((a,b)=>(a.receivedDate||"").localeCompare(b.receivedDate||"")).forEach(t=>L.push(`| ${t.demandId||"—"} | ${t.title} | ${t.system||"—"}${t.client?" / "+t.client:""} | ${STATUS[t.status].label} | ${t.receivedDate||"—"} | ${t.transports.map(tr=>tr.number||"(TR)").join(", ")||"—"} |`));});
  L.push(``);
  if(e.deps.length){L.push(`## Dependencies on other teams`,`| Team | What | Since | Expected | State |`,`|---|---|---|---|---|`);
    e.deps.forEach(x=>L.push(`| ${x.team} | ${x.what} | ${x.since||"—"} | ${x.expected||"—"} | ${x.done?"delivered "+x.doneDate:(x.lastCheck?"open · last chased "+x.lastCheck:"open")} |`));L.push(``);}
  L.push(`## Go-live readiness`,!r.trs.length?"No transports recorded.":!r.pending.length?"✓ Every transport has reached its go-live target.":r.pending.map(x=>`- ${x.t.demandId||x.t.title} — ${x.g.missing.length} TR(s) not yet in ${x.g.target}`).join("\n"),``);
  if(e.subtasks.length){L.push(`## Epic subtasks`);subs(e.subtasks,0);L.push(``);}
  L.push(`## Story`);
  if(story.length)story.forEach(x=>L.push(`- **${x.date}** ${x.icon} ${x.src==="log"?EPIC_LOG[x.kind].label+": ":""}${x.text}`));else L.push("_nothing recorded_");
  if(e.notes)L.push(``,`## Notes`,e.notes);
  return L.join("\n");
}
function openEpicBrief(e){
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:820px"><h2>📄 Epic brief — ${esc(epicLabel(e))}</h2>
    <p class="faint" style="font-size:12px;margin-top:-8px">The whole initiative in one document: scope, demands by wave, who you're waiting on, and the full story.</p>
    <div class="specpaper specdoc">${buildEpicBriefHTML(e)}</div>
    <div class="modal-foot"><button id="eb-copy">📋 Copy Markdown</button><button id="eb-md">⬇ Download .md</button><button id="eb-print">🖨 Print / Save PDF</button><button id="eb-close" class="primary">Close</button></div></div></div>`;
  const close=()=>root.innerHTML="";
  root.querySelector("#eb-close").onclick=close;
  root.querySelector(".modal-bg").onclick=ev=>{if(ev.target===root.querySelector(".modal-bg"))close();};
  root.querySelector("#eb-copy").onclick=()=>{navigator.clipboard.writeText(buildEpicBriefMarkdown(e)).then(()=>toast("Markdown copied to clipboard")).catch(()=>toast("Copy failed",true));};
  root.querySelector("#eb-md").onclick=()=>{const b=new Blob([buildEpicBriefMarkdown(e)],{type:"text/markdown"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="epic-"+(e.code||e.name).replace(/[^\w.-]+/g,"_")+"-"+todayStr()+".md";a.click();URL.revokeObjectURL(a.href);};
  root.querySelector("#eb-print").onclick=()=>{const pa=document.getElementById("printArea");pa.className="specdoc";pa.innerHTML=buildEpicBriefHTML(e);window.print();};
}

        <select id="pFk"><option value="">All kinds</option>${Object.entries(PLAY_KINDS).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join("")}</select>

      </div>
      <p class="faint" style="font-size:11px;margin:0">Tribal knowledge, kept findable: how-tos, FAQs, freeze windows, recurring obligations, who-to-contact lists. 📌 pins float to the top; everything is in Ctrl+K search.</p>
    </div>

  rows.sort((a,b)=>(b.pinned-a.pinned)||b.updatedAt-a.updatedAt);

function renderPlayKind(body,p){
  if(p.kind==="process"){
    body.innerHTML=`<div class="sec-title"><h3>Steps</h3><div class="ln"></div><button class="sm" id="st-add">＋ Add step</button></div><div id="st-list"></div>`;
    body.querySelector("#st-add").onclick=()=>{p.steps.push({id:uid(),text:""});touch(p);renderPlayKind(body,p);renderPlaybookSidebar();};
    const host=body.querySelector("#st-list");
    if(!p.steps.length){host.innerHTML=`<div class="faint" style="font-size:12px;padding:4px 2px">No steps yet — use “＋ Add step”.</div>`;return;}
    host.innerHTML="";
    p.steps.forEach((s,i)=>{const row=document.createElement("div");row.className="actitem";
      row.innerHTML=`<span class="mono" style="flex:0 0 26px;color:var(--accent);font-weight:700;text-align:right">${i+1}.</span>

      row.querySelector(".s-up").onclick=()=>{[p.steps[i-1],p.steps[i]]=[p.steps[i],p.steps[i-1]];touch(p);renderPlayKind(body,p);};
      row.querySelector(".s-dn").onclick=()=>{[p.steps[i+1],p.steps[i]]=[p.steps[i],p.steps[i+1]];touch(p);renderPlayKind(body,p);};

        ${p.lastDone?`<span class="faint" style="font-size:11px">last done ${fmtTs(p.lastDone)}</span>`:""}

let imagesDir=null, imgDirSaved=null, imgUrlCache={};

async function restoreImgDir(){

  try{const h=await idbGet("imgdir");if(!h)return;imgDirSaved=h;

async function ensureImgDir(interactive){
  if(imagesDir)return imagesDir;

    let p=await imgDirSaved.queryPermission({mode:"readwrite"});
    if(p!=="granted"&&interactive&&imgDirSaved.requestPermission)p=await imgDirSaved.requestPermission({mode:"readwrite"});
    if(p==="granted"){imagesDir=imgDirSaved;return imagesDir;}
  }catch(e){}}
  if(interactive&&window.showDirectoryPicker){
    try{imagesDir=await showDirectoryPicker({mode:"readwrite"});imgDirSaved=imagesDir;

  try{const fh=await imagesDir.getFileHandle(im.file);const f=await fh.getFile();const u=URL.createObjectURL(f);imgUrlCache[im.file]=u;return u;}

function defaultImgExpiry(){const d=state.settings.imageExpiryDays;return d?dstr(new Date(Date.now()+d*86400000)):"";}
async function saveImageBlob(blob,kind,id){
  const dir=await ensureImgDir(true);
  if(!dir){toast("Connect an images folder first (⋯ menu → Images)",true);return null;}
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const base=`dd-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  let name=base+".png";
  try{
    /* two pastes inside the same second must not overwrite each other's file */
    for(let n=2;;n++){try{await dir.getFileHandle(name);}catch(e){break;}name=`${base}-${n}.png`;}
    const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();
    const im=normImage({file:name,label:"",expiry:defaultImgExpiry(),links:kind?[{kind,id}]:[]});

/* ===================== OBJECT CLASHES ===================== */
/* The same object changed in two demands at once is how transports overwrite each
   other in QA or Prod. An object is "in flight" from the moment it's logged until the
   transports carrying it reach that demand's go-live system. Objects only Analyzed,
   and closed demands, never count. */
const objKey=n=>String(n||"").trim().toUpperCase();
function objectInFlight(t,o){
  if(!objKey(o.name)||o.action==="Analyzed"||t.status==="closed")return false;
  const trs=trsForObject(t,o.id);
  if(trs.length)return trs.some(tr=>trTargets(t,tr).length?!trComplete(t,tr):t.status!=="delivered");
  if(t.status!=="delivered")return true;
  return !!golivePending(t); /* delivered, object not ticked on a TR: trust the demand's own go-live check */
}
/* object name → every in-flight use, kept only where 2+ different demands share it */
function clashIndex(){const m=new Map();
  state.tasks.forEach(t=>t.objects.forEach(o=>{if(!objectInFlight(t,o))return;const k=objKey(o.name);
    if(!m.has(k))m.set(k,[]);m.get(k).push({t,o});}));
  [...m.keys()].forEach(k=>{if(new Set(m.get(k).map(x=>x.t.id)).size<2)m.delete(k);});
  return m;}
/* the other demands where this object is also in flight; ack = "sequenced, stop warning" */
function clashesFor(t,o,idx){if(!objectInFlight(t,o))return [];
  const v=(idx||clashIndex()).get(objKey(o.name));if(!v)return [];
  const seen=new Set();
  return v.filter(x=>x.t.id!==t.id&&!seen.has(x.t.id)&&seen.add(x.t.id))
    .map(x=>({t:x.t,o:x.o,ack:(o.ackClash||[]).includes(x.t.id)}));}
function taskClashes(t,idx){idx=idx||clashIndex();const out=[];
  t.objects.forEach(o=>{const c=clashesFor(t,o,idx);if(c.length)out.push({o,others:c,open:c.filter(x=>!x.ack)});});return out;}
function openClashCount(t,idx){return taskClashes(t,idx).filter(x=>x.open.length).length;}
/* acknowledging is mutual — both demands stop warning about each other for that object */
function setClashAck(t,o,other,on){const k=objKey(o.name);
  const flip=(obj,id)=>{obj.ackClash=obj.ackClash||[];
    if(on){if(!obj.ackClash.includes(id))obj.ackClash.push(id);}else obj.ackClash=obj.ackClash.filter(x=>x!==id);};
  t.objects.filter(x=>objKey(x.name)===k).forEach(x=>flip(x,other.id));
  other.objects.filter(x=>objKey(x.name)===k).forEach(x=>flip(x,t.id));
  other.updatedAt=Date.now();touch(t);}
/* where the other demand's copy of the object stands, e.g. "In progress · H03K900812 at H02" */
function clashWhere(x){const trs=trsForObject(x.t,x.o.id);
  return STATUS[x.t.status].label+(trs.length
    ?" · "+trs.map(tr=>{const r=[...reachedSystems(x.t,tr)];return (tr.number||"(TR)")+(r.length?" at "+r.join("/"):" not moved yet");}).join(", ")
    :" · not on a transport yet");}
function trClashHtml(t,tr,idx){const out=[];
  (tr.objectIds||[]).forEach(id=>{const o=t.objects.find(x=>x.id===id);if(!o)return;
    clashesFor(t,o,idx).filter(x=>!x.ack).forEach(x=>out.push(`⚠ Carries <b class="mono">${esc(o.name)}</b>, also in flight in <b>${esc(x.t.demandId||x.t.title)}</b> (${esc(clashWhere(x))}) — agree the import order.`));});
  return out.map(x=>`<div class="clash">${x}</div>`).join("");}

   Today, so it can be parked without being forgotten. */

  logTimeline(t,"note","","",`Next action done${n.note?": "+n.note:""}`);

/* ===================== TRANSPORT RUN SHEET ===================== */
/* What Basis has to import into one system, in release order. A ToC stands in for the
   TRs bundled in it (imported once, where its first member sits in the order), customizing
   TRs name their client, and whatever already reached the target is left off the request.
   Only TRs routed through the target's landscape count — an H1x TR never goes to H01. */
function runSheetData(tasks,target,showDone){
  const rows=[];let other=0;
  if(target){const L=landscapeOf(target);
    tasks.forEach(t=>{const tocSeen=new Set();
      t.transports.forEach(tr=>{
        /* a transport with its own destinations only belongs on a sheet for one of them */
        const own=trDest(t,tr);
        if(own.length?!own.includes(target):(landscapeOf(tr.system)!==L&&!effectiveSyncs(t,tr).some(s=>landscapeOf(s.system)===L))){other++;return;}
        const toc=tocFor(t,tr);
        if(toc){if(tocSeen.has(toc.id))return;tocSeen.add(toc.id);
          const members=t.transports.filter(x=>x.tocId===toc.id),hit=toc.syncs.find(s=>s.system===target);
          rows.push({t,toc,members,number:toc.number||"(unnumbered ToC)",desc:toc.desc,type:"ToC",client:"",released:true,
            done:!!hit||members.every(m=>reachedSystems(t,m).has(target)),doneDate:hit?hit.date:"",objIds:members.flatMap(m=>m.objectIds||[])});}
        else{const hit=effectiveSyncs(t,tr).find(s=>s.system===target);

    t.objects.forEach(o=>{if([o.name,o.type,o.desc].join(" ").toLowerCase().includes(q))hits.push({k:"Object",go:()=>{view="demands";activeId=t.id;activeTab="objects";},label:`${o.name||"(obj)"} — ${o.action} · ${t.demandId||t.title}`});});
    t.transports.forEach(tr=>{
      const toc=tocFor(t,tr);
      const sysStr=effectiveSyncs(t,tr).map(s=>s.system).join(" ")+" "+tr.system+" "+(toc?toc.number:"")+" "+(tr.dest||[]).join(" ");
      if([tr.number,tr.desc,tr.notes,sysStr,tr.client,isCust(tr)?"customizing cust config":"workbench"].join(" ").toLowerCase().includes(q))hits.push({k:"Transport",go:()=>{view="demands";activeId=t.id;activeTab="transports";},label:`${tr.number||"(TR)"} ${tr.desc?"— "+tr.desc:""} · orig ${tr.system}${isCust(tr)&&tr.client?"/"+tr.client:""}${effectiveSyncs(t,tr).length?" → "+[...reachedSystems(t,tr)].join(", "):""}${toc?" · ToC "+toc.number:""} · ${t.demandId||t.title}`});
    });
    (t.tocs||[]).forEach(c=>{if([c.number,c.desc,c.notes,c.syncs.map(s=>s.system).join(" ")].join(" ").toLowerCase().includes(q))hits.push({k:"ToC",go:()=>{view="demands";activeId=t.id;activeTab="transports";},label:`ToC ${c.number||"(unnamed)"}${c.syncs.filter(s=>s.system).length?" → "+c.syncs.filter(s=>s.system).map(s=>s.system).join(", "):""} · ${t.demandId||t.title}`});});
    (function w(a){a.forEach(s=>{if(((s.title||"")+" "+(s.comments||[]).map(c=>c.text).join(" ")).toLowerCase().includes(q))hits.push({k:"Subtask",go:()=>{view="demands";activeId=t.id;activeTab="work";},label:`${s.title} · ${t.demandId||t.title}`});w(s.children);});})(t.subtasks);
    (t.reference||[]).forEach(r=>{const blob=(r.label+" "+(r.secret?"":r.value)).toLowerCase();if(blob.includes(q))hits.push({k:"Reference",go:()=>{view="demands";activeId=t.id;activeTab="reference";},label:`${r.label||"(ref)"}${r.secret?" 🔒":(r.value?" — "+r.value:"")} · ${t.demandId||t.title}`});});
  });
  state.meetings.forEach(m=>{
    if([m.title,m.team,m.attendees,m.body,m.date].join(" ").toLowerCase().includes(q))hits.push({k:"Meeting",go:()=>{view="meetings";meetingRollup=false;activeMeetingId=m.id;},label:`${m.date}${m.team?" · "+m.team:""} · ${m.title}`});
    m.actions.forEach(a=>{if([a.text,a.owner,a.resolution].join(" ").toLowerCase().includes(q))hits.push({k:"Action",go:()=>{view="meetings";meetingRollup=false;activeMeetingId=m.id;},label:`${a.text} ${a.owner?"("+a.owner+")":""}${a.resolution?" ↳ "+a.resolution:""} · ${m.title}`});});
  });
  state.credentials.forEach(c=>{if([c.system,c.client,c.label,c.username,c.url,c.notes].join(" ").toLowerCase().includes(q))hits.push({k:"Vault",go:()=>{view="vault";},label:`${c.system||""}${c.client?"/"+c.client:""} ${c.label||""} · ${c.username||""}`.trim()});});
  state.journal.forEach(j=>{if([j.date,j.title,j.body].join(" ").toLowerCase().includes(q))hits.push({k:"Journal",go:()=>{view="journal";journalTodos=false;activeJournalId=j.id;},label:`${j.date}${j.title?" · "+j.title:""}`});});
  state.todos.forEach(x=>{if(((x.text||"")+" "+(x.resolution||"")).toLowerCase().includes(q))hits.push({k:"To-do",go:()=>{view="journal";journalTodos=true;},label:`${x.done?"✓ ":""}${x.text}${x.resolution?" ↳ "+x.resolution:""}${x.due?" · due "+x.due:""}`});});
  state.wins.forEach(w=>{if(w.text.toLowerCase().includes(q))hits.push({k:"Win",go:()=>{view="review";},label:`${WIN_KINDS[w.kind].icon} ${w.date} · ${w.text}`});});
  state.efforts.forEach(e=>{if(((e.note||"")+" "+e.activity).toLowerCase().includes(q)){const k=efKey(e);hits.push({k:"Effort",go:()=>{if(e.taskId&&efTaskOf(e.taskId)){view="demands";activeId=e.taskId;activeTab="effort";}else view="effort";setTimeout(()=>openEfDay(e.date,k),0);},label:`${e.date} · ${efFh(e.hours)} h · ${efName(k)} — ${e.note||e.activity}`});}});
  state.epics.forEach(e=>{
    if([e.name,e.code,e.description,e.owner,e.notes,e.myScope].join(" ").toLowerCase().includes(q))
      hits.push({k:"Epic",go:()=>{view="epics";activeEpicId=e.id;epicTab="overview";},label:`◆ ${epicLabel(e)} · ${tasksForEpic(e.id).length} demand(s)`});
    e.log.forEach(x=>{if((x.text||"").toLowerCase().includes(q))hits.push({k:"Epic story",go:()=>{view="epics";activeEpicId=e.id;epicTab="story";},label:`${x.date} ${EPIC_LOG[x.kind].icon} ${x.text} · ◆ ${e.code||e.name}`});});
    e.deps.forEach(x=>{if([x.team,x.what,x.note].join(" ").toLowerCase().includes(q))hits.push({k:"Waiting on",go:()=>{view="epics";activeEpicId=e.id;epicTab="deps";},label:`${x.done?"✓ ":"⏸ "}${x.team} — ${x.what} · ◆ ${e.code||e.name}`});});
    (function w(a){a.forEach(s=>{if((s.title||"").toLowerCase().includes(q))hits.push({k:"Subtask",go:()=>{view="epics";activeEpicId=e.id;epicTab="subtasks";},label:`${s.title} · ◆ ${e.code||e.name}`});w(s.children);});})(e.subtasks);});
  state.playbook.forEach(p=>{
    const blob=[p.title,p.category,p.body,p.steps.map(s=>s.text).join(" "),p.people.map(x=>x.name+" "+x.role+" "+x.contact).join(" "),(p.systems||[]).join(" ")].join(" ").toLowerCase();
    if(blob.includes(q))hits.push({k:"Playbook",go:()=>{view="playbook";activePlayId=p.id;},label:`${PLAY_KINDS[p.kind].icon} ${p.title}${p.category?" · "+p.category:""}`});});
  state.images.forEach(im=>{if((im.label+" "+im.file).toLowerCase().includes(q))hits.push({k:"Image",go:()=>gotoImage(im),label:`📷 ${im.label||im.file}${im.expiry?" · exp "+im.expiry:""}`});});
  state.debug.forEach(s=>{
    const blob=[s.title,s.demandId,s.resume,s.notes,s.objects.map(o=>o.name+" "+o.note).join(" "),s.breakpoints.map(b=>b.object+" "+b.condition+" "+b.note).join(" "),s.findings.map(f=>f.text).join(" "),s.watches.map(w=>w.name+" "+w.value+" "+w.where).join(" ")].join(" ").toLowerCase();
    if(blob.includes(q))hits.push({k:"Debug",go:()=>{view="debug";activeDebugId=s.id;},label:`${s.title}${s.demandId?" · "+s.demandId:""}`});});
  if(!hits.length){box.innerHTML=`<div class="gsr faint">No matches</div>`;box.classList.remove("hide");return;}
  box.innerHTML=hits.slice(0,50).map((h,i)=>`<div class="gsr" data-i="${i}"><span class="k">${h.k}</span>${esc(h.label)}</div>`).join("");
  box.classList.remove("hide");
  box.querySelectorAll(".gsr[data-i]").forEach(el=>el.onclick=()=>{hits[+el.dataset.i].go();box.classList.add("hide");document.getElementById("globalSearch").value="";renderApp();});
}

    <div class="modal-foot"><button id="s-close" class="primary">Close</button></div></div></div>`;

  root.querySelectorAll(".pickrow[data-i]").forEach(el=>el.onclick=async()=>{const s=arr[+el.dataset.i];

    catch(e){toast("Snapshot is unreadable: "+e.message,true);}});
}

/* ===================== BENCH LOOK: dots, motion, cockpit =====================
   The default look (Bench's Instrument aesthetic, Paper + Backlit). Everything that
   moves is drawn from the real data file — a dot is a real transport, a ring is a
   real share of demands — and all of it switches off with Settings → Motion: Off or
   Windows' "reduce animations". Classic themes don't render any of this. */
const DK=(()=>{
  const TAU=Math.PI*2,C={};let MONO="monospace",SANS="sans-serif";
  const KEYS=["paper","paper-2","ink","ink-2","ink-3","ink-4","rule","rule-strong","pen-1","pen-2","pen-3","pen-4","pen-5","pen-6","good","watch","bad"];
  const scopes=[];
  function readColors(){const cs=getComputedStyle(document.documentElement);KEYS.forEach(k=>C[k]=cs.getPropertyValue("--"+k).trim());
    MONO=cs.getPropertyValue("--mono").trim()||MONO;SANS=cs.getPropertyValue("--sans").trim()||SANS;scopes.forEach(s=>s.w=0);}
  function dot(ctx,x,y,r,col,a=1){ctx.globalAlpha=a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
  function ring(ctx,x,y,r,col,a=1,lw=1){ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();}
  /* gauge: a 240° arc of dots; radius and ink both carry the value */
  function dotArc(ctx,cx,cy,R,frac,n,col,lw=2.1){const a0=.78*Math.PI,sw=1.44*Math.PI,f=Math.max(0,Math.min(1,frac));
    for(let i=0;i<n;i++){const t=i/(n-1),a=a0+sw*t,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
      if(t<=f+1e-6&&f>0)dot(ctx,x,y,lw*(.75+.25*t/Math.max(f,.01)),col,.45+.55*t/Math.max(f,.01));else dot(ctx,x,y,1.15,C["ink-4"]);}
    const a=a0+sw*f;ctx.globalAlpha=.32;ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*(R-6),cy+Math.sin(a)*(R-6));ctx.stroke();
    dot(ctx,cx+Math.cos(a)*(R-6),cy+Math.sin(a)*(R-6),2.2,col);ring(ctx,cx+Math.cos(a)*(R-6),cy+Math.sin(a)*(R-6),5,col,.3);}
  /* proportion: dots round a circle, filled clockwise from 12 o'clock; unlit dots always drawn */
  function dotRing(ctx,cx,cy,R,frac,n,col,spin=0){for(let i=0;i<n;i++){const t=i/n,a=-Math.PI/2+t*TAU+spin,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
    if(t<frac)dot(ctx,x,y,1.6+.6*(t/frac),col,.5+.5*(t/frac));else dot(ctx,x,y,1.05,C["ink-4"]);}}
  function label(ctx,text,x,y,{font=SANS,size=9,weight=600,color=C["ink-3"],align="center",base="middle",spacing=0}={}){
    ctx.globalAlpha=1;ctx.fillStyle=color;ctx.font=`${weight} ${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline=base;
    if("letterSpacing" in ctx)ctx.letterSpacing=spacing+"px";ctx.fillText(text,x,y);if("letterSpacing" in ctx)ctx.letterSpacing="0px";}
  function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  /* one requestAnimationFrame loop for every canvas; a canvas that leaves the page drops out */
  function scope(cv,draw,opts={}){if(!cv)return null;const s={cv,draw,ctx:cv.getContext("2d"),w:0,h:0,keep:!!opts.keep,dead:false,born:performance.now(),data:opts.data};scopes.push(s);return s;}
  let last=performance.now();
  function frame(t){const dt=Math.min(64,t-last);last=t;const dpr=window.devicePixelRatio||1;
    for(let i=scopes.length-1;i>=0;i--){const s=scopes[i];
      if(s.dead||!s.cv.isConnected){scopes.splice(i,1);continue;}
      if(s.cv.offsetParent===null)continue;
      const w=s.cv.clientWidth,h=s.cv.clientHeight;if(!w||!h)continue;
      if(w!==s.w||h!==s.h){s.w=w;s.h=h;s.cv.width=Math.round(w*dpr);s.cv.height=Math.round(h*dpr);s.fresh=true;}
      s.ctx.setTransform(dpr,0,0,dpr,0,0);if(!s.keep)s.ctx.clearRect(0,0,w,h);s.ctx.globalAlpha=1;
      try{s.draw(s.ctx,w,h,t,dt,s);}catch(e){console.error(e);s.dead=true;}s.fresh=false;}
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
  return{TAU,C,readColors,dot,ring,dotArc,dotRing,label,rng,scope,get MONO(){return MONO;}};
})();
const benchOn=()=>document.documentElement.getAttribute("data-theme")==="bench";
/* Motion: Settings choice, or follow Windows' "reduce animations" */
const MOTION_KEY="demanddesk.motion",reducedMQ=matchMedia("(prefers-reduced-motion: reduce)");
function motionPref(){try{return localStorage.getItem(MOTION_KEY)||"auto";}catch(e){return "auto";}}
function motionOn(){const p=motionPref();return p==="full"||(p==="auto"&&!reducedMQ.matches);}
function applyMotion(){document.documentElement.classList.toggle("nomotion",!motionOn());}
reducedMQ.addEventListener("change",applyMotion);
const STATUS_PEN={open:"var(--accent)",progress:"var(--amber)",bug:"var(--red)",delivered:"var(--green)",closed:"var(--faint)"};
const STATUS_CK={open:"pen-2",progress:"pen-4",bug:"pen-1",delivered:"pen-3",closed:"ink-3"};
const p2=n=>String(n).padStart(2,"0");
const hashAngle=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return ((h>>>0)%3600)/3600*DK.TAU;};

/* a change travels to where it lands — e.g. a status change flies to the demand's card */
function flyDot(fromEl,toEl,color){if(!fromEl||!toEl||!benchOn()||!motionOn())return;
  const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();if(!a.width||!b.width)return;
  const f=document.createElement("div");
  f.style.cssText=`position:fixed;z-index:90;pointer-events:none;width:8px;height:8px;border-radius:50%;background:${color};left:${a.left+a.width/2-4}px;top:${a.top+a.height/2-4}px;transition:transform .7s cubic-bezier(.6,.05,.25,1),opacity .7s`;
  document.body.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${b.left+16-(a.left+a.width/2)}px,${b.top+b.height/2-(a.top+a.height/2)}px) scale(.6)`;}));
  setTimeout(()=>{f.style.opacity="0";},620);setTimeout(()=>f.remove(),820);}
/* content rises in when you arrive somewhere — never on ordinary edits */

  a.classList.remove("enter-all","enter-detail");void a.offsetWidth;a.classList.add(kind==="detail"?"enter-detail":"enter-all");
  clearTimeout(enterPulse._t);enterPulse._t=setTimeout(()=>a.classList.remove("enter-all","enter-detail"),1100);}

/* where a transport has actually reached, drawn as its route Dev → QA → Prod */
function trRouteDraw(t,tr){return (ctx,w,h,tm,dt,s)=>{const {dot,ring,label,C}=DK;
  /* the route this transport has to travel: its own destinations after the origin
     (H03 → H43 → H42 → H41), or by default Dev → QA → Prod of its own landscape */
  const own=trDest(t,tr),L=landscapeOf(tr.system);if(!L)return;
  const S=own.length?[tr.system,...own.filter(x=>x!==tr.system)]:routeTiers().map(d=>L+d);
  const R=reachedSystems(t,tr),has=x=>x===tr.system||R.has(x),T=new Set(trTargets(t,tr));
  const penOf=x=>({"3":C["pen-2"],"2":C["pen-4"],"1":C["pen-3"]})[String(x).slice(-1)]||C["pen-5"];
  let idx=0;S.forEach((x,i)=>{if(has(x))idx=i;});
  const n=S.length,xs=S.map((_,i)=>12+(w-24)*(i/Math.max(1,n-1))),y=11,mv=motionOn();
  const grow=mv?Math.min(1,(performance.now()-s.born)/700):1,g=1-Math.pow(1-grow,3);
  for(let x=xs[0];x<=xs[n-1];x+=5)dot(ctx,x,y,.7,C["ink-4"]);
  if(idx>0){ctx.globalAlpha=.6;ctx.strokeStyle=penOf(S[idx]);ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(xs[0],y);ctx.lineTo(xs[0]+(xs[idx]-xs[0])*g,y);ctx.stroke();}
  S.forEach((x,i)=>{const on=has(x),pen=penOf(x);
    if(on)dot(ctx,xs[i],y,3.1,pen);else ring(ctx,xs[i],y,2.7,C["ink-4"],1);
    if(T.has(x))ring(ctx,xs[i],y,6.5,on?pen:C["ink-3"],.55);
    label(ctx,x,xs[i],h-1,{font:DK.MONO,size:8,weight:on?600:400,color:on?C["ink-2"]:C["ink-3"],base:"bottom"});});
  const nx=S.findIndex((x,i)=>i>0&&!has(x));
  if(tr.released&&nx>0&&mv){const u=((tm*.00055+hashAngle(tr.id))%1),x=xs[nx-1]+(xs[nx]-xs[nx-1])*u;dot(ctx,x,y,1.8,penOf(S[nx]),.85*Math.sin(u*Math.PI));}
  if(!tr.released)ring(ctx,xs[0],y,6+(mv?Math.sin(tm*.005)*1.5:0),C.watch,.65);};}
/* two demands, one object: two dots circling the same point */
function drawOrbit(ctx,w,h,t){const {dot,ring,C}=DK,cx=w/2,cy=h/2,tt=motionOn()?t*.0024:0;ring(ctx,cx,cy,5,C.bad,.9);dot(ctx,cx,cy,1.6,C.bad);
  const r=9+Math.sin(tt*.7)*2.5;[0,Math.PI].forEach((o,i)=>{const a=tt+o;dot(ctx,cx+Math.cos(a)*r*1.9,cy+Math.sin(a)*r*.9,2.3,i?C["pen-4"]:C["pen-2"]);});}

/* status bar: which file, whether it's saved, and when auto-save will write */
function updateSb(){if(!benchOn())return;const f=document.getElementById("sbFile"),a=document.getElementById("sbAuto"),c=document.getElementById("sbCount"),r=document.getElementById("sbRight");if(!f)return;
  f.textContent=fileHandle?fileHandle.name:(savedHandle?"file not linked — 🔌 Reconnect in the title bar":"no data file yet — 💾 Save to choose one");f.className=fileHandle?"":"warn";

/* ---------- Today cockpit ---------- */
/* every transport of a demand that isn't closed, parked at the furthest tier it reached in its own landscape */
function pipelineData(){
  /* each transport sits in the lane of every landscape it's meant to reach (its origin
     landscape by default), at the furthest tier it has got to there; one that hasn't
     arrived in a destination landscape yet waits at the lane's entrance */
  const tiers=routeTiers(),lanes=new Map();
  state.tasks.forEach(t=>{if(t.status==="closed")return;
    t.transports.forEach(tr=>{if(!tr.system)return;const R=reachedSystems(t,tr),own=trDest(t,tr),T=trTargets(t,tr),home=landscapeOf(tr.system);
      const done=!!(T.length&&trComplete(t,tr)),Ls=own.length?[...new Set(own.map(landscapeOf))]:[home];
      Ls.forEach(L=>{const ds=[...(L===home?[tr.system]:[]),...R].filter(x=>landscapeOf(x)===L).map(x=>String(x).slice(-1)).filter(d=>tiers.includes(d));
        if(!lanes.has(L))lanes.set(L,[]);
        lanes.get(L).push({t,tr,si:ds.length?tiers.indexOf(ds.sort()[0]):-1,rel:!!tr.released,target:T.join("/"),done,from:L===home?"":tr.system});});});});
  const out=[...lanes.entries()].map(([L,items])=>({L,items})).sort((a,b)=>b.items.length-a.items.length).slice(0,4).sort((a,b)=>a.L.localeCompare(b.L));
  return{tiers,lanes:out};}
function cockpitCounts(){const T=state.tasks,today=todayStr();
  const pipe=pipelineData();
  return{active:T.filter(t=>["open","progress","bug"].includes(t.status)),
    over:T.filter(t=>{const d=earliestOpenDue(t);return d&&d<today;}),
    waiting:T.filter(isWaiting).sort((a,b)=>(waitDays(b)||0)-(waitDays(a)||0)),
    clash:clashIndex().size,pipe,short:new Set(pipe.lanes.flatMap(l=>l.items.filter(x=>x.target&&!x.done).map(x=>x.tr.id))).size,
    unrel:new Set(pipe.lanes.flatMap(l=>l.items.filter(x=>!x.rel).map(x=>x.tr.id))).size,total:new Set(pipe.lanes.flatMap(l=>l.items.map(x=>x.tr.id))).size};}

function mountCockpit(host){const {dot,ring,dotArc,dotRing,label,C,scope,rng,TAU}=DK;

  const mv=motionOn(),today=todayStr();
  /* hero: a flow field, one stream colour per status, denser where more demands sit */
  {const N=mv?520:0,P=[],r=rng(7);
    const ws=(()=>{const k={open:0,progress:0,bug:0,delivered:0};state.tasks.forEach(t=>{if(k[t.status]!=null)k[t.status]++;});
      const a=Object.entries(k).map(([s,n])=>[STATUS_CK[s],1+n*2]),sum=a.reduce((x,y)=>x+y[1],0);return a.map(([p,n])=>[p,n/sum]);})();
    const spawn=(p,w,h)=>{p.x=r()*w;p.y=r()*h;p.life=60+r()*160;let u=r(),acc=0;p.pen=ws[0][0];for(const [pen,wt] of ws){acc+=wt;if(u<=acc){p.pen=pen;break;}}};

      ctx.globalAlpha=.07;ctx.fillStyle=C.paper;ctx.fillRect(0,0,w,h);ctx.lineWidth=1;const tt=t*.00006;

        const nx=p.x+Math.cos(a)*sp*dt*.108,ny=p.y+Math.sin(a)*sp*dt*.06;ctx.globalAlpha=.3;ctx.strokeStyle=C[p.pen]||C["ink-3"];

      ctx.globalAlpha=.35;ctx.fillStyle=C.paper;ctx.fillRect(0,0,Math.min(w*.46,620),h);},{keep:true});}

/* ---------- theme + motion ----------
   A per-viewer preference (localStorage, never the data file), so it also applies on
   the lock screen. Two families: Bench (the default — Paper / Backlit, or follow
   Windows) and the three classic themes. The title-bar button flips light ↔ dark inside
   the chosen family; Settings (⋯) picks any theme and the motion level. */
const THEME_KEY="demanddesk.theme";
const THEME_OPTS={"bench":"Bench · follow Windows","bench-paper":"Bench · Paper","bench-backlit":"Bench · Backlit","dark":"Classic dark","light":"Classic light","instrument":"Instrument White"};
try{if(!localStorage.getItem("demanddesk.themeV2")){localStorage.setItem("demanddesk.themeV2","1");localStorage.setItem(THEME_KEY,"bench");}}catch(e){}
function currentTheme(){try{const t=localStorage.getItem(THEME_KEY);return THEME_OPTS[t]?t:"bench";}catch(e){return "bench";}}
const darkMQ=matchMedia("(prefers-color-scheme: dark)");
function applyTheme(t){t=t||currentTheme();const el=document.documentElement;
  if(t.startsWith("bench")){el.setAttribute("data-theme","bench");el.setAttribute("data-mode",t==="bench-backlit"||(t==="bench"&&darkMQ.matches)?"dark":"light");}
  else{el.setAttribute("data-theme",t);el.removeAttribute("data-mode");}
  /* Chromium doesn't reliably repaint persistent chrome when :root variables change;
     detaching and reattaching the root forces every element to re-resolve them */
  el.style.display="none";void el.offsetHeight;el.style.display="";
  DK.readColors();applyMotion();
  const b=document.getElementById("btnTheme");
  if(b){const dark=t.startsWith("bench")?el.getAttribute("data-mode")==="dark":t==="dark";
    b.textContent=dark?"☀":"🌙";b.title=(dark?"Switch to light":"Switch to dark")+" · every theme is in ⋯ Settings";}}
function setTheme(t){try{localStorage.setItem(THEME_KEY,t);}catch(e){}applyTheme(t);lastTind=null;renderApp();}
function toggleTheme(){const t=currentTheme();let nx;
  if(t.startsWith("bench"))nx=document.documentElement.getAttribute("data-mode")==="dark"?"bench-paper":"bench-backlit";
  else nx=t==="dark"?"light":"dark";
  setTheme(nx);toast("Theme: "+THEME_OPTS[nx]);}
darkMQ.addEventListener("change",()=>{if(currentTheme()==="bench"){applyTheme("bench");renderApp();}});

/* ===================== BENCH LAYOUTS: pages, panels, story =====================
   Bench gives the Demand and Epic pages their own header (ID line, title, readouts,
   status control, bands) and the Epic overview its story-first layout. Every other
   view keeps its renderer: Bench frames each titled section as a panel on the live
   page (wrapSections), so all editing code stays exactly the same in every theme. */
const U=(v,u)=>`${v}<small>${u}</small>`;
/* "03 Jul" this year, "03 Jul 25" otherwise — readouts stay short enough not to clip */
const shortD=s=>{if(!s)return "—";const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-GB",d.getFullYear()===new Date().getFullYear()?{day:"2-digit",month:"short"}:{day:"2-digit",month:"short",year:"2-digit"});};
function roHTML(items){return `<div class="bro">${items.filter(Boolean).map(x=>`<div class="bro-i ${x.cls||""}"${x.title?` title="${esc(x.title)}"`:""}><span class="k">${x.k}</span><span class="v">${x.v}</span></div>`).join("")}</div>`;}
function dotBarSVG(frac,n=12,pen="var(--ink)"){let s=`<svg class="dbar" width="${n*5}" height="6" aria-hidden="true">`;const lit=Math.round(Math.max(0,Math.min(1,frac||0))*n);
  for(let i=0;i<n;i++)s+=i<lit?`<circle cx="${i*5+2.5}" cy="3" r="2" style="fill:${pen}"/>`:`<circle cx="${i*5+2.5}" cy="3" r="1.1" style="fill:var(--ink-4)"/>`;return s+"</svg>";}
/* a clock face of dots filling toward the next action */
function drawTick(ctx,w,h,t){const {dot,C,TAU}=DK,cx=w/2,cy=h/2,R=Math.min(w,h)/2-3,sec=motionOn()?((t/1000)%60)/60:.25;
  for(let i=0;i<24;i++){const a=-Math.PI/2+i/24*TAU,on=i/24<=sec;dot(ctx,cx+Math.cos(a)*R,cy+Math.sin(a)*R,on?1.5:.9,on?C.watch:C["ink-4"]);}
  const a=-Math.PI/2+sec*TAU;ctx.globalAlpha=.7;ctx.strokeStyle=C.watch;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*(R-4),cy+Math.sin(a)*(R-4));ctx.stroke();dot(ctx,cx,cy,1.5,C.watch);}

/* ---------- panels: frame each titled section, on the live page ---------- */
function wrapSections(root){if(!root||!benchOn())return;
  root.querySelectorAll(".sec-title").forEach(h=>{const p=h.parentElement;
    if(!p||h.closest(".bsec,.modal,.trcard,.ck-unit,.dashcard,.resume-box,.pinbox"))return;
    const box=document.createElement("div");box.className="bsec";p.insertBefore(box,h);
    /* a section runs to the next heading — or to a block that carries its own heading (it becomes its own panel) */
    let n=h;while(n){const next=n.nextElementSibling;box.appendChild(n);n=next;if(n&&(n.classList.contains("sec-title")||n.querySelector(".sec-title")))break;}});}
{const detail=document.getElementById("detail");let queued=false;
  const obs=new MutationObserver(()=>{if(queued)return;queued=true;
    queueMicrotask(()=>{obs.disconnect();try{wrapSections(detail);}finally{queued=false;obs.observe(detail,{childList:true,subtree:true});}});});
  obs.observe(detail,{childList:true,subtree:true});}

const TIER_S={"3":"DEV","2":"QA","1":"PRD"};

  if(d==null)return t.status==="delivered"?"delivered":t.status==="closed"?"closed":"no due date";
  return d<0?`<span class="late">${-d} d late</span>`:d===0?`<span class="soon">due today</span>`:d<=7?`<span class="soon">in ${d} d</span>`:"due "+shortD(t.dueDate);}

function trStripSVG(t){if(!t.transports.length)return "";let s=`<svg width="${t.transports.length*9}" height="9" aria-hidden="true">`;

      :moved?`<circle cx="${x}" cy="4.5" r="3" style="fill:none;stroke:var(--watch)"/><path d="M${x} 1.5 A3 3 0 0 1 ${x} 7.5Z" style="fill:var(--watch)"/>`

/* ---------- Overview: the journey, the two notes, four instruments, the latest ---------- */
function avgLeadDays(){const L=[];state.tasks.forEach(t=>{const f=(t.timeline||[]).filter(e=>e.type==="status"&&e.to==="delivered").map(e=>e.ts).sort((a,b)=>a-b)[0];
  if(f&&t.receivedDate){const d=Math.floor((f-new Date(t.receivedDate+"T00:00:00").getTime())/864e5);if(d>=0)L.push(d);}});return L.length?Math.round(L.reduce((a,b)=>a+b,0)/L.length):null;}
function statusHistory(t){const h=(t.timeline||[]).filter(e=>e.type==="status").map(e=>({d:isoTs(e.ts),s:e.to})).sort((a,b)=>a.d.localeCompare(b.d));
  const start=t.receivedDate||(h[0]&&h[0].d)||isoTs(t.createdAt);
  if(!h.length||h[0].d>start)h.unshift({d:start,s:h.length?"open":t.status});return h;}
function renderOverview(body,t){
  const avg=avgLeadDays(),hs=statusHistory(t),loops=hs.filter(h=>h.s==="bug").length,fin=journeyFinish(t,hs);
  const sd=countSubs(t.subtasks),nComp=t.transports.filter(tr=>trComplete(t,tr)).length,clashN=openClashCount(t);
  /* a finished demand's age stops at its finish ("took N days"), a live one keeps counting */
  const endMs=fin?new Date(fin+"T00:00:00").getTime():Date.now(),age=Math.max(0,Math.floor((endMs-(t.receivedDate?new Date(t.receivedDate+"T00:00:00").getTime():t.createdAt))/864e5));
  const overdueSubs=(function c(a){return a.reduce((n,s)=>n+(!s.done&&s.dueDate&&s.dueDate<todayStr()?1:0)+c(s.children),0);})(t.subtasks);
  const feed=[...(t.timeline||[]).map(e=>e.type==="status"?{ts:e.ts,pen:STATUS_PEN[e.to]||"var(--faint)",h:`<b>${STATUS[e.to]?STATUS[e.to].label:esc(e.to)}</b>${e.from?` <span class="dim">from ${STATUS[e.from]?STATUS[e.from].label:esc(e.from)}</span>`:" <span class='dim'>— created</span>"}`}:{ts:e.ts,pen:"var(--accent2)",h:esc(e.note)}),
    ...(t.comments||[]).map(c=>({ts:c.ts,pen:"var(--ink-3)",h:linkify(c.text)})),
    ...t.transports.flatMap(tr=>tr.syncs.filter(s=>s.system&&s.date).map(s=>({ts:new Date(s.date+"T12:00:00").getTime(),pen:"var(--good)",h:`<b class="mono">${esc(tr.number||"(TR)")}</b> reached ${esc(s.system)}`})))]
    .sort((a,b)=>b.ts-a.ts).slice(0,7);
  body.innerHTML=`
    <div class="bsec jr"><div class="sec-title"><h3>Journey</h3><div class="ln"></div><span class="faint mono" style="font-size:10.5px">received ${t.receivedDate||"—"} · ${fin?`took ${age} days · finished ${fin}`:`${age} days`}${loops?` · ${loops} rework loop${loops>1?"s":""}`:""}</span></div><canvas class="jcv"></canvas></div>
    <div class="grid2">
      <div class="field"><label>What is to be done</label><textarea id="fDesc" placeholder="Scope, requirement summary, acceptance criteria…">${esc(t.description)}</textarea></div>
      <div class="field"><label>Where it stands · working notes</label><textarea id="fNotes" placeholder="Running notes, blockers, who asked, decisions…">${esc(t.notes)}</textarea></div></div>
    <div id="n-links" style="margin:-4px 0 12px">${linkChips((t.description||"")+" "+(t.notes||""))}</div>
    <div class="ov4">
      <div class="ck-unit ins" data-tab="work"><canvas data-k="subs" data-f="${sd.n?sd.done/sd.n:0}"></canvas><div><div class="k">Subtasks</div><div class="v">${sd.done}<small>/ ${sd.n}</small></div><div class="s ${overdueSubs?"late":""}">${sd.n?(overdueSubs?overdueSubs+" overdue":"on track"):"none yet"}</div></div></div>
      <div class="ck-unit ins" data-tab="transports"><canvas data-k="trs" data-f="${t.transports.length?nComp/t.transports.length:0}"></canvas><div><div class="k">Transports</div><div class="v">${nComp}<small>/ ${t.transports.length} complete</small></div><div class="s">${t.transports.filter(x=>!x.released).length} not released</div></div></div>
      <div class="ck-unit ins" data-tab="objects"><canvas data-k="obj" data-f="${t.objects.length?clashN/t.objects.length:0}"></canvas><div><div class="k">Objects</div><div class="v">${t.objects.length}<small>logged</small></div><div class="s ${clashN?"late":""}">${clashN?clashN+" in a clash":"no clashes"}</div></div></div>
      <div class="ck-unit ins" data-tab="history"><canvas data-k="age" data-f="${avg?Math.min(1,age/(avg*2)):0}"></canvas><div><div class="k">${fin?"Took":"Age"}</div><div class="v">${age}<small>d${avg!=null?" · avg lead "+avg:""}</small></div><div class="s ${avg!=null&&age>avg&&!["delivered","closed"].includes(t.status)?"soon":""}">${avg==null?"no delivered demands yet":age>avg?"longer than your usual":"within your usual"}</div></div></div>
      ${(()=>{const h=efSum(efFor(t.id)),e=+t.estimate||0;return `<div class="ck-unit ins" data-tab="effort"><canvas data-k="eff" data-f="${e?Math.min(1,h/e):0}" data-over="${e&&h>e?1:0}"></canvas><div><div class="k">Effort</div><div class="v">${efFh(h)}<small>${e?"/ "+efFh(e)+" h":"h logged"}</small></div><div class="s ${e&&h>e?"late":""}">${e?(h>e?efFh(h-e)+" h over estimate":efFh(e-h)+" h left"):h?"no estimate yet":"nothing logged yet"}</div></div></div>`;})()}</div>
    <div class="bsec"><div class="sec-title"><h3>Latest</h3><div class="ln"></div><span class="faint" style="font-size:10.5px">status · notes · comments · transport moves</span></div>
      ${feed.map(f=>`<div class="fe" style="--pen:${f.pen}"><span class="d">${shortD(isoTs(f.ts))}</span><i></i><span>${f.h}</span></div>`).join("")||`<div class="bempty">Nothing yet.</div>`}
      <div class="compose"><textarea id="ovCmt" rows="1" placeholder="Add a comment… (Ctrl+Enter)"></textarea><button class="sm primary" id="ovPost">Post</button></div></div>`;
  const updNL=()=>{body.querySelector("#n-links").innerHTML=linkChips((t.description||"")+" "+(t.notes||""));};
  body.querySelector("#fDesc").onchange=e=>{t.description=e.target.value;touch(t);updNL();};
  body.querySelector("#fNotes").onchange=e=>{t.notes=e.target.value;touch(t);updNL();};
  const post=()=>{const ta=body.querySelector("#ovCmt"),v=ta.value.trim();if(!v)return;(t.comments=t.comments||[]).push({id:uid(),text:v,ts:Date.now()});touch(t);renderOverview(body,t);};
  body.querySelector("#ovPost").onclick=post;body.querySelector("#ovCmt").onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")post();};
  body.querySelectorAll(".ins[data-tab]").forEach(u=>u.onclick=()=>{activeTab=u.dataset.tab;renderDetail();enterPulse("detail");});
  body.querySelectorAll(".ins canvas").forEach(cv=>{const f=+cv.dataset.f,k=cv.dataset.k,st={v:motionOn()?0:f};
    DK.scope(cv,(c,w,h)=>{const {C}=DK;st.v+=(f-st.v)*.05;const col=k==="obj"?(f>0?C.bad:C["pen-2"]):k==="age"?(f>.5?C.watch:C.good):k==="eff"?(+cv.dataset.over?C.bad:C.good):k==="trs"?C.good:C["pen-2"];
      if(k==="age"||k==="eff")DK.dotArc(c,w/2,h/2+4,w/2-5,st.v,22,col,1.8);else DK.dotRing(c,w/2,h/2,w/2-5,st.v,30,col);});});
  DK.scope(body.querySelector(".jcv"),journeyDraw(t));}
/* the demand's life on a date line: status stretches, rework loops, transports landing, due, today */
function journeyDraw(t){return (c,w,h,tm,dt,s)=>{const {dot,ring,label,C}=DK,mv=motionOn();
  const hs=statusHistory(t),pen=k=>C[STATUS_CK[k]]||C["ink-3"],ms=d=>new Date(d+"T00:00:00").getTime();
  /* a finished demand's line ends at its last event, not at today — otherwise an old closed demand is a speck on the left */
  const fin=journeyFinish(t,hs),t0=ms(hs[0].d);
  const tLast=fin?ms(fin):Math.max(Date.now(),t.dueDate?ms(t.dueDate):0),tEnd=tLast+Math.max(864e5,(tLast-t0)*.04);
  const X=d=>28+(w-56)*((ms(d)-t0)/Math.max(1,tEnd-t0)),y=h*.44;
  const prog=mv?Math.min(1,(performance.now()-s.born)/1400):1,xMax=28+(w-56)*(1-Math.pow(1-prog,3)),today=todayStr(),xNow=fin?Infinity:X(today);
  for(let x=28;x<=w-28;x+=6)dot(c,x,y,.8,C["ink-4"]);
  hs.forEach((e,i)=>{const a=Math.min(X(e.d),xMax),b=Math.min(i<hs.length-1?X(hs[i+1].d):(t.status==="closed"?X(e.d)+2:fin?Math.max(X(e.d)+2,X(fin)):xNow),xMax);if(b<=a)return;
    c.globalAlpha=.85;c.strokeStyle=pen(e.s);c.lineWidth=3;c.beginPath();c.moveTo(a,y);c.lineTo(b,y);c.stroke();});
  hs.forEach((e,i)=>{if(e.s!=="bug")return;const prev=hs.slice(0,i).reverse().find(x=>x.s==="delivered");if(!prev)return;const a=X(prev.d),b=X(e.d);if(b>xMax)return;
    c.globalAlpha=.6;c.strokeStyle=C.bad;c.lineWidth=1.2;c.setLineDash([3,3]);c.beginPath();c.moveTo(b,y-4);c.quadraticCurveTo((a+b)/2,y-44,a,y-4);c.stroke();c.setLineDash([]);
    label(c,"rework",(a+b)/2,y-30,{size:8,color:C.bad});});
  let lastX=-99,flip=0;
  hs.forEach(e=>{const x=X(e.d);if(x>xMax)return;dot(c,x,y,4.2,C.paper);dot(c,x,y,3.4,pen(e.s));
    flip=x-lastX<60?1-flip:0;lastX=x;const up=flip===1;
    label(c,(STATUS[e.s]?STATUS[e.s].label.split(" /")[0]:e.s).toUpperCase(),x,y+(up?-16:18),{size:7.5,color:pen(e.s)});
    label(c,shortD(e.d),x,y+(up?-26:28),{font:DK.MONO,size:8,weight:400});});
  t.transports.forEach((tr,k)=>tr.syncs.forEach(sy=>{if(!sy.date)return;const x=X(sy.date);if(x>xMax||x<28)return;const yy=h-16-(k%3)*7;
    c.globalAlpha=.35;c.strokeStyle=C.good;c.lineWidth=1;c.beginPath();c.moveTo(x,y+6);c.lineTo(x,yy);c.stroke();dot(c,x,yy,2.2,C.good);}));
  if(t.transports.some(tr=>tr.syncs.some(sy=>sy.date)))label(c,"TRANSPORTS LANDING",28,h-3,{size:7,align:"left"});
  if(t.dueDate){const xd=X(t.dueDate);if(xd<=xMax){c.globalAlpha=.8;c.strokeStyle=C.bad;c.lineWidth=1;c.beginPath();c.moveTo(xd,y-24);c.lineTo(xd,y+10);c.stroke();label(c,"DUE",xd,y-30,{size:7.5,color:C.bad});}}
  if(xNow<=xMax){const pl=mv?(Math.sin(tm*.004)+1)/2:0;ring(c,xNow,y,6+pl*5,C.ink,.4*(1-pl));dot(c,xNow,y,2.4,C.ink);label(c,"TODAY",xNow,y+40,{size:7.5,color:C.ink});}
  else if(fin&&prog>=1){const n=Math.round((ms(today)-ms(fin))/864e5);if(n>0)label(c,`TODAY +${n}D →`,w-28,y+40,{size:7.5,color:C["ink-4"],align:"right"});}};}
/* the last dated thing a delivered/closed demand did (status change or transport landing); null while it's still live */
function journeyFinish(t,hs){if(!["delivered","closed"].includes(t.status))return null;const today=todayStr();
  let d=hs[hs.length-1].d;const see=x=>{if(x&&x<=today&&x>d)d=x;};
  t.transports.forEach(tr=>tr.syncs.forEach(s=>see(s.date)));(t.tocs||[]).forEach(c=>c.syncs.forEach(s=>see(s.date)));return d;}

/* ---------- Transports: every transport against every system on its route ---------- */
const trOpen=new Set();   /* transport cards expanded for editing (Bench) */
function trRouteSystems(t,tr){const own=trDest(t,tr),L=landscapeOf(tr.system);return own.length?[tr.system,...own.filter(x=>x!==tr.system)]:(L?routeTiers().map(d=>L+d):[]);}
function drawTrMap(host,t,onPick){if(!host)return;
  if(!t.transports.length){host.innerHTML="";return;}
  const cols=[];const add=x=>{if(x&&!cols.includes(x))cols.push(x);};
  t.transports.forEach(tr=>{trRouteSystems(t,tr).forEach(add);tr.syncs.forEach(s=>add(s.system));});(t.tocs||[]).forEach(c=>c.syncs.forEach(s=>add(s.system)));
  cols.sort((a,b)=>landscapeOf(a).localeCompare(landscapeOf(b))||String(b).slice(-1).localeCompare(String(a).slice(-1)));
  const lands=[];cols.forEach(x=>{const L=landscapeOf(x),g=lands.find(y=>y.L===L);if(g)g.n++;else lands.push({L,n:1});});
  const first=cols.map((x,i)=>i>0&&landscapeOf(x)!==landscapeOf(cols[i-1]));
  const cell=(tr,x,ri,ci)=>{const R=new Map();effectiveSyncs(t,tr).forEach(sy=>{if(!R.has(sy.system))R.set(sy.system,{d:sy.date,via:sy.via});});const T=trTargets(t,tr),onRoute=trRouteSystems(t,tr).includes(x),tg=T.includes(x);
    if(x===tr.system)return `<span class="cell origin" style="--pen:${penVar(x)}" title="Origin ${esc(x)}"><i></i></span>`;
    if(R.has(x)){const r=R.get(x);return `<span class="cell reach ${tg?"tgt":""}" style="--pen:${penVar(x)};--d:${80+ri*60+ci*35}ms" title="Reached ${esc(x)}${r.d?" "+r.d:""}${r.via?" (via ToC "+esc(r.via)+")":""}"><i></i>${r.d?`<span class="dt">${shortD(r.d)}</span>`:""}</span>`;}
    if(onRoute||tg)return `<span class="cell pend ${tg?"tgt":""}" style="--pen:${penVar(x)}" title="${tg?"Destination":"On the route"} — not reached yet"><i></i></span>`;
    return `<span class="cell none"><i></i></span>`;};
  const row=(tr,mem)=>{const i=t.transports.indexOf(tr),miss=trMissing(t,tr);
    return `<tr class="mtr ${mem?"mem":""} ${trOpen.has(tr.id)?"sel":""}" data-id="${tr.id}"><td class="sq">${p2(i+1)}</td><td><span class="nm">${esc(tr.number||"(unnumbered)")}</span>${isCust(tr)?btag("cust"+(tr.client?" · "+esc(tr.client):""),"var(--teal)"):""}${!tr.released?btag("not released","var(--watch)"):""}<div class="ds">${esc(tr.desc||"")}</div></td>
      ${cols.map((x,ci)=>`<td class="c ${first[ci]?"sepL":""}">${cell(tr,x,i,ci)}</td>`).join("")}
      <td class="st">${trComplete(t,tr)?`<span class="good">✓ complete</span>`:trTargets(t,tr).length?`<span class="soon">→ ${esc(miss.join(" · "))}</span>`:`<span class="dim">no target</span>`}</td></tr>`;};
  let rows="";const inToc=new Set();
  (t.tocs||[]).forEach(c=>{const mem=t.transports.filter(x=>x.tocId===c.id);mem.forEach(m=>inToc.add(m.id));
    rows+=`<tr class="toc"><td class="sq">ToC</td><td><span class="nm">${esc(c.number||"(unnumbered ToC)")}</span>${btag("bundles "+mem.length,"var(--accent2)")}<div class="ds">${esc(c.desc||"")}</div></td>
      ${cols.map((x,ci)=>{const hit=c.syncs.find(s=>s.system===x);return `<td class="c ${first[ci]?"sepL":""}">${hit?`<span class="cell reach" style="--pen:var(--accent2);--d:${ci*40}ms" title="ToC reached ${esc(x)} ${hit.date||""}"><i></i>${hit.date?`<span class="dt">${shortD(hit.date)}</span>`:""}</span>`:`<span class="cell none"><i></i></span>`}</td>`;}).join("")}<td></td></tr>`;
    mem.forEach(m=>rows+=row(m,true));});
  t.transports.forEach(tr=>{if(!inToc.has(tr.id))rows+=row(tr,false);});
  host.innerHTML=`<div class="bsec trmap"><div class="sec-title"><h3>Transport map</h3><div class="ln"></div><span class="faint" style="font-size:10.5px">click a transport to edit it below</span></div>
    <div style="overflow-x:auto"><table class="mx"><thead><tr><th></th><th></th>${lands.map((g,gi)=>`<th class="land ${gi?"sepL":""}" colspan="${g.n}">${esc(g.L)} landscape</th>`).join("")}<th></th></tr>
      <tr><th>#</th><th>Transport</th>${cols.map((x,ci)=>`<th class="sys ${first[ci]?"sepL":""}">${esc(x)}<small>${TIER_S[String(x).slice(-1)]||""}</small></th>`).join("")}<th style="text-align:right">Status</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="mxleg"><span><span class="cell origin" style="--pen:var(--pen-2)"><i></i></span>origin</span><span><span class="cell reach" style="--pen:var(--pen-3)"><i></i></span>reached</span><span><span class="cell pend" style="--pen:var(--pen-4)"><i></i></span>on its way</span><span><span class="cell pend tgt" style="--pen:var(--pen-3)"><i></i></span>destination</span><span style="color:var(--accent2)">▌ a ToC brackets the transports it bundles</span></div></div>`;
  host.querySelectorAll("tr.mtr").forEach(r=>r.onclick=()=>onPick(r.dataset.id));}

/* ---------- keys: ↑↓ through the list, 1–6 for the main tabs ---------- */
document.addEventListener("keydown",e=>{
  if(!benchOn()||view!=="demands"||screenLocked||pendingEncrypted||e.ctrlKey||e.metaKey||e.altKey)return;
  if(document.querySelector("#modalRoot .modal-bg"))return;
  const a=document.activeElement;if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))return;
  if(e.key==="Escape"&&document.querySelector("main.board.open")){document.querySelector("main").classList.remove("open");return;}
  if((e.key==="ArrowDown"||e.key==="ArrowUp")&&demandsMode()==="list"){const ids=[...document.querySelectorAll("#taskList .tcard")].map(c=>c.dataset.id);if(!ids.length)return;

/* ---------- never lose half-typed text ----------
   Fields commit on "change", which only fires when you leave the field. Text typed but
   not yet committed is tracked here: long-form text areas commit after a short pause in
   typing (so the backup and auto-save see it), and Save / closing the window commit
   every field first. Only fields with a change handler are touched. */
const pendingEdit=new Set();
document.addEventListener("input",e=>{const el=e.target;
  if(!el||typeof el.onchange!=="function")return;
  if(!(el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&!/^(date|checkbox|radio|number|file)$/.test(el.type))))return;
  pendingEdit.add(el);
  if(el.tagName==="TEXTAREA"){clearTimeout(el._commitT);el._commitT=setTimeout(()=>commitEdit(el),1200);}
},true);
document.addEventListener("change",e=>{pendingEdit.delete(e.target);},true);
function commitEdit(el){if(!pendingEdit.delete(el)||!el.isConnected)return;el.dispatchEvent(new Event("change"));}
function flushEdits(){[...pendingEdit].forEach(commitEdit);}

/* ---------- one copy at a time ----------
   Two open copies share one backup and one data file, and whichever writes last
   silently wins. Each copy announces itself; any overlap raises a banner in both. */
const INSTANCE=uid(),peers=new Map(); /* id → last heard from; a copy that stops pinging is gone */
function drawPeerWarn(){const el=document.getElementById("peerWarn");if(!el)return;
  if(!peers.size||drawPeerWarn._off){el.classList.add("hide");return;}
  el.innerHTML=`<span>⚠ <b>Demand Desk is also open in another tab or window.</b> Both copies write to the same file and backup, so one can overwrite the other's changes — keep just one open.</span><button class="sm" id="pw-x">Dismiss</button>`;
  el.classList.remove("hide");
  el.querySelector("#pw-x").onclick=()=>{drawPeerWarn._off=true;drawPeerWarn();};}
/* Two carriers, because pages opened straight from disk (file://) don't always get
   BroadcastChannel, but they do share localStorage and its "storage" event. */
const PRESENCE_KEY="demanddesk.presence";let peerBc=null;
function announce(t){const m={t,id:INSTANCE,ts:Date.now()};
  try{if(peerBc)peerBc.postMessage(m);}catch(e){}
  try{localStorage.setItem(PRESENCE_KEY,JSON.stringify(m));}catch(e){}}
function onPeerMsg(m){if(!m||!m.id||m.id===INSTANCE)return;
  if(m.t==="bye")peers.delete(m.id);
  else{const isNew=!peers.has(m.id);if(isNew)drawPeerWarn._off=false;peers.set(m.id,Date.now());
    if(m.t==="hello")announce("here");}
  drawPeerWarn();}
try{peerBc=new BroadcastChannel("demanddesk");peerBc.onmessage=ev=>onPeerMsg(ev.data);}catch(e){peerBc=null;}
window.addEventListener("storage",e=>{if(e.key===PRESENCE_KEY&&e.newValue){try{onPeerMsg(JSON.parse(e.newValue));}catch(x){}}});
announce("hello");
setInterval(()=>{announce("ping");
  const cut=Date.now()-40000;let gone=false;peers.forEach((ts,id)=>{if(ts<cut){peers.delete(id);gone=true;}});
  if(gone)drawPeerWarn();},15000);
window.addEventListener("pagehide",()=>announce("bye"));

/* ---------- idle lock (only when encryption is on) ---------- */
const IDLE_MS=15*60*1000;
let lastActivity=Date.now(),screenLocked=false;
["mousemove","keydown","mousedown","wheel","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{lastActivity=Date.now();},{passive:true}));
setInterval(()=>{if(!screenLocked&&isEncrypted()&&Date.now()-lastActivity>IDLE_MS)lockScreen();},30000);
function lockScreen(){
  if(screenLocked)return;flushEdits();screenLocked=true;revealPw={};
  const veil=document.createElement("div");veil.className="lockveil";
  veil.innerHTML=`<div class="modal" style="width:360px"><h2>🔒 Locked (idle)</h2>
    <p class="faint" style="font-size:12px">Locked after 15 minutes of inactivity. Nothing was lost — unsaved changes are kept.</p>
    <div class="field"><label>Master password</label><input type="password" id="lk-pw" autocomplete="off"></div>
    <div id="lk-err" style="color:var(--red);font-size:12px;min-height:14px"></div>
    <div class="modal-foot"><button id="lk-ok" class="primary" style="width:100%">Unlock</button></div></div>`;
  document.body.appendChild(veil);
  const pw=veil.querySelector("#lk-pw");pw.focus();
  const tryUnlock=()=>{if(pw.value===masterPassword){veil.remove();screenLocked=false;lastActivity=Date.now();renderApp();}
    else{veil.querySelector("#lk-err").textContent="Wrong password.";pw.value="";pw.focus();}};
  veil.querySelector("#lk-ok").onclick=tryUnlock;
  pw.onkeydown=e=>{if(e.key==="Enter")tryUnlock();};
}

async function unlockStartup(){
  while(true){const pw=await promptPassword("🔒 Enter master password to unlock Demand Desk");
    if(pw===null){showStartupLock();return;}
    try{state=migrate(await decryptEnvelope(pendingEncrypted,pw));masterPassword=pw;pendingEncrypted=null;renderApp();toast("Unlocked 🔒");return;}
    catch(e){toast("Wrong password — try again",true);}}
}

    <div class="modal-foot"><button id="bl-open">📂 Open another file</button><button id="bl-unlock" class="primary">Unlock…</button></div></div>`;
  document.body.appendChild(veil);

async function boot(){

  else {

      if(backupUnreadable)toast("The browser's backup couldn't be read, so it was set aside untouched. Use 📂 Open to load your .json file.",true); }
    renderApp();
    let hadFile=false;try{hadFile=useIdb?!!(await idbGet("hadfile")):!!localStorage.getItem(LS_HANDLE_HINT);}catch(e){}
    if(res&&hadFile)toast("Loaded from local backup");
  }
  await restoreHandle();
  await restoreImgDir();
}
