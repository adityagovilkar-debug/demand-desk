/* ===================== OBJECT CLASHES ===================== */
/* The same object changed in two demands at once is how transports overwrite each
   other in QA or Prod. An object is "in flight" from the moment it's logged until the
   transports carrying it reach that demand's go-live system. Objects only Analyzed,
   and closed demands, never count. */
const objKey=n=>String(n||"").trim().toUpperCase();
function objectInFlight(t,o){
  if(!objKey(o.name)||o.action==="Analyzed"||t.status==="closed")return false;
  const trs=trsForObject(t,o.id);
  if(trs.length)return trs.some(tr=>trTargets(t,tr).length?!trComplete(t,tr):t.status!=="delivered");
  if(t.status!=="delivered")return true;
  return !!golivePending(t); /* delivered, object not ticked on a TR: trust the demand's own go-live check */
}
/* object name → every in-flight use, kept only where 2+ different demands share it */
function clashIndex(){const m=new Map();
  state.tasks.forEach(t=>t.objects.forEach(o=>{if(!objectInFlight(t,o))return;const k=objKey(o.name);
    if(!m.has(k))m.set(k,[]);m.get(k).push({t,o});}));
  [...m.keys()].forEach(k=>{if(new Set(m.get(k).map(x=>x.t.id)).size<2)m.delete(k);});
  return m;}
/* the other demands where this object is also in flight; ack = "sequenced, stop warning" */
function clashesFor(t,o,idx){if(!objectInFlight(t,o))return [];
  const v=(idx||clashIndex()).get(objKey(o.name));if(!v)return [];
  const seen=new Set();
  return v.filter(x=>x.t.id!==t.id&&!seen.has(x.t.id)&&seen.add(x.t.id))
    .map(x=>({t:x.t,o:x.o,ack:(o.ackClash||[]).includes(x.t.id)}));}
function taskClashes(t,idx){idx=idx||clashIndex();const out=[];
  t.objects.forEach(o=>{const c=clashesFor(t,o,idx);if(c.length)out.push({o,others:c,open:c.filter(x=>!x.ack)});});return out;}
function openClashCount(t,idx){return taskClashes(t,idx).filter(x=>x.open.length).length;}
/* acknowledging is mutual — both demands stop warning about each other for that object */
function setClashAck(t,o,other,on){const k=objKey(o.name);
  const flip=(obj,id)=>{obj.ackClash=obj.ackClash||[];
    if(on){if(!obj.ackClash.includes(id))obj.ackClash.push(id);}else obj.ackClash=obj.ackClash.filter(x=>x!==id);};
  t.objects.filter(x=>objKey(x.name)===k).forEach(x=>flip(x,other.id));
  other.objects.filter(x=>objKey(x.name)===k).forEach(x=>flip(x,t.id));
  other.updatedAt=Date.now();touch(t);}
/* where the other demand's copy of the object stands, e.g. "In progress · H03K900812 at H02" */
function clashWhere(x){const trs=trsForObject(x.t,x.o.id);
  return STATUS[x.t.status].label+(trs.length
    ?" · "+trs.map(tr=>{const r=[...reachedSystems(x.t,tr)];return (tr.number||"(TR)")+(r.length?" at "+r.join("/"):" not moved yet");}).join(", ")
    :" · not on a transport yet");}
function trClashHtml(t,tr,idx){const out=[];
  (tr.objectIds||[]).forEach(id=>{const o=t.objects.find(x=>x.id===id);if(!o)return;
    clashesFor(t,o,idx).filter(x=>!x.ack).forEach(x=>out.push(`⚠ Carries <b class="mono">${esc(o.name)}</b>, also in flight in <b>${esc(x.t.demandId||x.t.title)}</b> (${esc(clashWhere(x))}) — agree the import order.`));});
  return out.map(x=>`<div class="clash">${x}</div>`).join("");}

/* ===================== NEXT ACTION ===================== */
/* "Look at this again on …" — a date (and what to do) that brings a demand back onto
   Today, so it can be parked without being forgotten. */
function nextActionDue(t){const n=t.nextAction;return !!(n&&n.date&&n.date<=todayStr()&&t.status!=="closed");}
function openNextAction(t){
  const n=t.nextAction||{date:"",note:""};

  const nextMon=(()=>{const x=new Date(todayStr()+"T00:00:00");x.setDate(x.getDate()+((8-x.getDay())%7||7));return isoD(x);})();
  const quick=[["Tomorrow",plus(1)],["In 3 days",plus(3)],["Next Monday",nextMon],["In 1 week",plus(7)],["In 2 weeks",plus(14)],["In a month",plus(30)]];
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:460px"><h2>⏰ Next action — ${esc(t.demandId||t.title)}</h2>
    <p class="faint" style="font-size:12px;margin-top:-8px">On this date the demand comes back up on <b>Today</b> — park it without forgetting it.</p>
    <div class="field"><label>What to do</label><input id="na-note" value="${esc(n.note)}" placeholder="e.g. Chase QA for test results, check the TR reached H02"></div>
    <div class="field"><label>On</label><input type="date" id="na-date" value="${n.date||plus(1)}" style="width:170px"></div>
    <div class="chiprow">${quick.map(([l,d])=>`<button class="sm na-q" data-d="${d}" title="${d}">${l}</button>`).join("")}</div>
    <div class="modal-foot">${n.date?`<button id="na-clear" class="ghost" style="margin-right:auto">Clear</button>`:""}<button id="na-cancel" class="ghost">Cancel</button><button id="na-save" class="primary">Set</button></div></div></div>`;
  const close=()=>root.innerHTML="";
  root.querySelectorAll(".na-q").forEach(b=>b.onclick=()=>{root.querySelector("#na-date").value=b.dataset.d;});
  root.querySelector("#na-cancel").onclick=close;
  root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
  const clr=root.querySelector("#na-clear");if(clr)clr.onclick=()=>{t.nextAction={date:"",note:""};touch(t);close();renderApp();};
  const save=()=>{const d=root.querySelector("#na-date").value;if(!d){toast("Pick a date",true);return;}
    t.nextAction={date:d,note:root.querySelector("#na-note").value.trim()};touch(t);close();renderApp();

function nextActionDone(t){const n=t.nextAction;if(!n||!n.date)return;

/* ===================== TRANSPORT RUN SHEET ===================== */
/* What Basis has to import into one system, in release order. A ToC stands in for the
   TRs bundled in it (imported once, where its first member sits in the order), customizing
   TRs name their client, and whatever already reached the target is left off the request.
   Only TRs routed through the target's landscape count — an H1x TR never goes to H01. */
function runSheetData(tasks,target,showDone){
  const rows=[];let other=0;
  if(target){const L=landscapeOf(target);
    tasks.forEach(t=>{const tocSeen=new Set();
      t.transports.forEach(tr=>{
        /* a transport with its own destinations only belongs on a sheet for one of them */
        const own=trDest(t,tr);
        if(own.length?!own.includes(target):(landscapeOf(tr.system)!==L&&!effectiveSyncs(t,tr).some(s=>landscapeOf(s.system)===L))){other++;return;}
        const toc=tocFor(t,tr);
        if(toc){if(tocSeen.has(toc.id))return;tocSeen.add(toc.id);
          const members=t.transports.filter(x=>x.tocId===toc.id),hit=toc.syncs.find(s=>s.system===target);
          rows.push({t,toc,members,number:toc.number||"(unnumbered ToC)",desc:toc.desc,type:"ToC",client:"",released:true,
            done:!!hit||members.every(m=>reachedSystems(t,m).has(target)),doneDate:hit?hit.date:"",objIds:members.flatMap(m=>m.objectIds||[])});}
        else{const hit=effectiveSyncs(t,tr).find(s=>s.system===target);
          rows.push({t,tr,number:tr.number||"(unnumbered)",desc:tr.desc,type:isCust(tr)?"Customizing":"Workbench",client:isCust(tr)?tr.client:"",
            released:tr.released,done:!!hit,doneDate:hit?hit.date:"",objIds:tr.objectIds||[]});}
      });});
    const cidx=clashIndex();
    rows.forEach(r=>{r.warn=r.released?[]:["not released yet"];
      [...new Set(r.objIds)].map(id=>r.t.objects.find(o=>o.id===id)).filter(Boolean).forEach(o=>
        clashesFor(r.t,o,cidx).filter(x=>!x.ack).forEach(x=>r.warn.push(`${o.name} is also in flight in ${x.t.demandId||x.t.title} — check the order`)));});}
  const todo=rows.filter(r=>!r.done);
  return {rows,todo,list:showDone?rows:todo,other,tier:tierMeta(target),freeze:target?freezeFor(target):null,
    multi:new Set(rows.map(r=>r.t.id)).size>1};
}
/* inline-styled so the table survives being pasted into Outlook or Teams */
function runSheetHTML(d,target,label,notes){
  const cell='style="border:1px solid #bbb;padding:4px 8px;text-align:left;vertical-align:top"';
  let n=0;
  return `<h1>Transport import request</h1><h2>${esc(target)}${d.tier?" · "+esc(d.tier.label):""} — ${esc(label)}</h2>
    ${d.freeze?`<p><b style="color:#b3261e">❄ ${esc(target)} is in a change freeze until ${esc(d.freeze.to)} — ${esc(d.freeze.title)}.</b></p>`:""}
    ${d.list.length?`<p>Please import in this order:</p>
    <table style="border-collapse:collapse;font-size:12px"><tr><th ${cell}>#</th><th ${cell}>Transport</th><th ${cell}>Type</th><th ${cell}>Client</th><th ${cell}>Description</th>${d.multi?`<th ${cell}>Demand</th>`:""}<th ${cell}>Remarks</th></tr>
    ${d.list.map(r=>`<tr${r.done?' style="color:#888"':""}><td ${cell}>${r.done?"✓":++n}</td><td ${cell}><b>${esc(r.number)}</b></td><td ${cell}>${r.type}</td><td ${cell}>${esc(r.client)||"—"}</td>
      <td ${cell}>${esc(r.desc||"")}${r.members?`<br><i>contains ${r.members.map(m=>esc(m.number||"(TR)")).join(", ")}</i>`:""}</td>${d.multi?`<td ${cell}>${esc(r.t.demandId||r.t.title)}</td>`:""}
      <td ${cell}>${r.done?"already in "+esc(target)+(r.doneDate?" ("+esc(r.doneDate)+")":""):r.warn.map(w=>"⚠ "+esc(w)).join("<br>")}</td></tr>`).join("")}</table>`
    :`<p><i>Nothing left to import into ${esc(target)} — everything has reached it.</i></p>`}
    ${notes?`<p><b>Notes:</b><br>${esc(notes).replace(/\n/g,"<br>")}</p>`:""}`;
}
function runSheetText(d,target,label,notes){
  const L=[`Transport import request — ${target}${d.tier?" ("+d.tier.label+")":""}`,label,""];
  if(d.freeze)L.push(`NOTE: ${target} is in a change freeze until ${d.freeze.to} (${d.freeze.title}).`,"");
  if(!d.todo.length)L.push(`Nothing left to import into ${target}.`);
  else{L.push("Please import in this order:");const w=Math.max(...d.todo.map(r=>r.number.length));
    d.todo.forEach((r,i)=>{L.push(`${String(i+1).padStart(3)}. ${r.number.padEnd(w)}  ${r.type}${r.client?" → client "+r.client:""}${r.desc?" — "+r.desc:""}${r.members?` [contains ${r.members.map(m=>m.number||"(TR)").join(", ")}]`:""}${d.multi?` (${r.t.demandId||r.t.title})`:""}`);
      r.warn.forEach(x=>L.push(`       ⚠ ${x}`));});}
  if(notes)L.push("","Notes: "+notes);
  return L.join("\n");
}
function commonTarget(ts){const c={};ts.forEach(t=>{if(!t.transports.length)return;const g=goliveTargetFor(t);if(g)c[g]=(c[g]||0)+1;});
  return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||"";}
function copyRich(html,text){
  try{if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write)
    return navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([`<div style="font-family:Segoe UI,Arial,sans-serif;font-size:13px">${html}</div>`],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]);}catch(e){}
  return navigator.clipboard.writeText(text);}
function openRunSheet(tasks,label,defTarget){
  const root=document.getElementById("modalRoot"),notes=openRunSheet._notes||(openRunSheet._notes={});
  let target=defTarget||"",showDone=false;
  const draw=()=>{
    const d=runSheetData(tasks,target,showDone),nt=notes[label]||"";
    root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:840px"><h2>📋 Transport run sheet — ${esc(label)}</h2>
      <p class="faint" style="font-size:12px;margin-top:-8px">What Basis needs to import, in release order. A ToC replaces the TRs bundled in it; anything that already reached the target drops off the request.</p>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <span style="font-size:13px">Import into</span><select id="rs-sys" style="width:auto">${systemOptions(target)}</select>
        <label style="display:flex;align-items:center;gap:6px;margin:0;text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;color:var(--muted)"><input type="checkbox" id="rs-done" ${showDone?"checked":""} style="width:auto"> show what's already there</label>
        <span class="faint" style="font-size:12px;margin-left:auto">${target?`${d.todo.length} to import${d.other?` · ${d.other} TR(s) not routed here left out`:""}`:""}</span></div>
      <textarea id="rs-notes" rows="2" placeholder="Notes for Basis (optional) — e.g. import after 18:00, ToC first, ping me on Teams when done">${esc(nt)}</textarea>
      <div class="specpaper specdoc" id="rs-prev" style="margin-top:10px">${target?runSheetHTML(d,target,label,nt):"<p><i>Pick the system to import into.</i></p>"}</div>
      <div class="modal-foot">${d.todo.length?`<button id="rs-mark" style="margin-right:auto" title="Once Basis confirms: record the import on every transport / ToC in the list">✓ Mark all imported…</button>`:""}
        <button id="rs-copy" ${target?"":"disabled"} title="Formatted table — paste into an email or Teams">📋 Copy for email</button><button id="rs-text" ${target?"":"disabled"} title="Plain text">📋 Copy as text</button><button id="rs-close" class="primary">Close</button></div></div></div>`;
    const close=()=>{root.innerHTML="";renderApp();};
    root.querySelector("#rs-close").onclick=close;
    root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
    root.querySelector("#rs-sys").onchange=e=>{target=e.target.value;draw();};
    root.querySelector("#rs-done").onchange=e=>{showDone=e.target.checked;draw();};
    /* notes update the preview in place — a full redraw would steal the cursor */
    root.querySelector("#rs-notes").oninput=e=>{notes[label]=e.target.value;if(target)root.querySelector("#rs-prev").innerHTML=runSheetHTML(runSheetData(tasks,target,showDone),target,label,notes[label]);};
    const cp=root.querySelector("#rs-copy");if(cp)cp.onclick=()=>{const x=runSheetData(tasks,target,false);
      copyRich(runSheetHTML(x,target,label,notes[label]||""),runSheetText(x,target,label,notes[label]||"")).then(()=>toast("Copied — paste it into your mail to Basis")).catch(()=>toast("Copy failed",true));};
    const tx=root.querySelector("#rs-text");if(tx)tx.onclick=()=>{navigator.clipboard.writeText(runSheetText(runSheetData(tasks,target,false),target,label,notes[label]||"")).then(()=>toast("Copied as text")).catch(()=>toast("Copy failed",true));};
    const mk=root.querySelector("#rs-mark");if(mk)mk.onclick=()=>{
      const v=prompt(`Basis imported all ${d.todo.length} item(s) into ${target}? Date of the import (YYYY-MM-DD):`,todayStr());if(v===null)return;
      const dt=v.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){toast("Use the YYYY-MM-DD format",true);return;}
      const touched=new Set();d.todo.forEach(r=>{(r.toc||r.tr).syncs.push({system:target,date:dt});touched.add(r.t);});
      touched.forEach(t=>touch(t));draw();toast(`Recorded ${d.todo.length} import(s) into ${target} on ${dt}`);};
  };
  draw();
}

/* ===================== HANDOVER PACK ===================== */
/* Everything a colleague needs to carry your open work while you're away: per demand,
   where it stands, what's next and what's in flight — plus other teams you're waiting
   on, and freezes / recurring duties that fall inside the period. */
const HO_RANK={bug:0,progress:1,open:2,delivered:3,closed:4};
function handoverDefaultIds(){return state.tasks.filter(t=>["open","progress","bug"].includes(t.status)||(t.status==="delivered"&&golivePending(t))).map(t=>t.id);}
function hoOpenSubs(list,d,out){list.forEach(s=>{if(!s.done)out.push({s,d});hoOpenSubs(s.children,s.done?d:d+1,out);});return out;}
function handoverDoc(s,ts){
  const H=[],M=[],mdc=x=>String(x||"").replace(/\|/g,"\\|").replace(/\n/g," ");
  const para=(label,txt)=>{if(!txt)return;H.push(`<p><b>${label}</b></p><div class="note">${esc(txt)}</div>`);M.push(`**${label}**`,``,txt,``);};
  const list=(label,items)=>{if(!items.length)return;H.push(`<p><b>${label}</b></p><ul>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`);M.push(`**${label}**`,``,...items.map(x=>"- "+x),``);};
  const dl=t=>(t.demandId?t.demandId+" — ":"")+t.title;
  const plus30=(()=>{const x=new Date(todayStr()+"T00:00:00");x.setDate(x.getDate()+30);return isoD(x);})();
  const winStart=s.from||todayStr(),winEnd=s.until||plus30;
  const period=(s.from||s.until)?`${s.from||"…"} → ${s.until||"…"}`:"";
  const cidx=clashIndex();
  H.push(`<h1>Handover${period?" · "+esc(period):""}</h1><p class="meta">${s.to?`<b>Handed over to:</b> ${esc(s.to)} &nbsp;|&nbsp; `:""}<b>Demands:</b> ${ts.length} &nbsp;|&nbsp; <b>Prepared:</b> ${todayStr()}</p>`);
  M.push(`# Handover${period?" · "+period:""}`,``,`${s.to?`**Handed over to:** ${s.to} | `:""}**Demands:** ${ts.length} | **Prepared:** ${todayStr()}`,``);
  if(s.intro){H.push(`<div class="note">${esc(s.intro)}</div>`);M.push(s.intro,``);}
  const nextStep=t=>(t.nextAction&&t.nextAction.date)?`${t.nextAction.date}${t.nextAction.note?": "+t.nextAction.note:""}`:isWaiting(t)?`waiting on ${t.waiting.on}`:"";
  if(ts.length){
    H.push(`<h3>At a glance</h3><table><tr><th>Demand</th><th>Status</th><th>System</th><th>Due</th><th>Next step</th></tr>${ts.map(t=>`<tr><td>${esc(dl(t))}</td><td>${STATUS[t.status].label}</td><td>${esc(t.system)||"—"}${t.client?" / "+esc(t.client):""}</td><td>${earliestOpenDue(t)||"—"}</td><td>${esc(nextStep(t))||"—"}</td></tr>`).join("")}</table>`);
    M.push(`## At a glance`,``,`| Demand | Status | System | Due | Next step |`,`|---|---|---|---|---|`,
      ...ts.map(t=>`| ${mdc(dl(t))} | ${STATUS[t.status].label} | ${t.system||"—"}${t.client?" / "+t.client:""} | ${earliestOpenDue(t)||"—"} | ${mdc(nextStep(t))||"—"} |`),``);}
  ts.forEach(t=>{
    const ep=epicById(t.epicId),due=earliestOpenDue(t);
    const meta=[STATUS[t.status].label,t.system?t.system+(t.client?" / "+t.client:""):"",ep?"◆ "+epicLabel(ep)+(t.wave?" · "+t.wave:""):"",
      t.requestor?"asked by "+t.requestor:"",t.receivedDate?"received "+t.receivedDate:"",due?"due "+due:"",
      isWaiting(t)?`waiting on ${t.waiting.on}${waitDays(t)!=null?" for "+waitDays(t)+"d":""}`:""].filter(Boolean).join(" · ");
    H.push(`<h3>${esc(dl(t))}</h3><p class="meta">${esc(meta)}</p>`);M.push(`## ${dl(t)}`,``,`_${meta}_`,``);
    if(t.nextAction&&t.nextAction.date)list("Next action",[`${t.nextAction.date}${t.nextAction.note?" — "+t.nextAction.note:""}`]);
    para("What it is",t.description.length>700?t.description.slice(0,700)+"…":t.description);
    para("Where it stands",t.notes);
    list("Open subtasks",hoOpenSubs(t.subtasks,0,[]).map(({s:x,d})=>`${"› ".repeat(d)}${x.title||"(untitled)"}${x.dueDate?" (due "+x.dueDate+")":""}`));
    const trs=t.transports.map(tr=>{const r=[...reachedSystems(t,tr)],toc=tocFor(t,tr);
      return `${tr.number||"(unnumbered)"} — ${isCust(tr)?"customizing"+(tr.client?", client "+tr.client:""):"workbench"}${tr.released?"":", NOT released"}${r.length?", reached "+r.join("/"):", not moved yet"}${trDest(t,tr).length?", destinations "+trDest(t,tr).join(" → ")+(trComplete(t,tr)?" (complete)":""):""}${toc?", in ToC "+(toc.number||"(unnumbered)"):""}${tr.desc?" · "+tr.desc:""}`;});
    const g=golivePending(t);if(g)trs.push(`⚠ ${g.missing.length} transport(s) not yet in ${g.target}: ${g.missing.map(x=>x.number||"(TR)").join(", ")}`);
    list("Transports",trs);
    list("⚠ Object clashes",taskClashes(t,cidx).flatMap(({o,open})=>open.map(x=>`${o.name} is also in flight in ${x.t.demandId||x.t.title} (${clashWhere(x)})`)));
    if(s.refs)list("Reference",(t.reference||[]).filter(r=>r.label||r.value).map(r=>`${r.label||"(no label)"}: ${r.secret?"(secret — not included, ask me)":r.value}`));
    list("Debugging in progress",debugForTask(t.id).filter(x=>["active","paused"].includes(x.status)).map(x=>`${x.title}${x.resume?" — resume here: "+x.resume.replace(/\s+/g," "):""}`));
    list("Latest comments",(t.comments||[]).slice(-3).map(c=>`${isoTs(c.ts)} — ${c.text.replace(/\s+/g," ")}`));
    if(s.actions){const acts=[];meetingsForTask(t.id).forEach(mt=>mt.actions.filter(a=>!a.done).forEach(a=>acts.push(`${a.text||"(no text)"}${a.owner?" ("+a.owner+")":""}${a.due?" — due "+a.due:""} · from ${mt.date} ${mt.title}`)));
      list("Open action points",acts);}
  });
  const deps=[];[...new Set(ts.map(t=>t.epicId).filter(Boolean))].map(epicById).filter(Boolean)
    .forEach(e=>e.deps.filter(x=>!x.done).forEach(x=>deps.push({e,x})));
  if(deps.length){
    H.push(`<h3>Waiting on other teams</h3><table><tr><th>Epic</th><th>Team</th><th>What they owe</th><th>Since</th><th>Expected</th><th>Last chased</th></tr>${deps.map(({e,x})=>`<tr><td>${esc(e.code||e.name)}</td><td>${esc(x.team)}</td><td>${esc(x.what)}</td><td>${x.since||"—"}</td><td>${x.expected||"—"}</td><td>${x.lastCheck||"never"}</td></tr>`).join("")}</table>`);
    M.push(`## Waiting on other teams`,``,`| Epic | Team | What they owe | Since | Expected | Last chased |`,`|---|---|---|---|---|---|`,
      ...deps.map(({e,x})=>`| ${mdc(e.code||e.name)} | ${mdc(x.team)} | ${mdc(x.what)} | ${x.since||"—"} | ${x.expected||"—"} | ${x.lastCheck||"never"} |`),``);}
  const inWin=d=>d&&d>=winStart&&d<=winEnd;
  const per=[
    ...state.playbook.filter(p=>p.kind==="freeze"&&p.from&&p.to&&p.from<=winEnd&&p.to>=winStart).map(p=>`❄ Change freeze ${p.from} → ${p.to}: ${p.title}${(p.systems||[]).length?" ("+p.systems.join(", ")+")":""}`),
    ...state.playbook.filter(p=>p.kind==="recurring"&&inWin(p.due)).map(p=>`🔁 ${p.due}: ${p.title}`),
    ...(s.todos?state.todos.filter(x=>!x.done&&x.due&&x.due<=winEnd).map(x=>`☐ ${x.due}: ${x.text}`):[])];
  if(per.length){H.push(`<h3>During this period (${esc(winStart)} → ${esc(winEnd)})</h3>`);M.push(`## During this period (${winStart} → ${winEnd})`,``);list("Coming up",per);}
  return {html:H.join(""),md:M.join("\n")};
}

  const root=document.getElementById("modalRoot");
  const lbl='style="display:flex;align-items:center;gap:6px;margin:0;text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;color:var(--muted)"';
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:880px"><h2>🧳 Handover pack</h2>

      <div class="picklist" id="ho-list" style="max-height:220px"></div></details>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px">${[["actions","Open action points from linked meetings"],["refs","Reference entries (secrets left out)"],["todos","My to-dos due before I'm back"]].map(([k,l])=>`<label ${lbl}><input type="checkbox" class="ho-opt" data-k="${k}" ${s[k]?"checked":""} style="width:auto"> ${l}</label>`).join("")}</div>
    <div class="specpaper specdoc" id="ho-prev"></div>
    <div class="modal-foot"><button id="ho-copy">📋 Copy Markdown</button><button id="ho-md">⬇ Download .md</button><button id="ho-print">🖨 Print / Save PDF</button><button id="ho-close" class="primary">Close</button></div></div></div>`;
  const prev=()=>{root.querySelector("#ho-prev").innerHTML=handoverDoc(s,chosen()).html;root.querySelector("#ho-n").textContent=s.ids.size;};
  const drawList=()=>{const host=root.querySelector("#ho-list");
    host.innerHTML=cand.length?cand.map(t=>`<label class="pickrow"><input type="checkbox" data-id="${t.id}" ${s.ids.has(t.id)?"checked":""} style="width:auto"><div><div class="demand">${esc(t.demandId||"—")} · <span class="pill ${STATUS[t.status].cls}" style="font-size:9px">${STATUS[t.status].label}</span></div><div>${esc(t.title)}</div></div></label>`).join("")
      :`<div class="pickrow faint">No demands that aren't closed.</div>`;
    host.querySelectorAll("input[data-id]").forEach(cb=>cb.onchange=()=>{if(cb.checked)s.ids.add(cb.dataset.id);else s.ids.delete(cb.dataset.id);prev();});};
  /* fields update the preview live (oninput, not onchange — so nothing redraws under the cursor) */
  [["#ho-to","to"],["#ho-from","from"],["#ho-until","until"],["#ho-intro","intro"]].forEach(([sel,k])=>{root.querySelector(sel).oninput=e=>{s[k]=e.target.value;prev();};});
  root.querySelector("#ho-def").onclick=()=>{s.ids=new Set(handoverDefaultIds());drawList();prev();};
  root.querySelector("#ho-all").onclick=()=>{s.ids=new Set(cand.map(t=>t.id));drawList();prev();};
  root.querySelector("#ho-none").onclick=()=>{s.ids=new Set();drawList();prev();};
  root.querySelectorAll(".ho-opt").forEach(cb=>cb.onchange=()=>{s[cb.dataset.k]=cb.checked;prev();});
  const close=()=>root.innerHTML="";
  root.querySelector("#ho-close").onclick=close;
  root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
  root.querySelector("#ho-copy").onclick=()=>{navigator.clipboard.writeText(handoverDoc(s,chosen()).md).then(()=>toast("Markdown copied to clipboard")).catch(()=>toast("Copy failed",true));};
  root.querySelector("#ho-md").onclick=()=>{const b=new Blob([handoverDoc(s,chosen()).md],{type:"text/markdown"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="handover-"+(s.from||todayStr())+".md";a.click();URL.revokeObjectURL(a.href);};
  root.querySelector("#ho-print").onclick=()=>{const pa=document.getElementById("printArea");pa.className="specdoc";pa.innerHTML=handoverDoc(s,chosen()).html;window.print();};
  drawList();prev();
}

/* ===================== GLOBAL SEARCH ===================== */
function runGlobalSearch(q){
  const box=document.getElementById("gsearchResults");q=q.trim().toLowerCase();
  if(!q){box.classList.add("hide");return;}
  const hits=[];
  state.tasks.forEach(t=>{
    if([t.demandId,t.title,t.description,t.notes,t.type,t.requestor,t.project,t.theme,t.wave,t.system,t.client?"client "+t.client:"",(t.nextAction&&t.nextAction.note)||"",(()=>{const e=epicById(t.epicId);return e?epicLabel(e):"";})(),(t.comments||[]).map(c=>c.text).join(" ")].join(" ").toLowerCase().includes(q))hits.push({k:"Demand",go:()=>{view="demands";activeId=t.id;activeTab="work";},label:`${t.demandId||"—"} · ${t.title}${t.system?" · "+t.system+(t.client?"/"+t.client:""):""}${t.project?" · ▦ "+t.project:""}${t.theme?" · "+t.theme:""}`});
    t.objects.forEach(o=>{if([o.name,o.type,o.desc].join(" ").toLowerCase().includes(q))hits.push({k:"Object",go:()=>{view="demands";activeId=t.id;activeTab="objects";},label:`${o.name||"(obj)"} — ${o.action} · ${t.demandId||t.title}`});});
    t.transports.forEach(tr=>{
      const toc=tocFor(t,tr);
      const sysStr=effectiveSyncs(t,tr).map(s=>s.system).join(" ")+" "+tr.system+" "+(toc?toc.number:"")+" "+(tr.dest||[]).join(" ");
      if([tr.number,tr.desc,tr.notes,sysStr,tr.client,isCust(tr)?"customizing cust config":"workbench"].join(" ").toLowerCase().includes(q))hits.push({k:"Transport",go:()=>{view="demands";activeId=t.id;activeTab="transports";},label:`${tr.number||"(TR)"} ${tr.desc?"— "+tr.desc:""} · orig ${tr.system}${isCust(tr)&&tr.client?"/"+tr.client:""}${effectiveSyncs(t,tr).length?" → "+[...reachedSystems(t,tr)].join(", "):""}${toc?" · ToC "+toc.number:""} · ${t.demandId||t.title}`});
    });
    (t.tocs||[]).forEach(c=>{if([c.number,c.desc,c.notes,c.syncs.map(s=>s.system).join(" ")].join(" ").toLowerCase().includes(q))hits.push({k:"ToC",go:()=>{view="demands";activeId=t.id;activeTab="transports";},label:`ToC ${c.number||"(unnamed)"}${c.syncs.filter(s=>s.system).length?" → "+c.syncs.filter(s=>s.system).map(s=>s.system).join(", "):""} · ${t.demandId||t.title}`});});
    (function w(a){a.forEach(s=>{if(((s.title||"")+" "+(s.comments||[]).map(c=>c.text).join(" ")).toLowerCase().includes(q))hits.push({k:"Subtask",go:()=>{view="demands";activeId=t.id;activeTab="work";},label:`${s.title} · ${t.demandId||t.title}`});w(s.children);});})(t.subtasks);
    (t.reference||[]).forEach(r=>{const blob=(r.label+" "+(r.secret?"":r.value)).toLowerCase();if(blob.includes(q))hits.push({k:"Reference",go:()=>{view="demands";activeId=t.id;activeTab="reference";},label:`${r.label||"(ref)"}${r.secret?" 🔒":(r.value?" — "+r.value:"")} · ${t.demandId||t.title}`});});
  });
  state.meetings.forEach(m=>{
    if([m.title,m.team,m.attendees,m.body,m.date].join(" ").toLowerCase().includes(q))hits.push({k:"Meeting",go:()=>{view="meetings";meetingRollup=false;activeMeetingId=m.id;},label:`${m.date}${m.team?" · "+m.team:""} · ${m.title}`});
    m.actions.forEach(a=>{if([a.text,a.owner,a.resolution].join(" ").toLowerCase().includes(q))hits.push({k:"Action",go:()=>{view="meetings";meetingRollup=false;activeMeetingId=m.id;},label:`${a.text} ${a.owner?"("+a.owner+")":""}${a.resolution?" ↳ "+a.resolution:""} · ${m.title}`});});
  });
  state.credentials.forEach(c=>{if([c.system,c.client,c.label,c.username,c.url,c.notes].join(" ").toLowerCase().includes(q))hits.push({k:"Vault",go:()=>{view="vault";},label:`${c.system||""}${c.client?"/"+c.client:""} ${c.label||""} · ${c.username||""}`.trim()});});
  state.journal.forEach(j=>{if([j.date,j.title,j.body].join(" ").toLowerCase().includes(q))hits.push({k:"Journal",go:()=>{view="journal";journalTodos=false;activeJournalId=j.id;},label:`${j.date}${j.title?" · "+j.title:""}`});});
  state.todos.forEach(x=>{if(((x.text||"")+" "+(x.resolution||"")).toLowerCase().includes(q))hits.push({k:"To-do",go:()=>{view="journal";journalTodos=true;},label:`${x.done?"✓ ":""}${x.text}${x.resolution?" ↳ "+x.resolution:""}${x.due?" · due "+x.due:""}`});});
  state.epics.forEach(e=>{
    if([e.name,e.code,e.description,e.owner,e.notes,e.myScope].join(" ").toLowerCase().includes(q))
      hits.push({k:"Epic",go:()=>{view="epics";activeEpicId=e.id;epicTab="overview";},label:`◆ ${epicLabel(e)} · ${tasksForEpic(e.id).length} demand(s)`});
    e.log.forEach(x=>{if((x.text||"").toLowerCase().includes(q))hits.push({k:"Epic story",go:()=>{view="epics";activeEpicId=e.id;epicTab="story";},label:`${x.date} ${EPIC_LOG[x.kind].icon} ${x.text} · ◆ ${e.code||e.name}`});});
    e.deps.forEach(x=>{if([x.team,x.what,x.note].join(" ").toLowerCase().includes(q))hits.push({k:"Waiting on",go:()=>{view="epics";activeEpicId=e.id;epicTab="deps";},label:`${x.done?"✓ ":"⏸ "}${x.team} — ${x.what} · ◆ ${e.code||e.name}`});});
    (function w(a){a.forEach(s=>{if((s.title||"").toLowerCase().includes(q))hits.push({k:"Subtask",go:()=>{view="epics";activeEpicId=e.id;epicTab="subtasks";},label:`${s.title} · ◆ ${e.code||e.name}`});w(s.children);});})(e.subtasks);});
  state.playbook.forEach(p=>{
    const blob=[p.title,p.category,p.body,p.steps.map(s=>s.text).join(" "),p.people.map(x=>x.name+" "+x.role+" "+x.contact).join(" "),(p.systems||[]).join(" ")].join(" ").toLowerCase();
    if(blob.includes(q))hits.push({k:"Playbook",go:()=>{view="playbook";activePlayId=p.id;},label:`${PLAY_KINDS[p.kind].icon} ${p.title}${p.category?" · "+p.category:""}`});});
  state.images.forEach(im=>{if((im.label+" "+im.file).toLowerCase().includes(q))hits.push({k:"Image",go:()=>gotoImage(im),label:`📷 ${im.label||im.file}${im.expiry?" · exp "+im.expiry:""}`});});
  state.debug.forEach(s=>{
    const blob=[s.title,s.demandId,s.resume,s.notes,s.objects.map(o=>o.name+" "+o.note).join(" "),s.breakpoints.map(b=>b.object+" "+b.condition+" "+b.note).join(" "),s.findings.map(f=>f.text).join(" "),s.watches.map(w=>w.name+" "+w.value+" "+w.where).join(" ")].join(" ").toLowerCase();
    if(blob.includes(q))hits.push({k:"Debug",go:()=>{view="debug";activeDebugId=s.id;},label:`${s.title}${s.demandId?" · "+s.demandId:""}`});});
  if(!hits.length){box.innerHTML=`<div class="gsr faint">No matches</div>`;box.classList.remove("hide");return;}
  box.innerHTML=hits.slice(0,50).map((h,i)=>`<div class="gsr" data-i="${i}"><span class="k">${h.k}</span>${esc(h.label)}</div>`).join("");
  box.classList.remove("hide");
  box.querySelectorAll(".gsr[data-i]").forEach(el=>el.onclick=()=>{hits[+el.dataset.i].go();box.classList.add("hide");document.getElementById("globalSearch").value="";renderApp();});
}

async function openSnapshots(){

}

/* ===================== BENCH LOOK: dots, motion, cockpit =====================
   The default look (Bench's Instrument aesthetic, Paper + Backlit). Everything that
   moves is drawn from the real data file — a dot is a real transport, a ring is a
   real share of demands — and all of it switches off with Settings → Motion: Off or
   Windows' "reduce animations". Classic themes don't render any of this. */
const DK=(()=>{
  const TAU=Math.PI*2,C={};let MONO="monospace",SANS="sans-serif";
  const KEYS=["paper","paper-2","ink","ink-2","ink-3","ink-4","rule","rule-strong","pen-1","pen-2","pen-3","pen-4","pen-5","pen-6","good","watch","bad"];
  const scopes=[];
  function readColors(){const cs=getComputedStyle(document.documentElement);KEYS.forEach(k=>C[k]=cs.getPropertyValue("--"+k).trim());
    MONO=cs.getPropertyValue("--mono").trim()||MONO;SANS=cs.getPropertyValue("--sans").trim()||SANS;scopes.forEach(s=>s.w=0);}
  function dot(ctx,x,y,r,col,a=1){ctx.globalAlpha=a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
  function ring(ctx,x,y,r,col,a=1,lw=1){ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();}
  /* gauge: a 240° arc of dots; radius and ink both carry the value */
  function dotArc(ctx,cx,cy,R,frac,n,col,lw=2.1){const a0=.78*Math.PI,sw=1.44*Math.PI,f=Math.max(0,Math.min(1,frac));

/* ---------- theme + motion ----------
   A per-viewer preference (localStorage, never the data file), so it also applies on
   the lock screen. Two families: Bench (the default — Paper / Backlit, or follow
   Windows) and the three classic themes. The title-bar button flips light ↔ dark inside
   the chosen family; Settings (⋯) picks any theme and the motion level. */
const THEME_KEY="demanddesk.theme";
const THEME_OPTS={"bench":"Bench · follow Windows","bench-paper":"Bench · Paper","bench-backlit":"Bench · Backlit","dark":"Classic dark","light":"Classic light","instrument":"Instrument White"};
try{if(!localStorage.getItem("demanddesk.themeV2")){localStorage.setItem("demanddesk.themeV2","1");localStorage.setItem(THEME_KEY,"bench");}}catch(e){}
function currentTheme(){try{const t=localStorage.getItem(THEME_KEY);return THEME_OPTS[t]?t:"bench";}catch(e){return "bench";}}
const darkMQ=matchMedia("(prefers-color-scheme: dark)");
function applyTheme(t){t=t||currentTheme();const el=document.documentElement;
  if(t.startsWith("bench")){el.setAttribute("data-theme","bench");el.setAttribute("data-mode",t==="bench-backlit"||(t==="bench"&&darkMQ.matches)?"dark":"light");}
  else{el.setAttribute("data-theme",t);el.removeAttribute("data-mode");}
  /* Chromium doesn't reliably repaint persistent chrome when :root variables change;
     detaching and reattaching the root forces every element to re-resolve them */
  el.style.display="none";void el.offsetHeight;el.style.display="";
  DK.readColors();applyMotion();
  const b=document.getElementById("btnTheme");
  if(b){const dark=t.startsWith("bench")?el.getAttribute("data-mode")==="dark":t==="dark";
    b.textContent=dark?"☀":"🌙";b.title=(dark?"Switch to light":"Switch to dark")+" · every theme is in ⋯ Settings";}}
function setTheme(t){try{localStorage.setItem(THEME_KEY,t);}catch(e){}applyTheme(t);lastTind=null;renderApp();}
function toggleTheme(){const t=currentTheme();let nx;
  if(t.startsWith("bench"))nx=document.documentElement.getAttribute("data-mode")==="dark"?"bench-paper":"bench-backlit";
  else nx=t==="dark"?"light":"dark";
  setTheme(nx);toast("Theme: "+THEME_OPTS[nx]);}
darkMQ.addEventListener("change",()=>{if(currentTheme()==="bench"){applyTheme("bench");renderApp();}});

/* ===================== BENCH LAYOUTS: pages, panels, story =====================
   Bench gives the Demand and Epic pages their own header (ID line, title, readouts,
   status control, bands) and the Epic overview its story-first layout. Every other
   view keeps its renderer: Bench frames each titled section as a panel on the live
   page (wrapSections), so all editing code stays exactly the same in every theme. */
const U=(v,u)=>`${v}<small>${u}</small>`;
/* "03 Jul" this year, "03 Jul 25" otherwise — readouts stay short enough not to clip */
const shortD=s=>{if(!s)return "—";const d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-GB",d.getFullYear()===new Date().getFullYear()?{day:"2-digit",month:"short"}:{day:"2-digit",month:"short",year:"2-digit"});};
function roHTML(items){return `<div class="bro">${items.filter(Boolean).map(x=>`<div class="bro-i ${x.cls||""}"${x.title?` title="${esc(x.title)}"`:""}><span class="k">${x.k}</span><span class="v">${x.v}</span></div>`).join("")}</div>`;}
function dotBarSVG(frac,n=12,pen="var(--ink)"){let s=`<svg class="dbar" width="${n*5}" height="6" aria-hidden="true">`;const lit=Math.round(Math.max(0,Math.min(1,frac||0))*n);
  for(let i=0;i<n;i++)s+=i<lit?`<circle cx="${i*5+2.5}" cy="3" r="2" style="fill:${pen}"/>`:`<circle cx="${i*5+2.5}" cy="3" r="1.1" style="fill:var(--ink-4)"/>`;return s+"</svg>";}
/* a clock face of dots filling toward the next action */
function drawTick(ctx,w,h,t){const {dot,C,TAU}=DK,cx=w/2,cy=h/2,R=Math.min(w,h)/2-3,sec=motionOn()?((t/1000)%60)/60:.25;
  for(let i=0;i<24;i++){const a=-Math.PI/2+i/24*TAU,on=i/24<=sec;dot(ctx,cx+Math.cos(a)*R,cy+Math.sin(a)*R,on?1.5:.9,on?C.watch:C["ink-4"]);}
  const a=-Math.PI/2+sec*TAU;ctx.globalAlpha=.7;ctx.strokeStyle=C.watch;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*(R-4),cy+Math.sin(a)*(R-4));ctx.stroke();dot(ctx,cx,cy,1.5,C.watch);}

/* ---------- never lose half-typed text ----------
   Fields commit on "change", which only fires when you leave the field. Text typed but
   not yet committed is tracked here: long-form text areas commit after a short pause in
   typing (so the backup and auto-save see it), and Save / closing the window commit
   every field first. Only fields with a change handler are touched. */
const pendingEdit=new Set();
document.addEventListener("input",e=>{const el=e.target;
  if(!el||typeof el.onchange!=="function")return;
  if(!(el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&!/^(date|checkbox|radio|number|file)$/.test(el.type))))return;
  pendingEdit.add(el);
  if(el.tagName==="TEXTAREA"){clearTimeout(el._commitT);el._commitT=setTimeout(()=>commitEdit(el),1200);}
},true);
document.addEventListener("change",e=>{pendingEdit.delete(e.target);},true);
function commitEdit(el){if(!pendingEdit.delete(el)||!el.isConnected)return;el.dispatchEvent(new Event("change"));}
function flushEdits(){[...pendingEdit].forEach(commitEdit);}

/* ---------- one copy at a time ----------
   Two open copies share one backup and one data file, and whichever writes last
   silently wins. Each copy announces itself; any overlap raises a banner in both. */
const INSTANCE=uid(),peers=new Map(); /* id → last heard from; a copy that stops pinging is gone */
function drawPeerWarn(){const el=document.getElementById("peerWarn");if(!el)return;
  if(!peers.size||drawPeerWarn._off){el.classList.add("hide");return;}
  el.innerHTML=`<span>⚠ <b>Demand Desk is also open in another tab or window.</b> Both copies write to the same file and backup, so one can overwrite the other's changes — keep just one open.</span><button class="sm" id="pw-x">Dismiss</button>`;
  el.classList.remove("hide");
  el.querySelector("#pw-x").onclick=()=>{drawPeerWarn._off=true;drawPeerWarn();};}
/* Two carriers, because pages opened straight from disk (file://) don't always get
   BroadcastChannel, but they do share localStorage and its "storage" event. */
const PRESENCE_KEY="demanddesk.presence";let peerBc=null;
function announce(t){const m={t,id:INSTANCE,ts:Date.now()};
  try{if(peerBc)peerBc.postMessage(m);}catch(e){}
  try{localStorage.setItem(PRESENCE_KEY,JSON.stringify(m));}catch(e){}}
function onPeerMsg(m){if(!m||!m.id||m.id===INSTANCE)return;
  if(m.t==="bye")peers.delete(m.id);
  else{const isNew=!peers.has(m.id);if(isNew)drawPeerWarn._off=false;peers.set(m.id,Date.now());
    if(m.t==="hello")announce("here");}
  drawPeerWarn();}
try{peerBc=new BroadcastChannel("demanddesk");peerBc.onmessage=ev=>onPeerMsg(ev.data);}catch(e){peerBc=null;}
window.addEventListener("storage",e=>{if(e.key===PRESENCE_KEY&&e.newValue){try{onPeerMsg(JSON.parse(e.newValue));}catch(x){}}});
announce("hello");
setInterval(()=>{announce("ping");
  const cut=Date.now()-40000;let gone=false;peers.forEach((ts,id)=>{if(ts<cut){peers.delete(id);gone=true;}});
  if(gone)drawPeerWarn();},15000);
window.addEventListener("pagehide",()=>announce("bye"));

async function boot(){
  await initStore();
  const res=await loadBackup();
  if(res==="encrypted"){ renderApp(); await unlockStartup(); }
  else {
    if(!res){ seedState();
      if(backupUnreadable)toast("The browser's backup couldn't be read, so it was set aside untouched. Use 📂 Open to load your .json file.",true); }

    let hadFile=false;try{hadFile=useIdb?!!(await idbGet("hadfile")):!!localStorage.getItem(LS_HANDLE_HINT);}catch(e){}
    if(res&&hadFile)toast("Loaded from local backup");
  }
  await restoreHandle();
  await restoreImgDir();
}
boot();
