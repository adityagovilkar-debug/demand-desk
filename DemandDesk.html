  body.querySelector("#expTr").onclick=exportTransportsCSV;
  body.querySelector("#addTr").onclick=()=>{t.transports.push({id:uid(),number:"",desc:"",system:state.settings.defaultSystem,released:false,kind:"workbench",client:"",syncs:[],tocId:"",toc:"",objectIds:[],notes:""});touch(t);renderTransports(body,t);renderDetail();};
  body.querySelector("#addToc").onclick=()=>{(t.tocs=t.tocs||[]).push(normToc({system:state.settings.defaultSystem}));touch(t);renderTransports(body,t);};
  drawReadiness();drawTrs();drawTocs();

  function drawReadiness(){
    const host=body.querySelector("#readiness");
    if(!t.transports.length){host.innerHTML="";return;}
    const target=goliveTargetFor(t);
    const missing=target?t.transports.filter(tr=>!reachedSystems(t,tr).has(target)):[];
    const ok=target&&missing.length===0;
    host.innerHTML=`<div class="readybar ${target?(ok?"ok":"warn"):""}">
      <span>Go-live check — reached</span>
      <select id="rdy-sys" style="width:auto">${systemOptions(target)}</select>
      ${target?(ok
        ?`<b style="color:var(--green)">✓ all ${t.transports.length} transport(s) have reached ${target}</b>`
        :`<b style="color:var(--amber)">⚠ ${missing.length} of ${t.transports.length} not yet at ${target}:</b> <span class="mono" style="font-size:12px">${missing.map(m=>esc(m.number||"(unnumbered)")+(isCust(m)&&m.client?" · 🗂"+esc(m.client):"")).join(", ")}</span>`)
        :`<span class="faint">pick a target system to check coverage before go-live</span>`}
      ${(()=>{const f=target&&freezeFor(target);return f?`<b style="color:var(--teal)">❄ ${target} is FROZEN until ${f.to} — ${esc(f.title)}</b>`:"";})()}</div>`;
    host.querySelector("#rdy-sys").onchange=e=>{t.goliveTarget=e.target.value;touch(t);drawReadiness();drawTrs();};
  }

  function drawTrs(){
    const host=body.querySelector("#trList");host.innerHTML="";
    if(!t.transports.length){host.innerHTML=`<div class="faint" style="font-size:12px;padding:4px 2px">No transports yet.</div>`;return;}
    t.transports.forEach((tr,idx)=>{
      const toc=tocFor(t,tr);const reached=reachedSystems(t,tr);const target=goliveTargetFor(t);const cust=isCust(tr);
      const card=document.createElement("div");card.className="trcard"+(cust?" cust":"");
      const tocOpts=`<option value="">— not bundled —</option>`+(t.tocs||[]).map(c=>`<option value="${c.id}" ${c.id===tr.tocId?"selected":""}>${esc(c.number||"(unnamed ToC)")}</option>`).join("");
      card.innerHTML=`
        <div class="trtop">
          <span class="seq">${idx+1}</span>
          <span class="reorder"><button class="ghost sm up" title="Move up" ${idx===0?"disabled":""}>↑</button><button class="ghost sm down" title="Move down" ${idx===t.transports.length-1?"disabled":""}>↓</button></span>
          <input class="mono num" value="${esc(tr.number)}" placeholder="H03K9..">
          <input class="dsc" value="${esc(tr.desc)}" placeholder="Short description">
          <select class="kind" title="Workbench = client-independent · Customizing = client-specific">
            <option value="workbench" ${!cust?"selected":""}>🔧 Workbench</option>
            <option value="customizing" ${cust?"selected":""}>🗂 Customizing</option></select>
          <select class="org" title="Origin system">${systemOptions(tr.system)}</select>
          <select class="cli ${cust?"":"hide"}" title="Origin client (mandant)">${clientOptions(tr.system,tr.client)}</select>
          <label style="display:flex;align-items:center;gap:5px;text-transform:none;font-size:12px;color:var(--muted);margin:0"><input type="checkbox" class="rel" ${tr.released?"checked":""} style="width:auto">Released</label>
          <button class="ghost sm danger del">🗑</button>
        </div>
        ${target?`<div class="cover ${reached.has(target)?"yes":"no"}">${reached.has(target)?"✓ reached "+target:"✗ not yet at "+target}${cust&&tr.client?" · 🗂 "+esc(tr.client):""}</div>`:""}
        <div style="display:flex;gap:14px;flex-wrap:wrap">
          <div style="flex:1;min-width:260px">
            <label>Synced to systems (directly)</label>
            <div class="syncs"></div>
            <button class="sm addsync" style="margin-top:4px">＋ Add sync target</button>
          </div>
          <div style="flex:0 0 230px">
            <label>Bundled in Transport of Copies</label>
            <select class="tocsel">${tocOpts}</select>
            ${toc&&toc.syncs.filter(s=>s.system).length?`<div class="chiprow" style="margin-top:6px">${toc.syncs.filter(s=>s.system).map(s=>`<span class="sys ${sysTierCls(s.system)}" title="via ToC ${esc(toc.number)}">${esc(s.system)}<span class="d">via ToC</span>${cust&&tr.client?" · <span class='d'>🗂 "+esc(tr.client)+"</span>":""}${s.date?" · <span class='d'>"+s.date+"</span>":""}</span>`).join("")}</div>`:(toc?`<div class="faint" style="font-size:11px;margin-top:6px">ToC not moved anywhere yet</div>`:"")}
            <label style="margin-top:10px">Notes</label>
            <input class="notes" value="${esc(tr.notes)}">
          </div>
        </div>
        <div style="margin-top:8px"><label>Objects in this TR</label><div class="objlink"></div></div>`;
      const q=s=>card.querySelector(s);
      q(".num").onchange=e=>{tr.number=e.target.value;touch(t);drawReadiness();};
      q(".dsc").onchange=e=>{tr.desc=e.target.value;touch(t);};
      q(".kind").onchange=e=>{tr.kind=e.target.value;if(tr.kind!=="customizing")tr.client="";touch(t);drawTrs();drawReadiness();};
      q(".org").onchange=e=>{tr.system=e.target.value;if(tr.client&&!clientsForSystem(tr.system).includes(tr.client))tr.client="";touch(t);drawTrs();drawReadiness();};
      const cliSel=q(".cli");if(cliSel)cliSel.onchange=e=>{tr.client=e.target.value;touch(t);drawTrs();drawReadiness();};
      q(".rel").onchange=e=>{tr.released=e.target.checked;touch(t);};
      q(".notes").onchange=e=>{tr.notes=e.target.value;touch(t);};
      q(".tocsel").onchange=e=>{tr.tocId=e.target.value;touch(t);drawTrs();drawReadiness();};
      q(".del").onclick=()=>{t.transports=t.transports.filter(x=>x.id!==tr.id);touch(t);renderTransports(body,t);renderDetail();};
      q(".up").onclick=()=>{if(idx>0){[t.transports[idx-1],t.transports[idx]]=[t.transports[idx],t.transports[idx-1]];touch(t);drawTrs();drawReadiness();}};
      q(".down").onclick=()=>{if(idx<t.transports.length-1){[t.transports[idx+1],t.transports[idx]]=[t.transports[idx],t.transports[idx+1]];touch(t);drawTrs();drawReadiness();}};
      const syncHost=q(".syncs");
      const drawSyncs=()=>{syncHost.innerHTML="";
        tr.syncs.forEach((sy,i)=>{const r=document.createElement("div");r.className="syncrow";
          r.innerHTML=`<select class="s-sys">${systemOptions(sy.system)}</select><input type="date" class="s-date" value="${sy.date||""}"><button class="ghost sm danger s-del">✕</button>`;
          r.querySelector(".s-sys").onchange=e=>{sy.system=e.target.value;touch(t);drawReadiness();drawTrs();};
          r.querySelector(".s-date").onchange=e=>{sy.date=e.target.value;touch(t);};
          r.querySelector(".s-del").onclick=()=>{tr.syncs.splice(i,1);touch(t);drawSyncs();drawReadiness();};
          syncHost.appendChild(r);});
        if(tr.syncs.filter(s=>s.system).length){const chips=document.createElement("div");chips.className="chiprow";chips.innerHTML=tr.syncs.filter(s=>s.system).map(s=>sysPill(s.system,s.date,cust?tr.client:"")).join("");syncHost.appendChild(chips);}
      };
      q(".addsync").onclick=()=>{tr.syncs.push({system:"",date:todayStr()});touch(t);drawSyncs();};
      drawSyncs();
      const ol=q(".objlink");
      const drawOl=()=>{tr.objectIds=tr.objectIds||[];
        const linked=tr.objectIds.map(id=>t.objects.find(o=>o.id===id)).filter(Boolean);
        ol.innerHTML=linked.map(o=>`<span class="chip" data-id="${o.id}">${esc(o.name||"(obj)")} <span class="x">✕</span></span>`).join("")+`<button class="ghost sm pickobj">＋ object</button>`;
        ol.querySelectorAll(".chip").forEach(ch=>ch.querySelector(".x").onclick=()=>{tr.objectIds=tr.objectIds.filter(x=>x!==ch.dataset.id);touch(t);drawOl();});
        ol.querySelector(".pickobj").onclick=()=>openObjPicker(t,tr,drawOl);

  function drawTocs(){
    const host=body.querySelector("#tocList");host.innerHTML="";
    const tocs=t.tocs||[];
    if(!tocs.length){host.innerHTML=`<div class="faint" style="font-size:12px;padding:4px 2px">No Transports of Copies. Create one, then bundle TRs into it above — the bundled TRs inherit wherever the ToC is moved.</div>`;return;}
    tocs.forEach(c=>{
      const members=t.transports.filter(tr=>tr.tocId===c.id);

      card.innerHTML=`
        <div class="trtop">
          <span class="toctag">ToC</span>
          <input class="mono cnum" value="${esc(c.number)}" placeholder="ToC number">

          <span class="faint" style="font-size:12px;white-space:nowrap">📦 ${members.length} TR(s)</span>
          <button class="ghost sm danger cdel">🗑</button>
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap">

          <div style="flex:0 0 230px"><label>Bundled TRs</label><div class="faint mono" style="font-size:12px">${members.map(m=>esc(m.number||"(unnumbered)")).join(", ")||"—"}</div><label style="margin-top:10px">Notes</label><input class="cnotes" value="${esc(c.notes)}"></div>

      const q=s=>card.querySelector(s);

      q(".cdel").onclick=()=>{if(members.length&&!confirm("Delete this ToC? "+members.length+" TR(s) will become un-bundled."))return;t.transports.forEach(tr=>{if(tr.tocId===c.id)tr.tocId="";});t.tocs=t.tocs.filter(x=>x.id!==c.id);touch(t);renderTransports(body,t);};
      const sh=q(".csyncs");
      const drawCs=()=>{sh.innerHTML="";
        c.syncs.forEach((sy,i)=>{const r=document.createElement("div");r.className="syncrow";
          r.innerHTML=`<select class="s-sys">${systemOptions(sy.system)}</select><input type="date" class="s-date" value="${sy.date||""}"><button class="ghost sm danger s-del">✕</button>`;
          r.querySelector(".s-sys").onchange=e=>{sy.system=e.target.value;touch(t);drawTrs();drawReadiness();};
          r.querySelector(".s-date").onchange=e=>{sy.date=e.target.value;touch(t);drawTrs();};
          r.querySelector(".s-del").onclick=()=>{c.syncs.splice(i,1);touch(t);drawCs();drawTrs();drawReadiness();};
          sh.appendChild(r);});
        if(c.syncs.filter(s=>s.system).length){const chips=document.createElement("div");chips.className="chiprow";chips.innerHTML=c.syncs.filter(s=>s.system).map(s=>sysPill(s.system,s.date)).join("");sh.appendChild(chips);}
      };
      q(".caddsync").onclick=()=>{c.syncs.push({system:"",date:todayStr()});touch(t);drawCs();};
      drawCs();

  }
}

function csvCell(v){v=(v==null?"":String(v));return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportTransportsCSV(){
  const tier=id=>{const m=tierMeta(id);return m?m.short:"";};
  const head=["Demand ID","Demand Title","Demand Status","Seq","TR Number","TR Description","Kind","Origin System","Origin Tier","Client","Released","Direct syncs","ToC Number","Effective syncs (incl. via ToC)","Notes"];
  const rows=[head];
  state.tasks.forEach(t=>t.transports.forEach((tr,idx)=>{
    const direct=tr.syncs.filter(s=>s.system).map(s=>`${s.system} (${tier(s.system)})${s.date?" @"+s.date:""}`).join("; ");
    const toc=tocFor(t,tr);
    const eff=effectiveSyncs(t,tr).map(s=>`${s.system} (${tier(s.system)})${s.date?" @"+s.date:""}${s.via?" [via ToC "+s.via+"]":""}`).join("; ");
    rows.push([t.demandId,t.title,STATUS[t.status].label,idx+1,tr.number,tr.desc,isCust(tr)?"Customizing":"Workbench",tr.system,tier(tr.system),isCust(tr)?tr.client:"",tr.released?"Yes":"No",direct,toc?toc.number:"",eff,tr.notes]);
  }));
  if(rows.length===1){toast("No transports to export",true);return;}
  const csv="﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
  const b=new Blob([csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="transports-"+todayStr()+".csv";a.click();URL.revokeObjectURL(a.href);
  toast("Exported "+(rows.length-1)+" transports (CSV)");
}

}

  L.push(``,`### 4. Transports`);
  if(t.transports.length){L.push(`| # | TR | Kind | Origin | Reached (incl. via ToC) | ToC | Released |`,`|---|---|---|---|---|---|---|`);t.transports.forEach((tr,i)=>{const toc=tocFor(t,tr);const cl=isCust(tr)&&tr.client?" / "+tr.client:"";const sy=effectiveSyncs(t,tr).map(s=>`${s.system}${cl}${s.date?" ("+s.date+")":""}${s.via?" via ToC":""}`).join(", ");L.push(`| ${i+1} | ${tr.number}${tr.desc?" – "+tr.desc:""} | ${isCust(tr)?"Customizing":"Workbench"} | ${tr.system}${cl} | ${sy||"—"} | ${toc?toc.number:"—"} | ${tr.released?"Yes":"No"} |`);});if(t.tocs&&t.tocs.length){L.push(``,`**Transports of Copies:** `+t.tocs.map(c=>c.number+(c.syncs.filter(s=>s.system).length?" → "+c.syncs.filter(s=>s.system).map(s=>s.system).join(", "):"")).join(" · "));}}else L.push("_(none logged)_");
  L.push(``,`### 5. Decisions & Clarifications (from meetings)`);
  if(calls.length)calls.forEach(c=>{L.push(`**${c.date} — ${c.title}** ${c.team?"["+c.team+"] ":""}${c.attendees?"("+c.attendees+")":""}`,``,c.body||"",``);});else L.push("_(no linked meetings)_");
  L.push(``,`### 6. Working Notes & Change History`,t.notes||"_(none)_");
  if(t.comments&&t.comments.length){L.push(``,`**Comments:**`);t.comments.forEach(c=>L.push(`- _${fmtTs(c.ts)}_ — ${c.text.replace(/\n/g," ")}`));}
  if(t.reference&&t.reference.length){L.push(``,`### 7. Reference / Endpoints`,`| Label | Value |`,`|---|---|`);t.reference.forEach(r=>L.push(`| ${r.label} | ${r.secret?"(secret — held in app)":(r.value||"").replace(/\n/g," ")} |`));}
  return L.join("\n");
}

/* ----- WEEKLY SUMMARY ----- */
function weekStartOf(offset){const d=new Date(todayStr()+"T00:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);return d;}
function isoD(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function isoTs(ts){return isoD(new Date(ts));}
function weekData(offset){
  const s=weekStartOf(offset),e=new Date(s.getTime()+7*86400000);
  const s0=isoD(s),e0=isoD(new Date(e.getTime()-86400000));
  const inTs=ts=>ts>=s.getTime()&&ts<e.getTime();
  const inD=d=>d&&d>=s0&&d<=e0;
  const delivered=[],bugs=[],created=[],closed=[];
  state.tasks.forEach(t=>{
    (t.timeline||[]).forEach(ev=>{if(ev.type!=="status"||!inTs(ev.ts))return;
      if(ev.to==="delivered")delivered.push({t,ts:ev.ts});
      else if(ev.to==="bug")bugs.push({t,ts:ev.ts});
      else if(ev.to==="closed")closed.push({t,ts:ev.ts});});
    if(inTs(t.createdAt))created.push(t);
  });
  const moves=[];
  state.tasks.forEach(t=>{
    t.transports.forEach(tr=>tr.syncs.forEach(sy=>{if(sy.system&&inD(sy.date))moves.push({t,num:tr.number||"(TR)",sys:sy.system,date:sy.date,via:"",client:isCust(tr)?tr.client:""});}));
    (t.tocs||[]).forEach(c=>c.syncs.forEach(sy=>{if(sy.system&&inD(sy.date))moves.push({t,num:c.number||"(ToC)",sys:sy.system,date:sy.date,via:"ToC",client:""});}));
  });
  moves.sort((a,b)=>a.date.localeCompare(b.date));
  const journal=state.journal.filter(j=>inD(j.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const meetings=state.meetings.filter(m=>inD(m.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const findings=[];state.debug.forEach(sx=>sx.findings.forEach(f=>{if(inTs(f.ts))findings.push({s:sx,f});}));
  return {s0,e0,delivered,bugs,created,closed,moves,journal,meetings,findings};
}
function weekIsEmpty(w){return !w.delivered.length&&!w.bugs.length&&!w.created.length&&!w.closed.length&&!w.moves.length&&!w.journal.length&&!w.meetings.length&&!w.findings.length;}
function buildWeeklyHTML(w){
  const dl=t=>esc((t.demandId?t.demandId+" — ":"")+t.title);
  const sec=(title,inner)=>inner?`<h3>${title}</h3>${inner}`:"";
  const ul=items=>items.length?`<ul>${items.join("")}</ul>`:"";
  return `<h1>Weekly Summary</h1><h2>${w.s0} → ${w.e0}</h2>
    <p class="meta"><b>Delivered:</b> ${w.delivered.length} &nbsp;|&nbsp; <b>Bugs/rework raised:</b> ${w.bugs.length} &nbsp;|&nbsp; <b>New demands:</b> ${w.created.length} &nbsp;|&nbsp; <b>Closed:</b> ${w.closed.length} &nbsp;|&nbsp; <b>Transport moves:</b> ${w.moves.length} &nbsp;|&nbsp; <b>Generated:</b> ${todayStr()}</p>
    ${sec("Delivered this week",ul(w.delivered.map(x=>`<li>${dl(x.t)} <i>(${isoTs(x.ts)})</i></li>`)))}
    ${sec("Bugs / rework raised",ul(w.bugs.map(x=>`<li>${dl(x.t)} <i>(${isoTs(x.ts)})</i></li>`)))}
    ${sec("New demands received",ul(w.created.map(t=>`<li>${dl(t)}${t.requestor?` <i>— ${esc(t.requestor)}</i>`:""}</li>`)))}
    ${sec("Closed",ul(w.closed.map(x=>`<li>${dl(x.t)}</li>`)))}
    ${sec("Transport movements",w.moves.length?`<table><tr><th>Date</th><th>TR / ToC</th><th>To</th><th>Demand</th></tr>${w.moves.map(m=>`<tr><td>${m.date}</td><td>${esc(m.num)}${m.via?" ("+m.via+")":""}</td><td>${esc(m.sys)}${m.client?" / "+esc(m.client):""}</td><td>${dl(m.t)}</td></tr>`).join("")}</table>`:"")}
    ${sec("Meetings",ul(w.meetings.map(m=>`<li>👥 ${m.date}${m.team?" · "+esc(m.team):""} — ${esc(m.title)}${m.actions.length?` <i>(${m.actions.filter(a=>!a.done).length} open action(s))</i>`:""}</li>`)))}
    ${sec("Debug findings",ul(w.findings.map(({s,f})=>`<li><i>${esc(s.title)}:</i> ${esc(f.text)}</li>`)))}
    ${sec("Journal",w.journal.map(j=>`<p><b>${j.date}${j.title?" — "+esc(j.title):""}</b></p><div class="note">${esc(j.body)}</div>`).join(""))}
    ${weekIsEmpty(w)?"<p><i>Nothing recorded in this week.</i></p>":""}`;
}
function buildWeeklyMarkdown(w){
  const L=[];const dl=t=>(t.demandId?t.demandId+" — ":"")+t.title;
  L.push(`# Weekly Summary — ${w.s0} → ${w.e0}`,``);
  L.push(`Delivered: ${w.delivered.length} | Bugs/rework: ${w.bugs.length} | New demands: ${w.created.length} | Closed: ${w.closed.length} | TR moves: ${w.moves.length}`,``);
  const sec=(h,arr,fn)=>{if(arr.length){L.push(`### ${h}`);arr.forEach(x=>L.push("- "+fn(x)));L.push("");}};
  sec("Delivered this week",w.delivered,x=>`${dl(x.t)} (${isoTs(x.ts)})`);
  sec("Bugs / rework raised",w.bugs,x=>`${dl(x.t)} (${isoTs(x.ts)})`);
  sec("New demands received",w.created,t=>dl(t)+(t.requestor?` — ${t.requestor}`:""));
  sec("Closed",w.closed,x=>dl(x.t));
  sec("Transport movements",w.moves,m=>`${m.date} · ${m.num}${m.via?" ("+m.via+")":""} → ${m.sys}${m.client?" / "+m.client:""} · ${dl(m.t)}`);
  sec("Meetings",w.meetings,m=>`👥 ${m.date}${m.team?" · "+m.team:""} — ${m.title}${m.actions.length?` (${m.actions.filter(a=>!a.done).length} open action(s))`:""}`);
  sec("Debug findings",w.findings,({s,f})=>`${s.title}: ${f.text}`);
  if(w.journal.length){L.push(`### Journal`);w.journal.forEach(j=>{L.push(`**${j.date}${j.title?" — "+j.title:""}**`,``,j.body||"",``);});}
  if(weekIsEmpty(w))L.push("_Nothing recorded in this week._");
  return L.join("\n");
}
function openWeekly(){
  let off=0;const root=document.getElementById("modalRoot");
  const draw=()=>{
    const w=weekData(off);
    root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:780px"><h2>🗓 Weekly summary</h2>
      <p class="faint" style="font-size:12px;margin-top:-8px">Assembled from the timeline, transports, journal, meetings and debug findings — ready for a status report.</p>
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
        <button class="sm" id="wk-prev">◀ prev</button>
        <b class="mono" style="font-size:13px">${w.s0} → ${w.e0}${off===0?" · this week":off===-1?" · last week":""}</b>
        <button class="sm" id="wk-next" ${off>=0?"disabled":""}>next ▶</button></div>
      <div class="specpaper specdoc">${buildWeeklyHTML(w)}</div>
      <div class="modal-foot"><button id="wk-copy">📋 Copy Markdown</button><button id="wk-md">⬇ Download .md</button><button id="wk-print">🖨 Print / Save PDF</button><button id="wk-close" class="primary">Close</button></div></div></div>`;
    const close=()=>root.innerHTML="";
    root.querySelector("#wk-close").onclick=close;
    root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
    root.querySelector("#wk-prev").onclick=()=>{off--;draw();};
    root.querySelector("#wk-next").onclick=()=>{if(off<0){off++;draw();}};
    root.querySelector("#wk-copy").onclick=()=>{navigator.clipboard.writeText(buildWeeklyMarkdown(w)).then(()=>toast("Markdown copied to clipboard")).catch(()=>toast("Copy failed",true));};
    root.querySelector("#wk-md").onclick=()=>{const b=new Blob([buildWeeklyMarkdown(w)],{type:"text/markdown"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="weekly-"+w.s0+".md";a.click();URL.revokeObjectURL(a.href);};
    root.querySelector("#wk-print").onclick=()=>{const pa=document.getElementById("printArea");pa.className="specdoc";pa.innerHTML=buildWeeklyHTML(w);window.print();};
  };
  draw();
}

function renderLinkedItems(body,t){

    ...journalForTask(t.id).map(j=>({kind:"journal",date:j.date,obj:j})),

  body.innerHTML=`<div class="sec-title"><h3>Linked meetings, journal &amp; debug</h3><div class="ln"></div>
      <button class="sm" id="linkMeet">🔗 Meeting</button><button class="sm" id="linkJrnl">🔗 Journal</button><button class="sm" id="linkDbg">🔗 Debug</button></div>
    <div id="lcList"></div>`;

  body.querySelector("#linkJrnl").onclick=()=>openLinkJournalModal(t);

    if(it.kind==="journal"){const j=it.obj;return `<div class="tcard" data-k="journal" data-id="${j.id}" style="border-left-color:var(--teal)"><div class="demand" style="color:var(--teal)">📓 Journal · ${j.date}</div><div class="ttitle">${esc(j.title)||"(daily notes)"}</div><div class="meta faint">${esc((j.body||"").replace(/\s+/g," ").slice(0,80))}</div></div>`;}
    const s=it.obj;const st=DEBUG_STATUS[s.status];
    return `<div class="tcard" data-k="debug" data-id="${s.id}" style="border-left-color:var(--amber)"><div class="demand" style="color:var(--amber)">🐞 Debug · updated ${it.date}</div><div class="ttitle">${esc(s.title)}</div><div class="meta"><span class="pill ${st.cls}">${st.label}</span>${s.resume?`<span class="faint">${esc(s.resume.replace(/\s+/g," ").slice(0,70))}</span>`:""}</div></div>`;
  }).join("");
  host.querySelectorAll(".tcard").forEach(el=>el.onclick=()=>{
    const k=el.dataset.k,id=el.dataset.id;

    else if(k==="journal"){view="journal";journalTodos=false;activeJournalId=id;}
    else{view="debug";activeDebugId=id;}
    renderApp();});

function distinctVals(field){return [...new Set(state.tasks.map(t=>t[field]).filter(Boolean))].sort();}

function renderActionRollup(host){
  let items=[];
  state.meetings.forEach(m=>m.actions.forEach(a=>{if(!a.done)items.push({a,m});}));
  const owners=[...new Set(items.map(x=>x.a.owner).filter(Boolean))].sort();
  const teams=[...new Set(items.map(x=>x.m.team).filter(Boolean))].sort();
  if(rollupOwner&&!owners.includes(rollupOwner))rollupOwner="";
  if(rollupTeam&&!teams.includes(rollupTeam))rollupTeam="";
  let shown=items.filter(x=>(!rollupOwner||x.a.owner===rollupOwner)&&(!rollupTeam||x.m.team===rollupTeam));
  shown.sort((x,y)=>(x.a.due||"9999").localeCompare(y.a.due||"9999"));
  host.innerHTML=`<div class="detail-head"><div class="dh-top"><div style="flex:1">
      <h1>⚑ Open action points</h1>
      <div class="dh-dates"><span><b>${items.length}</b> open across <b>${state.meetings.length}</b> meeting(s)</span></div></div>
      <div style="display:flex;gap:8px">
        ${teams.length?`<div style="min-width:150px"><label>Team</label><select id="ro-team"><option value="">All teams</option>${teams.map(o=>`<option ${o===rollupTeam?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`:""}
        <div style="min-width:150px"><label>Owner</label><select id="ro-owner"><option value="">All owners</option>${owners.map(o=>`<option ${o===rollupOwner?"selected":""}>${esc(o)}</option>`).join("")}</select></div>
      </div>
    </div><div class="tabs"><button class="tab active">Sorted by due date</button></div></div>
    <div class="detail-body" id="roBody"></div>`;
  host.querySelector("#ro-owner").onchange=e=>{rollupOwner=e.target.value;renderActionRollup(host);};
  const rt=host.querySelector("#ro-team");if(rt)rt.onchange=e=>{rollupTeam=e.target.value;renderActionRollup(host);};
  const body=host.querySelector("#roBody");
  if(!shown.length){body.innerHTML=`<div class="faint" style="padding:8px 2px">🎉 No open action points${rollupTeam?" for "+esc(rollupTeam):""}${rollupOwner?" · "+esc(rollupOwner):""}.</div>`;return;}
  body.innerHTML="";
  shown.forEach(({a,m})=>{const dc=dueClass(a.due,"open");const row=document.createElement("div");row.className="actitem";
    row.innerHTML=`<span class="chk">${a.done?"✓":""}</span>
      <span class="at" style="cursor:default">${esc(a.text)||"<span class='faint'>(no text)</span>"}</span>
      <span class="ow" style="flex:0 0 110px;color:var(--muted)">${esc(a.owner)||"<span class='faint'>—</span>"}</span>
      <span class="du ${dc}" style="flex:0 0 100px;font-family:var(--mono);font-size:12px">${a.due||"—"}${dc==="over"?" ⚠":""}</span>
      <span class="go" style="flex:0 0 170px;font-size:11px;color:var(--accent);cursor:pointer" title="Open meeting">👥 ${m.date}${m.team?" · "+esc(m.team):""}</span>
      ${a.resolution?`<span class="ares" title="Outcome — click to edit">↳ ${esc(a.resolution)}</span>`:""}`;
    row.querySelector(".chk").onclick=()=>{a.done=true;touch(m);renderActionRollup(host);renderMeetingSidebar();};
    row.querySelector(".go").onclick=()=>{meetingRollup=false;activeMeetingId=m.id;renderApp();};
    const arEl=row.querySelector(".ares");if(arEl)arEl.onclick=()=>editInline(arEl,a.resolution||"",v=>{a.resolution=v;touch(m);renderActionRollup(host);});
    body.appendChild(row);});
}

function wireCredRow(tr){const c=state.credentials.find(x=>x.id===tr.dataset.id);if(!c)return;
  tr.querySelector(".c-sys").onchange=e=>{c.system=e.target.value;if(c.client&&!clientsForSystem(c.system).includes(c.client))c.client="";c.updatedAt=Date.now();markDirty();drawVault();};
  const cliEl=tr.querySelector(".c-cli");if(cliEl)cliEl.onchange=e=>{c.client=e.target.value;c.updatedAt=Date.now();markDirty();};
  const bind=(sel,key)=>{const el=tr.querySelector(sel);if(el)el.onchange=e=>{c[key]=e.target.value;c.updatedAt=Date.now();markDirty();};};
  bind(".c-label","label");bind(".c-user","username");bind(".c-pass","password");bind(".c-url","url");bind(".c-notes","notes");

  tr.querySelector(".c-del").onclick=()=>{if(confirm("Delete this credential?")){state.credentials=state.credentials.filter(x=>x.id!==c.id);delete revealPw[c.id];markDirty();renderVault();}};

function drawVault(){
  const body=document.getElementById("vaultBody");if(!body)return;
  const note=`<p class="faint" style="font-size:12px;margin-top:6px">2FA protects the login, but treat this file like a password manager export: keep encryption on and the file on your own drive.</p>`;
  if(!state.credentials.length){body.innerHTML=`<div class="faint" style="padding:16px;text-align:center">No credentials yet. Use “＋ Add credential”.</div>${note}`;return;}
  const groups={};state.credentials.forEach(c=>{const L=credLandscape(c.system)||"—";(groups[L]=groups[L]||[]).push(c);});
  const extra=Object.keys(groups).filter(k=>k!=="—"&&!state.settings.landscapes.includes(k)).sort();
  const order=[...state.settings.landscapes,...extra,"—"];
  const seen=new Set();let html="";
  const thead=`<thead><tr><th style="width:130px">System</th><th style="width:96px">Client</th><th>Label</th><th>Username</th><th style="width:200px">Password</th><th>URL</th><th>Notes</th><th style="width:34px"></th></tr></thead>`;
  order.forEach(L=>{if(seen.has(L))return;seen.add(L);const list=groups[L];if(!list||!list.length)return;
    list.sort((a,b)=>(a.system||"").localeCompare(b.system||"")||(a.client||"").localeCompare(b.client||"")||(a.label||"").localeCompare(b.label||""));
    const lbl=L==="—"?"Unassigned":("Landscape "+esc(L));
    html+=`<div class="sec-title" style="margin-top:6px"><h3>${lbl}</h3><div class="ln"></div><span class="faint" style="font-size:12px">${list.length} credential(s)</span></div>`;
    html+=`<div class="tbl-wrap"><table>${thead}<tbody>${list.map(credRow).join("")}</tbody></table></div>`;
  });
  body.innerHTML=html+note;
  body.querySelectorAll("tr[data-id]").forEach(wireCredRow);
}
async function openEncryptionDialog(){
  if(!state.settings.encryption){
    const pw=await promptPassword("🔒 Set master password (encrypts the whole file)",true);
    if(pw===null)return;
    state.settings.encryption=true;masterPassword=pw;markDirty();
    recryptSnapshots(null,pw); /* no plaintext snapshots left behind */
    toast("Encryption on — Save to write the encrypted file");renderApp();
    return;
  }
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:400px"><h2>🔒 Master password</h2>
    <p class="faint" style="font-size:12px">The file is currently encrypted. Lose this password and the data is unrecoverable — there is no backdoor.</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
      <button id="e-change">Change master password</button>
      <button id="e-remove" class="danger">Remove encryption (store as plain text)</button>
      <button id="e-close" class="primary">Cancel</button></div></div></div>`;
  const close=()=>root.innerHTML="";
  root.querySelector("#e-close").onclick=close;
  root.querySelector("#e-change").onclick=async()=>{close();const pw=await promptPassword("New master password",true);if(pw===null)return;const old=masterPassword;masterPassword=pw;recryptSnapshots(old,pw);markDirty();toast("Password changed — Save to apply");};
  root.querySelector("#e-remove").onclick=()=>{if(confirm("Remove encryption? The file will be saved as PLAIN TEXT, including any stored passwords.")){const old=masterPassword;state.settings.encryption=false;masterPassword=null;recryptSnapshots(old,null);markDirty();close();toast("Encryption removed — Save to write plain text");renderApp();}};
}

/* ===================== OBJECT INDEX (cross-reference) ===================== */
function openObjectIndex(){
  const root=document.getElementById("modalRoot");
  const map={},dmap={};
  state.tasks.forEach(t=>t.objects.forEach(o=>{const k=(o.name||"").trim().toUpperCase();if(!k)return;(map[k]=map[k]||[]).push({t,o});}));
  state.debug.forEach(s=>{
    s.objects.forEach(o=>{const k=(o.name||"").trim().toUpperCase();if(!k)return;(dmap[k]=dmap[k]||[]).push({s,note:o.note});});
    s.breakpoints.forEach(b=>{const k=(b.object||"").trim().toUpperCase();if(!k)return;(dmap[k]=dmap[k]||[]).push({s,note:(b.line?"bp@"+b.line:"breakpoint")+(b.condition?" "+b.condition:"")});});
  });
  const names=[...new Set([...Object.keys(map),...Object.keys(dmap)])].sort();
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:660px"><h2>⌕ Object cross-reference</h2>
    <p class="faint" style="font-size:12px;margin-top:-8px">Every demand and debug session that touched an object — for when the same issue resurfaces months later.</p>
    <input id="oi-q" placeholder="Filter objects (e.g. ZFI_AGEING)…" autocomplete="off">
    <div id="oi-list" class="picklist" style="margin-top:10px;max-height:48vh"></div>
    <div class="modal-foot"><button id="oi-close" class="primary">Close</button></div></div></div>`;
  const close=()=>root.innerHTML="";
  root.querySelector("#oi-close").onclick=close;
  root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
  const listEl=root.querySelector("#oi-list");
  const draw=q=>{q=(q||"").trim().toUpperCase();
    const show=names.filter(n=>!q||n.includes(q));
    if(!show.length){listEl.innerHTML=`<div class="pickrow faint">No objects logged${q?" match “"+esc(q)+"”":""}.</div>`;return;}
    listEl.innerHTML=show.map(n=>{const uses=map[n]||[],duses=dmap[n]||[];
      return `<div class="pickrow" style="display:block;cursor:default">
        <div class="mono" style="color:var(--accent);font-weight:600">${esc(n)} <span class="faint" style="font-weight:400">· ${uses.length} demand(s)${duses.length?" · "+duses.length+" debug":""}</span></div>
        ${uses.map(u=>{const trs=trsForObject(u.t,u.o.id);return `<div style="font-size:12px;margin:3px 0 0 6px"><a class="oi-go" data-id="${u.t.id}" style="cursor:pointer">📋 ${esc(u.t.demandId||u.t.title)}</a> <span class="faint">— ${esc(u.o.action)}${u.o.desc?": "+esc(u.o.desc):""}${trs.length?" · in "+trs.map(x=>esc(x.number||"(TR)")).join(", "):""}</span></div>`;}).join("")}
        ${duses.map(u=>`<div style="font-size:12px;margin:3px 0 0 6px"><a class="oi-dgo" data-id="${u.s.id}" style="cursor:pointer">🐞 ${esc(u.s.title)}</a> <span class="faint">${u.note?"— "+esc(u.note):""}</span></div>`).join("")}</div>`;}).join("");
    listEl.querySelectorAll(".oi-go").forEach(a=>a.onclick=()=>{view="demands";activeId=a.dataset.id;activeTab="objects";close();renderApp();});
    listEl.querySelectorAll(".oi-dgo").forEach(a=>a.onclick=()=>{view="debug";activeDebugId=a.dataset.id;close();renderApp();});
  };
  draw("");
  const q=root.querySelector("#oi-q");q.focus();q.oninput=()=>draw(q.value);
}

/* ===================== PORTFOLIO (project / theme rollup) ===================== */
function openPortfolio(){
  const root=document.getElementById("modalRoot");
  let dim="project";
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:700px"><h2>▦ Portfolio overview</h2>
    <p class="faint" style="font-size:12px;margin-top:-8px">Everything grouped by initiative or functional area — e.g. all work done for Sailpoint, or every TRem change.</p>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <div class="nav" style="background:var(--panel2)"><button class="navbtn active" data-dim="project">By Project</button><button class="navbtn" data-dim="theme">By Theme</button><button class="navbtn" data-dim="epic">By Epic</button></div>
      <input id="pf-q" placeholder="Filter…" style="flex:1" autocomplete="off">
    </div>
    <div id="pf-list" class="picklist" style="max-height:56vh"></div>
    <div class="modal-foot"><button id="pf-close" class="primary">Close</button></div></div></div>`;
  const close=()=>root.innerHTML="";

  root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
  const listEl=root.querySelector("#pf-list");
  const draw=()=>{
    const q=(root.querySelector("#pf-q").value||"").trim().toLowerCase();
    const groups={};
    state.tasks.forEach(t=>{
      const raw=dim==="epic"?(()=>{const e=epicById(t.epicId);return e?epicLabel(e):"";})():t[dim];
      const key=(raw||"").trim()||"— (none) —";(groups[key]=groups[key]||[]).push(t);});
    let names=Object.keys(groups).sort((a,b)=>a==="— (none) —"?1:b==="— (none) —"?-1:a.localeCompare(b));
    if(q)names=names.filter(n=>n.toLowerCase().includes(q)||groups[n].some(t=>[t.demandId,t.title].join(" ").toLowerCase().includes(q)));
    if(!names.length){listEl.innerHTML=`<div class="pickrow faint">Nothing matches “${esc(q)}”.</div>`;return;}
    listEl.innerHTML=names.map(n=>{const items=groups[n];const sc={};items.forEach(t=>sc[t.status]=(sc[t.status]||0)+1);
      const objs=new Set(),trs=new Set();items.forEach(t=>{t.objects.forEach(o=>o.name&&objs.add(o.name));t.transports.forEach(tr=>tr.number&&trs.add(tr.number));});
      const badges=Object.entries(sc).map(([k,v])=>`<span class="pill ${STATUS[k].cls}" style="font-size:10px">${v} ${STATUS[k].label}</span>`).join(" ");
      return `<div class="pickrow" style="display:block;cursor:default">
        <div style="display:flex;align-items:center;gap:8px"><div style="font-weight:700;color:var(--accent2)">▦ ${esc(n)}</div><span class="faint" style="font-size:11px">${items.length} demand(s)</span>${n!=="— (none) —"?`<a class="pf-filter" data-n="${esc(n)}" style="margin-left:auto;font-size:11px;cursor:pointer">filter list →</a>`:""}</div>
        <div style="margin:5px 0">${badges}</div>
        ${items.map(t=>`<div style="font-size:12px;margin:2px 0 0 6px"><a class="pf-go" data-id="${t.id}" style="cursor:pointer">${esc(t.demandId||"—")} · ${esc(t.title)}</a> <span class="pill ${STATUS[t.status].cls}" style="font-size:9px">${STATUS[t.status].label}</span></div>`).join("")}
        ${(objs.size||trs.size)?`<div style="font-size:11px;margin:6px 0 0 6px" class="faint">${objs.size?"Objects: "+[...objs].map(esc).join(", "):""}${objs.size&&trs.size?" · ":""}${trs.size?"TRs: "+[...trs].map(esc).join(", "):""}</div>`:""}
      </div>`;}).join("");
    listEl.querySelectorAll(".pf-go").forEach(a=>a.onclick=()=>{view="demands";activeId=a.dataset.id;activeTab="work";close();renderApp();});
    listEl.querySelectorAll(".pf-filter").forEach(a=>a.onclick=()=>{const n=a.dataset.n;
      renderDemandSidebar._fp=renderDemandSidebar._ft=renderDemandSidebar._fe="";
      if(dim==="project")renderDemandSidebar._fp=n;
      else if(dim==="theme")renderDemandSidebar._ft=n;
      else{const e=state.epics.find(x=>epicLabel(x)===n);if(e)renderDemandSidebar._fe=e.id;}
      view="demands";close();renderApp();});
  };
  root.querySelectorAll(".navbtn[data-dim]").forEach(b=>b.onclick=()=>{dim=b.dataset.dim;root.querySelectorAll(".navbtn[data-dim]").forEach(x=>x.classList.toggle("active",x===b));draw();});
  root.querySelector("#pf-q").oninput=draw;
  root.querySelector("#pf-q").focus();
  draw();
}

/* ===================== AGING INSIGHTS ===================== */
function openAging(){
  const root=document.getElementById("modalRoot");
  const now=Date.now();
  const days=ms=>Math.floor(ms/86400000);
  const statusSince=t=>{let last=null;(t.timeline||[]).forEach(e=>{if(e.type==="status"&&(!last||e.ts>last))last=e.ts;});return last||t.createdAt;};
  const open=state.tasks.filter(t=>!["closed","delivered"].includes(t.status))
    .map(t=>({t,age:t.receivedDate?Math.max(0,-daysUntil(t.receivedDate)):days(now-t.createdAt),inStatus:days(now-statusSince(t))}))
    .sort((a,b)=>b.age-a.age);
  const leads=[];state.tasks.forEach(t=>{
    const first=(t.timeline||[]).filter(e=>e.type==="status"&&e.to==="delivered").map(e=>e.ts).sort((a,b)=>a-b)[0];
    if(first&&t.receivedDate){const lead=days(first-new Date(t.receivedDate+"T00:00:00").getTime());if(lead>=0)leads.push({t,lead,rw:reworkCount(t)});}});
  leads.sort((a,b)=>b.lead-a.lead);
  const avg=leads.length?Math.round(leads.reduce((s,x)=>s+x.lead,0)/leads.length):0;
  const med=leads.length?leads.map(x=>x.lead).sort((a,b)=>a-b)[Math.floor(leads.length/2)]:0;
  const ageCol=n=>n>30?"var(--red)":n>14?"var(--amber)":"var(--txt)";
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:760px"><h2>📈 Aging insights</h2>
    <p class="faint" style="font-size:12px;margin-top:-8px">How long things have been sitting, and how long delivery actually takes. Click a row to open the demand.</p>
    <div class="sec-title"><h3>Open demands by age</h3><div class="ln"></div><span class="faint" style="font-size:12px">${open.length} open · red &gt;30d · amber &gt;14d</span></div>
    ${open.length?`<div class="tbl-wrap"><table><thead><tr><th>Demand</th><th style="width:110px">Status</th><th style="width:64px">Age</th><th style="width:86px">In status</th><th style="width:150px">Waiting on</th><th style="width:100px">Due</th></tr></thead><tbody>
      ${open.map(({t,age,inStatus})=>`<tr class="ag-go" data-id="${t.id}" style="cursor:pointer"><td style="padding:7px 9px">${esc(t.demandId||"—")} · ${esc(t.title)}</td><td><span class="pill ${STATUS[t.status].cls}" style="font-size:10px">${STATUS[t.status].label}</span></td><td class="mono" style="color:${ageCol(age)};font-weight:700">${age}d</td><td class="mono">${inStatus}d</td><td style="font-size:12px">${isWaiting(t)?"⏳ "+esc(t.waiting.on)+(waitDays(t)!=null?" · "+waitDays(t)+"d":""):"—"}</td><td class="mono due ${dueClass(t.dueDate,t.status)}">${t.dueDate||"—"}</td></tr>`).join("")}</tbody></table></div>`
    :`<p class="faint">No open demands. 🎉</p>`}
    <div class="sec-title" style="margin-top:16px"><h3>Delivery lead times</h3><div class="ln"></div><span class="faint" style="font-size:12px">received → first delivered</span></div>
    ${leads.length?`<div class="stats" style="border:none;padding:0;margin-bottom:10px"><div class="stat"><b>${leads.length}</b>delivered</div><div class="stat op"><b>${avg}d</b>avg lead</div><div class="stat"><b>${med}d</b>median</div><div class="stat ov"><b>${leads.filter(x=>x.rw).length}</b>with rework</div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Demand</th><th style="width:100px">Lead time</th><th style="width:100px">Rework</th></tr></thead><tbody>
      ${leads.map(({t,lead,rw})=>`<tr class="ag-go" data-id="${t.id}" style="cursor:pointer"><td style="padding:7px 9px">${esc(t.demandId||"—")} · ${esc(t.title)}</td><td class="mono">${lead}d</td><td>${rw?`<span style="color:var(--red)">↻ ${rw}</span>`:"—"}</td></tr>`).join("")}</tbody></table></div>`
    :`<p class="faint">No delivered demands with a received date yet — lead times appear once you deliver.</p>`}
    <div class="modal-foot"><button id="ag-close" class="primary">Close</button></div></div></div>`;
  const close=()=>root.innerHTML="";
  root.querySelector("#ag-close").onclick=close;
  root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
  root.querySelectorAll(".ag-go").forEach(r=>r.onclick=()=>{view="demands";activeId=r.dataset.id;activeTab="work";close();renderApp();});
}

function activeJournal(){return state.journal.find(j=>j.id===activeJournalId);}
function renderJournalSidebar(){
  const openTodos=state.todos.filter(x=>!x.done).length;
  document.getElementById("side").innerHTML=`
    <div class="side-tools">
      <button class="primary" id="btnToday" style="width:100%">＋ Today's entry</button>
    </div>
    <div class="listwrap" id="jList"></div>`;
  document.getElementById("btnToday").onclick=()=>{journalTodos=false;let j=state.journal.find(x=>x.date===todayStr());if(!j){j={id:uid(),date:todayStr(),title:"",body:"",createdAt:Date.now(),updatedAt:Date.now()};state.journal.unshift(j);markDirty();}activeJournalId=j.id;renderApp();};
  const el=document.getElementById("jList");
  const rows=state.journal.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  const pinned=`<div class="tcard ${journalTodos?"active":""}" data-todos="1" style="border-left-color:var(--green)">
    <div class="ttitle">✅ My action items</div><div class="meta faint">${openTodos} open reminder(s)</div></div>`;
  const list=rows.length?rows.map(j=>{const preview=(j.body||"").replace(/\s+/g," ").slice(0,60);
    return `<div class="tcard ${(!journalTodos&&j.id===activeJournalId)?"active":""}" data-id="${j.id}">
      <div class="demand">📓 ${j.date}${j.date===todayStr()?" · today":""}</div>
      <div class="ttitle">${esc(j.title)||"<span class='faint' style='font-weight:400'>(no title)</span>"}</div>
      <div class="meta faint">${esc(preview)||"empty"}${(j.taskIds&&j.taskIds.length)?`<span class="lc-badge">🔗 ${j.taskIds.length}</span>`:""}</div></div>`;}).join(""):`<div class="empty" style="padding:20px 12px">No journal entries yet.<br>Keep daily rough notes here.</div>`;
  el.innerHTML=pinned+list;
  el.querySelector("[data-todos]").onclick=()=>{journalTodos=true;renderApp();};
  el.querySelectorAll(".tcard[data-id]").forEach(x=>x.onclick=()=>{journalTodos=false;activeJournalId=x.dataset.id;renderApp();});
}
function renderTodos(host){
  const open=state.todos.filter(x=>!x.done).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
  const done=state.todos.filter(x=>x.done);
  host.innerHTML=`<div class="detail-head"><div class="dh-top"><div style="flex:1">
      <h1>✅ My action items</h1>
      <div class="dh-dates"><span>Personal reminders &amp; tasks — not tied to any demand or meeting</span></div></div></div>
    <div class="tabs"><button class="tab active">${open.length} open${done.length?` · ${done.length} done`:""}</button></div></div>
    <div class="detail-body">
      <div class="cmt-add" style="margin-bottom:14px"><textarea id="td-text" placeholder="New reminder / task… (Enter to add)" rows="1" style="min-height:38px"></textarea><input type="date" id="td-due" title="Due (optional)" style="flex:0 0 150px"><button class="primary sm" id="td-add" style="flex:0 0 auto">Add</button></div>
      <div id="td-open"></div>
      ${done.length?`<div class="sec-title" style="margin-top:20px"><h3>Completed</h3><div class="ln"></div><button class="sm" id="td-clear">🗑 Clear completed</button></div><div id="td-done"></div>`:""}
    </div>`;
  const addBox=host.querySelector("#td-text"),dueBox=host.querySelector("#td-due");
  const add=()=>{const v=addBox.value.trim();if(!v)return;state.todos.unshift({id:uid(),text:v,done:false,due:dueBox.value||"",createdAt:Date.now(),doneAt:null});addBox.value="";dueBox.value="";markDirty();renderTodos(host);renderJournalSidebar();};
  host.querySelector("#td-add").onclick=add;
  addBox.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();add();}};
  const drawList=(container,arr,isDone)=>{
    if(!arr.length){container.innerHTML=isDone?"":`<div class="faint" style="font-size:12px;padding:4px 2px">No open items. Add reminders above.</div>`;return;}
    container.innerHTML="";
    arr.forEach(x=>{const row=document.createElement("div");row.className="actitem"+(x.done?" done":"");const dc=dueClass(x.due,x.done?"closed":"open");
      row.innerHTML=`<span class="chk ${x.done?"done":""}">${x.done?"✓":""}</span>
        <span class="at">${esc(x.text)||"<span class='faint'>(click to write)</span>"}</span>
        <input type="date" class="du ${dc}" value="${x.due||""}" title="Due" style="flex:0 0 140px">
        <span class="nact"><button class="ghost sm td-res" title="Outcome / resolution note">📝</button><button class="ghost sm danger td-del">🗑</button></span>
        ${x.resolution?`<span class="ares" title="Outcome — click to edit">↳ ${esc(x.resolution)}</span>`:""}`;
      row.querySelector(".chk").onclick=()=>{x.done=!x.done;x.doneAt=x.done?Date.now():null;markDirty();renderTodos(host);renderJournalSidebar();};
      const at=row.querySelector(".at");at.onclick=()=>editInline(at,x.text,v=>{x.text=v;markDirty();renderTodos(host);});
      row.querySelector(".du").onchange=e=>{x.due=e.target.value;markDirty();renderTodos(host);};
      row.querySelector(".td-del").onclick=()=>{state.todos=state.todos.filter(y=>y.id!==x.id);markDirty();renderTodos(host);renderJournalSidebar();};
      const editRes=()=>{let ar=row.querySelector(".ares");if(!ar){ar=document.createElement("span");ar.className="ares";row.appendChild(ar);}
        editInline(ar,x.resolution||"",v=>{x.resolution=v;markDirty();renderTodos(host);});};
      row.querySelector(".td-res").onclick=editRes;
      const arEl=row.querySelector(".ares");if(arEl)arEl.onclick=editRes;
      container.appendChild(row);});
  };
  drawList(host.querySelector("#td-open"),open,false);
  const dd=host.querySelector("#td-done");if(dd)drawList(dd,done,true);
  const clr=host.querySelector("#td-clear");if(clr)clr.onclick=()=>{if(confirm("Remove all completed items?")){state.todos=state.todos.filter(x=>!x.done);markDirty();renderTodos(host);renderJournalSidebar();}};
}

      <div id="j-imgs" style="margin-top:18px"></div></div>`;
  host.querySelector("#j-title").onchange=e=>{j.title=e.target.value;touch(j);renderJournalSidebar();};
  host.querySelector("#j-date").onchange=e=>{const nd=e.target.value||todayStr();
    if(state.journal.some(x=>x.id!==j.id&&x.date===nd)){toast("An entry for "+nd+" already exists",true);e.target.value=j.date;return;}
    j.date=nd;touch(j);renderJournalSidebar();};
  host.querySelector("#j-body").onchange=e=>{j.body=e.target.value;touch(j);renderJournalSidebar();const l=host.querySelector("#j-links");if(l)l.innerHTML=linkChips(j.body);};

  host.querySelector("#j-link").onclick=()=>openLinkDemandsToJournal(j);

}
function drawJournalChips(j){
  const host=document.getElementById("j-chips");if(!host)return;
  j.taskIds=j.taskIds||[];
  if(!j.taskIds.length){host.innerHTML=`<span class="faint" style="font-size:12px">No demands linked — link the demands these notes are about.</span>`;return;}
  host.innerHTML="";
  j.taskIds.forEach(id=>{const t=state.tasks.find(x=>x.id===id);if(!t)return;
    const chip=document.createElement("span");chip.className="chip";
    chip.innerHTML=`<span class="go">${esc(taskLabel(t))}</span> <span class="x">✕</span>`;
    chip.querySelector(".go").onclick=()=>{view="demands";activeId=id;activeTab="work";renderApp();};
    chip.querySelector(".x").onclick=()=>{j.taskIds=j.taskIds.filter(x=>x!==id);touch(j);drawJournalChips(j);renderJournalSidebar();};
    host.appendChild(chip);});
}
function openLinkDemandsToJournal(j){
  const root=document.getElementById("modalRoot");
  j.taskIds=j.taskIds||[];
  const rows=state.tasks.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  root.innerHTML=`<div class="modal-bg"><div class="modal"><h2>Link demands to journal ${j.date}</h2>
    ${rows.length?`<div class="picklist">${rows.map(t=>`<label class="pickrow"><input type="checkbox" data-id="${t.id}" ${j.taskIds.includes(t.id)?"checked":""} style="width:auto"><div><div class="demand">${esc(t.demandId||"—")}</div><div>${esc(t.title)}</div></div></label>`).join("")}</div>`:`<p class="faint">No demands yet.</p>`}
    <div class="modal-foot"><button id="m-close" class="primary">Done</button></div></div></div>`;
  const close=()=>{root.innerHTML="";drawJournalChips(j);renderJournalSidebar();};
  root.querySelectorAll("input[data-id]").forEach(cb=>cb.onchange=()=>{if(cb.checked){if(!j.taskIds.includes(cb.dataset.id))j.taskIds.push(cb.dataset.id);}else j.taskIds=j.taskIds.filter(id=>id!==cb.dataset.id);touch(j);});
  root.querySelector("#m-close").onclick=close;
  root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
}

  on("#ep-notes","onchange",ev=>{e.notes=ev.target.value;touch(e);const l=host.querySelector("#ep-links");if(l)l.innerHTML=linkChips((e.description||"")+" "+(e.notes||""));});
  on("#ep-add","onclick",()=>openAssignDemandsToEpic(e));
  on("#ep-del","onclick",()=>{
    const n=tasksForEpic(e.id).length;
    if(!confirm("Delete this epic?"+(n?"\n\n"+n+" demand(s) will simply become un-grouped — no demand is deleted.":"")))return;
    state.tasks.forEach(t=>{if(t.epicId===e.id)t.epicId="";});
    state.epics=state.epics.filter(x=>x.id!==e.id);activeEpicId=null;markDirty();renderApp();});
  /* demands */
  const dh=host.querySelector("#ep-demands");
  if(!r.ts.length)dh.innerHTML=`<div class="faint" style="font-size:12px;padding:4px 2px">No demands yet. Use “🔗 Assign demands”, or set the epic on a demand's ✎ Edit dialog.</div>`;
  else{
    const sorted=r.ts.slice().sort((a,b)=>(earliestOpenDue(a)||"9999").localeCompare(earliestOpenDue(b)||"9999"));
    dh.innerHTML=sorted.map(t=>{const s=STATUS[t.status],due=earliestOpenDue(t),dc=dueClass(due,t.status);
      const g=golivePending(t);
      return `<div class="actitem" data-id="${t.id}" style="cursor:pointer">
        <span class="mono" style="flex:0 0 120px;color:var(--accent);font-size:12px">${esc(t.demandId||"—")}</span>
        <span class="at" style="cursor:pointer">${esc(t.title)}</span>
        <span class="pill ${s.cls}" style="flex:0 0 auto">${s.label}</span>
        ${isWaiting(t)?`<span class="pill" style="flex:0 0 auto;color:var(--amber);border-color:var(--amber-line)">⏳ ${esc(t.waiting.on)}</span>`:""}
        ${g?`<span class="lc-badge" style="color:var(--amber)">🚚 ${g.missing.length}→${g.target}</span>`:""}
        <span class="du ${dc}" style="flex:0 0 100px;font-family:var(--mono);font-size:12px">${due||"—"}</span></div>`;}).join("");
    dh.querySelectorAll(".actitem").forEach(row=>row.onclick=()=>{view="demands";activeId=row.dataset.id;activeTab="work";renderApp();});
  }
  /* go-live readiness */
  const gh=host.querySelector("#ep-golive");
  if(!r.trs.length)gh.innerHTML=`<div class="faint" style="font-size:12px;padding:4px 2px">No transports recorded on this epic's demands yet.</div>`;
  else if(!r.pending.length)gh.innerHTML=`<div class="readybar ok"><b style="color:var(--green)">✓ every transport across ${r.ts.length} demand(s) has reached its go-live target</b></div>`;
  else gh.innerHTML=`<div class="readybar warn"><span><b style="color:var(--amber)">⚠ ${r.pending.length} demand(s) still have transports short of their target:</b></span>
    <span style="flex-basis:100%;font-size:12px">${r.pending.map(x=>`<span class="mono">${esc(x.t.demandId||x.t.title)}</span> — ${x.g.missing.length} TR(s) → ${x.g.target}${(()=>{const f=freezeFor(x.g.target);return f?` <span style="color:var(--teal)">❄ frozen until ${f.to}</span>`:"";})()}`).join("<br>")}</span></div>`;
  /* objects */
  const oh=host.querySelector("#ep-objects");
  oh.innerHTML=r.objects.length?`<div class="tbl-wrap"><table><thead><tr><th style="width:26%">Object</th><th style="width:18%">Type</th><th style="width:12%">Action</th><th>Demand</th></tr></thead><tbody>
    ${r.objects.map(({o,t})=>`<tr class="ep-obj" data-id="${t.id}" style="cursor:pointer"><td class="mono">${esc(o.name)}</td><td>${esc(o.type)}</td><td>${esc(o.action)}</td><td class="faint">${esc(t.demandId||t.title)}</td></tr>`).join("")}</tbody></table></div>`
    :`<div class="faint" style="font-size:12px;padding:4px 2px">No objects logged yet.</div>`;
  oh.querySelectorAll(".ep-obj").forEach(row=>row.onclick=()=>{view="demands";activeId=row.dataset.id;activeTab="objects";renderApp();});
  /* transports */
  const th=host.querySelector("#ep-trs");
  th.innerHTML=r.trs.length?`<div class="tbl-wrap"><table><thead><tr><th style="width:22%">TR</th><th style="width:14%">Kind</th><th style="width:14%">Origin</th><th>Reached</th><th style="width:22%">Demand</th></tr></thead><tbody>
    ${r.trs.map(({tr,t})=>{const cl=isCust(tr)&&tr.client?" / "+esc(tr.client):"";
      return `<tr class="ep-tr" data-id="${t.id}" style="cursor:pointer"><td class="mono">${esc(tr.number||"(unnumbered)")}</td><td>${isCust(tr)?"🗂 Customizing":"🔧 Workbench"}</td><td class="mono">${esc(tr.system)}${cl}</td><td class="mono" style="font-size:11px">${[...reachedSystems(t,tr)].join(", ")||"—"}</td><td class="faint">${esc(t.demandId||t.title)}</td></tr>`;}).join("")}</tbody></table></div>`
    :`<div class="faint" style="font-size:12px;padding:4px 2px">No transports yet.</div>`;
  th.querySelectorAll(".ep-tr").forEach(row=>row.onclick=()=>{view="demands";activeId=row.dataset.id;activeTab="transports";renderApp();});
}
function openAssignDemandsToEpic(e){
  const root=document.getElementById("modalRoot");
  const rows=state.tasks.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  root.innerHTML=`<div class="modal-bg"><div class="modal"><h2>Assign demands to “${esc(e.name)}”</h2>
    <p class="faint" style="font-size:12px;margin-top:-8px">A demand belongs to one epic. Ticking here moves it to this epic; unticking leaves it un-grouped.</p>
    ${rows.length?`<div class="picklist">${rows.map(t=>{const other=t.epicId&&t.epicId!==e.id?epicById(t.epicId):null;
      return `<label class="pickrow"><input type="checkbox" data-id="${t.id}" ${t.epicId===e.id?"checked":""} style="width:auto"><div><div class="demand">${esc(t.demandId||"—")}</div><div>${esc(t.title)}</div>${other?`<div class="faint" style="font-size:11px">currently in ◆ ${esc(epicLabel(other))}</div>`:""}</div></label>`;}).join("")}</div>`:`<p class="faint">No demands yet.</p>`}
    <div class="modal-foot"><button id="m-close" class="primary">Done</button></div></div></div>`;
  const close=()=>{root.innerHTML="";renderApp();};
  root.querySelectorAll("input[data-id]").forEach(cb=>cb.onchange=()=>{const t=state.tasks.find(x=>x.id===cb.dataset.id);
    if(cb.checked)t.epicId=e.id;else if(t.epicId===e.id)t.epicId="";touch(t);});
  root.querySelector("#m-close").onclick=close;
  root.querySelector(".modal-bg").onclick=ev=>{if(ev.target===root.querySelector(".modal-bg"))close();};
}

function renderPlayKind(body,p){
  if(p.kind==="process"){
    body.innerHTML=`<div class="sec-title"><h3>Steps</h3><div class="ln"></div><button class="sm" id="st-add">＋ Add step</button></div><div id="st-list"></div>`;
    body.querySelector("#st-add").onclick=()=>{p.steps.push({id:uid(),text:""});touch(p);renderPlayKind(body,p);renderPlaybookSidebar();};
    const host=body.querySelector("#st-list");
    if(!p.steps.length){host.innerHTML=`<div class="faint" style="font-size:12px;padding:4px 2px">No steps yet — use “＋ Add step”.</div>`;return;}
    host.innerHTML="";
    p.steps.forEach((s,i)=>{const row=document.createElement("div");row.className="actitem";
      row.innerHTML=`<span class="mono" style="flex:0 0 26px;color:var(--accent);font-weight:700;text-align:right">${i+1}.</span>
        <span class="at">${s.text?linkify(s.text):"<span class='faint'>(click to write the step)</span>"}</span>
        <span class="nact"><button class="ghost sm s-up" title="Move up" ${i===0?"disabled":""}>↑</button><button class="ghost sm s-dn" title="Move down" ${i===p.steps.length-1?"disabled":""}>↓</button><button class="ghost sm danger s-del">🗑</button></span>`;
      const at=row.querySelector(".at");
      at.onclick=e=>{if(e.target.tagName==="A")return;editInline(at,s.text,v=>{s.text=v;touch(p);renderPlayKind(body,p);});};
      row.querySelector(".s-up").onclick=()=>{[p.steps[i-1],p.steps[i]]=[p.steps[i],p.steps[i-1]];touch(p);renderPlayKind(body,p);};
      row.querySelector(".s-dn").onclick=()=>{[p.steps[i+1],p.steps[i]]=[p.steps[i],p.steps[i+1]];touch(p);renderPlayKind(body,p);};
      row.querySelector(".s-del").onclick=()=>{p.steps.splice(i,1);touch(p);renderPlayKind(body,p);renderPlaybookSidebar();};
      host.appendChild(row);});
    return;
  }
  if(p.kind==="recurring"){
    const n=p.due?daysUntil(p.due):null;
    body.innerHTML=`<div class="sec-title"><h3>Schedule</h3><div class="ln"></div></div>
      <div class="grid2" style="max-width:520px">
        <div class="field"><label>Next due</label><input type="date" id="rc-due" value="${p.due||""}"></div>
        <div class="field"><label>Repeats</label><select id="rc-rec">${[["annual","Annually"],["quarterly","Quarterly"],["monthly","Monthly"],["once","One-off"]].map(([k,l])=>`<option value="${k}" ${k===p.recur?"selected":""}>${l}</option>`).join("")}</select></div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        ${p.due?`<span class="due ${n<0?"over":n<=14?"soon":""}" style="font-size:13px">⏰ due ${p.due}${n!=null?` (${n<0?(-n)+"d overdue":"in "+n+"d"})`:""}</span>`:`<span class="faint">no date set — it won't surface on Today</span>`}
        <button class="sm" id="rc-done">✓ Done — advance to next</button>
        ${p.lastDone?`<span class="faint" style="font-size:11px">last done ${fmtTs(p.lastDone)}</span>`:""}
      </div>
      <p class="faint" style="font-size:12px">Appears on the Today dashboard from 14 days before it's due.</p>`;
    body.querySelector("#rc-due").onchange=e=>{p.due=e.target.value;touch(p);renderApp();};
    body.querySelector("#rc-rec").onchange=e=>{p.recur=e.target.value;touch(p);};
    body.querySelector("#rc-done").onclick=()=>{advanceRecurring(p);touch(p);renderApp();toast(p.due?"Done ✓ — next due "+p.due:"Done ✓");};
    return;
  }
  if(p.kind==="freeze"){
    const all=[];state.settings.landscapes.forEach(L=>state.settings.tiers.forEach(T=>all.push(L+T.d)));
    const act=p.from&&p.to&&p.from<=todayStr()&&todayStr()<=p.to;
    body.innerHTML=`<div class="sec-title"><h3>Freeze window</h3><div class="ln"></div>${act?'<span class="expbadge">ACTIVE NOW</span>':""}</div>
      <div class="grid2" style="max-width:520px">
        <div class="field"><label>From</label><input type="date" id="fz-from" value="${p.from||""}"></div>
        <div class="field"><label>To (inclusive)</label><input type="date" id="fz-to" value="${p.to||""}"></div>
      </div>
      <label>Frozen systems — click to toggle</label>
      <div class="chiprow" id="fz-sys" style="margin-top:6px">${all.map(s=>`<button class="sys ${sysTierCls(s)}" data-s="${s}" style="cursor:pointer;opacity:${(p.systems||[]).includes(s)?"1":".35"}">${s}${(p.systems||[]).includes(s)?" ✓":""}</button>`).join("")}</div>
      <p class="faint" style="font-size:12px;margin-top:10px">While active, the go-live check on every demand warns when its target system is frozen; the freeze also shows on Today from 14 days before it starts.</p>`;
    body.querySelector("#fz-from").onchange=e=>{p.from=e.target.value;touch(p);renderApp();};
    body.querySelector("#fz-to").onchange=e=>{p.to=e.target.value;touch(p);renderApp();};
    body.querySelectorAll("#fz-sys [data-s]").forEach(b=>b.onclick=()=>{const s=b.dataset.s;p.systems=p.systems||[];
      if(p.systems.includes(s))p.systems=p.systems.filter(x=>x!==s);else p.systems.push(s);
      touch(p);renderPlayKind(body,p);});
    return;
  }
  if(p.kind==="contacts"){
    body.innerHTML=`<div class="sec-title"><h3>People</h3><div class="ln"></div><button class="sm" id="pp-add">＋ Add person</button></div>
      <div class="tbl-wrap"><table><thead><tr><th style="width:24%">Name</th><th style="width:32%">Role / responsibility</th><th>Contact (mail, phone, Teams…)</th><th style="width:34px"></th></tr></thead><tbody id="pp-body"></tbody></table></div>`;
    body.querySelector("#pp-add").onclick=()=>{p.people.push({id:uid(),name:"",role:"",contact:""});touch(p);renderPlayKind(body,p);renderPlaybookSidebar();};
    const tb=body.querySelector("#pp-body");
    tb.innerHTML=p.people.length?p.people.map(x=>`<tr data-id="${x.id}">
      <td><input class="pp-n" value="${esc(x.name)}" placeholder="Name"></td>
      <td><input class="pp-r" value="${esc(x.role)}" placeholder="e.g. Basis lead, product owner"></td>
      <td><input class="pp-c" value="${esc(x.contact)}" placeholder="email / phone / Teams"></td>
      <td><button class="ghost sm danger pp-x">🗑</button></td></tr>`).join(""):`<tr><td colspan="4" class="faint" style="padding:12px;text-align:center">No people yet.</td></tr>`;
    tb.querySelectorAll("tr[data-id]").forEach(tr=>{const x=p.people.find(y=>y.id===tr.dataset.id);
      tr.querySelector(".pp-n").onchange=e=>{x.name=e.target.value;touch(p);};
      tr.querySelector(".pp-r").onchange=e=>{x.role=e.target.value;touch(p);};
      tr.querySelector(".pp-c").onchange=e=>{x.contact=e.target.value;touch(p);};
      tr.querySelector(".pp-x").onclick=()=>{p.people=p.people.filter(y=>y.id!==x.id);touch(p);renderPlayKind(body,p);};});
    return;
  }
  body.innerHTML=""; /* faq — the body IS the answer */
}
function printPlay(p){

  pa.innerHTML=`<h1>${esc(p.title)}</h1>
    <p class="meta">${K.label}${p.category?" · "+esc(p.category):""} · printed ${todayStr()}</p>
    ${p.body?`<div class="note">${esc(p.body)}</div>`:""}
    ${p.kind==="process"&&p.steps.length?`<h3>Steps</h3><ol>${p.steps.map(s=>`<li>${esc(s.text)}</li>`).join("")}</ol>`:""}
    ${p.kind==="recurring"?`<p><b>Next due:</b> ${p.due||"—"} · <b>Repeats:</b> ${p.recur}</p>`:""}
    ${p.kind==="freeze"?`<p><b>Window:</b> ${p.from||"—"} → ${p.to||"—"}</p><p><b>Systems:</b> ${(p.systems||[]).join(", ")||"—"}</p>`:""}
    ${p.kind==="contacts"&&p.people.length?`<table><tr><th>Name</th><th>Role</th><th>Contact</th></tr>${p.people.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.role)}</td><td>${esc(x.contact)}</td></tr>`).join("")}</table>`:""}`;
  window.print();
}

let imagesDir=null, imgDirSaved=null, imgUrlCache={};
const IMG_EXTS=/\.(png|jpe?g|gif|webp|bmp)$/i;
async function restoreImgDir(){
  if(!useIdb||!supportsFS)return;
  try{const h=await idbGet("imgdir");if(!h)return;imgDirSaved=h;
    let p="prompt";try{p=await h.queryPermission({mode:"readwrite"});}catch(e){}
    if(p==="granted")imagesDir=h;
  }catch(e){}
}
async function ensureImgDir(interactive){
  if(imagesDir)return imagesDir;
  if(imgDirSaved){try{
    let p=await imgDirSaved.queryPermission({mode:"readwrite"});
    if(p!=="granted"&&interactive&&imgDirSaved.requestPermission)p=await imgDirSaved.requestPermission({mode:"readwrite"});
    if(p==="granted"){imagesDir=imgDirSaved;return imagesDir;}
  }catch(e){}}
  if(interactive&&window.showDirectoryPicker){
    try{imagesDir=await showDirectoryPicker({mode:"readwrite"});imgDirSaved=imagesDir;
      if(useIdb)idbSet("imgdir",imagesDir).catch(()=>{});
      toast("Images folder connected");return imagesDir;
    }catch(e){if(e.name!=="AbortError")toast("Couldn't open folder: "+e.message,true);}
  }
  return null;
}
async function forgetImgDir(){imagesDir=null;imgDirSaved=null;if(useIdb)await idbDel("imgdir");Object.values(imgUrlCache).forEach(u=>URL.revokeObjectURL(u));imgUrlCache={};}
function imagesFor(kind,id){return state.images.filter(im=>im.links.some(l=>l.kind===kind&&l.id===id));}
function expiredImages(){const t=todayStr();return state.images.filter(im=>im.expiry&&im.expiry<t);}
function isExpired(im){return !!(im.expiry&&im.expiry<todayStr());}
async function imgUrl(im){
  if(imgUrlCache[im.file])return imgUrlCache[im.file];
  if(!imagesDir)return null;
  try{const fh=await imagesDir.getFileHandle(im.file);const f=await fh.getFile();const u=URL.createObjectURL(f);imgUrlCache[im.file]=u;return u;}
  catch(e){return null;}
}
function defaultImgExpiry(){const d=state.settings.imageExpiryDays;return d?dstr(new Date(Date.now()+d*86400000)):"";}
async function saveImageBlob(blob,kind,id){
  const dir=await ensureImgDir(true);
  if(!dir){toast("Connect an images folder first (⋯ menu → Images)",true);return null;}
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const name=`dd-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
  try{
    const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();
    const im=normImage({file:name,label:"",expiry:defaultImgExpiry(),links:kind?[{kind,id}]:[]});
    state.images.push(im);markDirty();
    toast("📷 Saved "+name+(im.expiry?" · expires "+im.expiry:""));
    return im;
  }catch(e){toast("Image save failed: "+e.message,true);return null;}
}
function pasteTarget(){
  if(view==="demands"&&activeTask())return{kind:"demand",id:activeTask().id};
  if(view==="meetings"&&!meetingRollup&&activeMeeting())return{kind:"meeting",id:activeMeeting().id};
  if(view==="journal"&&!journalTodos&&activeJournal())return{kind:"journal",id:activeJournal().id};
  if(view==="playbook"&&activePlay())return{kind:"playbook",id:activePlay().id};
  return null;
}
document.addEventListener("paste",async e=>{
  const items=[...(e.clipboardData&&e.clipboardData.items||[])];
  const it=items.find(x=>x.type&&x.type.startsWith("image/"));
  if(!it)return;
  e.preventDefault();
  const tgt=pasteTarget();
  if(!tgt){toast("Open a demand, meeting or journal entry, then paste to attach the image",true);return;}
  const blob=it.getAsFile();if(!blob)return;
  const im=await saveImageBlob(blob,tgt.kind,tgt.id);
  if(im){if(tgt.kind==="demand")activeTab="images";renderApp();}
});
function renderImagesSection(host,kind,id){
  const list=imagesFor(kind,id);
  const days=state.settings.imageExpiryDays;
  host.innerHTML=`<div class="sec-title"><h3>📷 Images / screenshots</h3><div class="ln"></div>
      ${imagesDir?`<span class="faint" style="font-size:11px">🖼 folder connected</span>`:`<button class="sm" id="img-conn">🖼 Connect images folder</button>`}
      <button class="sm" id="img-add">＋ From folder</button></div>
    <p class="faint" style="font-size:12px;margin-top:-6px">Snip with <b>Win+Shift+S</b>, then press <b>Ctrl+V</b> here — the image is saved into your folder and attached. ${days?`Expiry defaults to <b>${days} days</b>; expired images appear on Today for cleanup.`:"No default expiry set."}</p>
    <div class="imgrid" id="imgGrid"></div>`;
  const conn=host.querySelector("#img-conn");
  if(conn)conn.onclick=async()=>{if(await ensureImgDir(true))renderImagesSection(host,kind,id);};
  host.querySelector("#img-add").onclick=()=>openImgFolderPicker(kind,id,()=>renderImagesSection(host,kind,id));
  const grid=host.querySelector("#imgGrid");
  if(!list.length){grid.innerHTML=`<div class="faint" style="font-size:12px;grid-column:1/-1">No images attached.</div>`;return;}
  grid.innerHTML=list.map(im=>`<div class="imgcard ${isExpired(im)?"expired":""}" data-id="${im.id}">
      ${imagesDir?`<img class="thumb" alt="">`:`<div class="nothumb">connect the folder<br>to preview</div>`}
      <div class="im-file" title="${esc(im.file)}">${esc(im.file)} ${isExpired(im)?'<span class="expbadge">EXPIRED</span>':""}</div>
      <input class="im-label" value="${esc(im.label)}" placeholder="What is this? (label)">
      <div class="im-exp">⏳ expires <input type="date" class="im-expiry" value="${im.expiry||""}"></div>
      <div class="im-acts"><button class="ghost sm im-view" title="View full size">👁</button><button class="ghost sm im-unlink" title="Unlink from here (keeps the file)">⛓</button><button class="ghost sm danger im-del" title="Delete file from disk">🗑</button></div>
    </div>`).join("");
  grid.querySelectorAll(".imgcard").forEach(card=>{
    const im=state.images.find(x=>x.id===card.dataset.id);
    const th=card.querySelector(".thumb");
    if(th)imgUrl(im).then(u=>{if(u)th.src=u;else{th.outerHTML=`<div class="nothumb">file not found in folder:<br>${esc(im.file)}</div>`;}});
    if(th)th.onclick=()=>openImageLightbox(im);
    card.querySelector(".im-view").onclick=()=>openImageLightbox(im);
    card.querySelector(".im-label").onchange=e=>{im.label=e.target.value;markDirty();};
    card.querySelector(".im-expiry").onchange=e=>{im.expiry=e.target.value;markDirty();renderImagesSection(host,kind,id);};
    card.querySelector(".im-unlink").onclick=()=>{im.links=im.links.filter(l=>!(l.kind===kind&&l.id===id));markDirty();renderImagesSection(host,kind,id);};
    card.querySelector(".im-del").onclick=async()=>{
      if(!confirm("Delete "+im.file+" from the folder AND remove its record?"))return;
      const dir=await ensureImgDir(true);
      if(dir){try{await dir.removeEntry(im.file);}catch(e){/* already gone is fine */}}
      if(imgUrlCache[im.file]){URL.revokeObjectURL(imgUrlCache[im.file]);delete imgUrlCache[im.file];}
      state.images=state.images.filter(x=>x.id!==im.id);markDirty();renderImagesSection(host,kind,id);
      if(view==="today")renderApp();
    };
  });
}
async function openImageLightbox(im){
  const u=await imgUrl(im);
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="lightbox" id="lb">
      ${u?`<img src="${u}" alt="">`:`<div class="lb-meta">Can't preview — connect the images folder (⋯ menu) or the file is missing: ${esc(im.file)}</div>`}
      <div class="lb-meta">${esc(im.label||im.file)}${im.expiry?` · ⏳ ${im.expiry}${isExpired(im)?' <span class="expbadge">EXPIRED</span>':""}`:""} · click anywhere to close</div>
    </div>`;
  root.querySelector("#lb").onclick=()=>root.innerHTML="";
}
async function openImgFolderPicker(kind,id,cb){
  const dir=await ensureImgDir(true);
  if(!dir){toast("Connect an images folder first",true);return;}
  const files=[];
  try{for await(const entry of dir.values()){if(entry.kind==="file"&&IMG_EXTS.test(entry.name))files.push(entry.name);}}
  catch(e){toast("Couldn't read folder: "+e.message,true);return;}
  files.sort().reverse();
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="width:520px"><h2>📷 Attach images from folder</h2>
    <p class="faint" style="font-size:12px;margin-top:-8px">Every image file in the connected folder. Tick to attach here; files not yet known to Demand Desk get a record automatically.</p>
    ${files.length?`<div class="picklist">${files.map(f=>{
      const rec=state.images.find(x=>x.file===f);
      const linked=rec&&rec.links.some(l=>l.kind===kind&&l.id===id);
      return `<label class="pickrow"><input type="checkbox" data-f="${esc(f)}" ${linked?"checked":""} style="width:auto"><div><div class="mono" style="font-size:12px">${esc(f)}</div><div class="faint" style="font-size:11px">${rec?(rec.label||"registered")+(rec.expiry?" · exp "+rec.expiry:""):"not registered yet"}</div></div></label>`;}).join("")}</div>`
    :`<p class="faint">No image files in the folder yet.</p>`}
    <div class="modal-foot"><button id="m-close" class="primary">Done</button></div></div></div>`;
  const close=()=>{root.innerHTML="";cb&&cb();};
  root.querySelectorAll("input[data-f]").forEach(cbx=>cbx.onchange=()=>{
    const f=cbx.dataset.f;
    let rec=state.images.find(x=>x.file===f);
    if(cbx.checked){
      if(!rec){rec=normImage({file:f,expiry:defaultImgExpiry()});state.images.push(rec);}
      if(!rec.links.some(l=>l.kind===kind&&l.id===id))rec.links.push({kind,id});
    }else if(rec){rec.links=rec.links.filter(l=>!(l.kind===kind&&l.id===id));}
    markDirty();
  });
  root.querySelector("#m-close").onclick=close;
  root.querySelector(".modal-bg").onclick=e=>{if(e.target===root.querySelector(".modal-bg"))close();};
}
function gotoImage(im){
  const l=im.links[0];
  if(!l){view="demands";renderApp();return;}
  if(l.kind==="demand"){view="demands";activeId=l.id;activeTab="images";}
  else if(l.kind==="meeting"){view="meetings";meetingRollup=false;activeMeetingId=l.id;}
  else if(l.kind==="playbook"){view="playbook";activePlayId=l.id;}
  else{view="journal";journalTodos=false;activeJournalId=l.id;}
  renderApp();
}

/* ===================== GLOBAL SEARCH ===================== */
function runGlobalSearch(q){
  const box=document.getElementById("gsearchResults");q=q.trim().toLowerCase();
  if(!q){box.classList.add("hide");return;}
  const hits=[];
  state.tasks.forEach(t=>{
    if([t.demandId,t.title,t.description,t.notes,t.type,t.requestor,t.project,t.theme,(()=>{const e=epicById(t.epicId);return e?epicLabel(e):"";})(),(t.comments||[]).map(c=>c.text).join(" ")].join(" ").toLowerCase().includes(q))hits.push({k:"Demand",go:()=>{view="demands";activeId=t.id;activeTab="work";},label:`${t.demandId||"—"} · ${t.title}${t.project?" · ▦ "+t.project:""}${t.theme?" · "+t.theme:""}`});
    t.objects.forEach(o=>{if([o.name,o.type,o.desc].join(" ").toLowerCase().includes(q))hits.push({k:"Object",go:()=>{view="demands";activeId=t.id;activeTab="objects";},label:`${o.name||"(obj)"} — ${o.action} · ${t.demandId||t.title}`});});
    t.transports.forEach(tr=>{
      const toc=tocFor(t,tr);
      const sysStr=effectiveSyncs(t,tr).map(s=>s.system).join(" ")+" "+tr.system+" "+(toc?toc.number:"");
      if([tr.number,tr.desc,tr.notes,sysStr,tr.client,isCust(tr)?"customizing cust config":"workbench"].join(" ").toLowerCase().includes(q))hits.push({k:"Transport",go:()=>{view="demands";activeId=t.id;activeTab="transports";},label:`${tr.number||"(TR)"} ${tr.desc?"— "+tr.desc:""} · orig ${tr.system}${isCust(tr)&&tr.client?"/"+tr.client:""}${effectiveSyncs(t,tr).length?" → "+[...reachedSystems(t,tr)].join(", "):""}${toc?" · ToC "+toc.number:""} · ${t.demandId||t.title}`});
    });
    (t.tocs||[]).forEach(c=>{if([c.number,c.desc,c.notes,c.syncs.map(s=>s.system).join(" ")].join(" ").toLowerCase().includes(q))hits.push({k:"ToC",go:()=>{view="demands";activeId=t.id;activeTab="transports";},label:`ToC ${c.number||"(unnamed)"}${c.syncs.filter(s=>s.system).length?" → "+c.syncs.filter(s=>s.system).map(s=>s.system).join(", "):""} · ${t.demandId||t.title}`});});
    (function w(a){a.forEach(s=>{if(((s.title||"")+" "+(s.comments||[]).map(c=>c.text).join(" ")).toLowerCase().includes(q))hits.push({k:"Subtask",go:()=>{view="demands";activeId=t.id;activeTab="work";},label:`${s.title} · ${t.demandId||t.title}`});w(s.children);});})(t.subtasks);
    (t.reference||[]).forEach(r=>{const blob=(r.label+" "+(r.secret?"":r.value)).toLowerCase();if(blob.includes(q))hits.push({k:"Reference",go:()=>{view="demands";activeId=t.id;activeTab="reference";},label:`${r.label||"(ref)"}${r.secret?" 🔒":(r.value?" — "+r.value:"")} · ${t.demandId||t.title}`});});
  });
  state.meetings.forEach(m=>{
    if([m.title,m.team,m.attendees,m.body,m.date].join(" ").toLowerCase().includes(q))hits.push({k:"Meeting",go:()=>{view="meetings";meetingRollup=false;activeMeetingId=m.id;},label:`${m.date}${m.team?" · "+m.team:""} · ${m.title}`});
    m.actions.forEach(a=>{if([a.text,a.owner,a.resolution].join(" ").toLowerCase().includes(q))hits.push({k:"Action",go:()=>{view="meetings";meetingRollup=false;activeMeetingId=m.id;},label:`${a.text} ${a.owner?"("+a.owner+")":""}${a.resolution?" ↳ "+a.resolution:""} · ${m.title}`});});
  });
  state.credentials.forEach(c=>{if([c.system,c.client,c.label,c.username,c.url,c.notes].join(" ").toLowerCase().includes(q))hits.push({k:"Vault",go:()=>{view="vault";},label:`${c.system||""}${c.client?"/"+c.client:""} ${c.label||""} · ${c.username||""}`.trim()});});
  state.journal.forEach(j=>{if([j.date,j.title,j.body].join(" ").toLowerCase().includes(q))hits.push({k:"Journal",go:()=>{view="journal";journalTodos=false;activeJournalId=j.id;},label:`${j.date}${j.title?" · "+j.title:""}`});});
  state.todos.forEach(x=>{if(((x.text||"")+" "+(x.resolution||"")).toLowerCase().includes(q))hits.push({k:"To-do",go:()=>{view="journal";journalTodos=true;},label:`${x.done?"✓ ":""}${x.text}${x.resolution?" ↳ "+x.resolution:""}${x.due?" · due "+x.due:""}`});});
  state.epics.forEach(e=>{
    if([e.name,e.code,e.description,e.owner,e.notes].join(" ").toLowerCase().includes(q))
      hits.push({k:"Epic",go:()=>{view="epics";activeEpicId=e.id;},label:`◆ ${epicLabel(e)} · ${tasksForEpic(e.id).length} demand(s)`});});
  state.playbook.forEach(p=>{
    const blob=[p.title,p.category,p.body,p.steps.map(s=>s.text).join(" "),p.people.map(x=>x.name+" "+x.role+" "+x.contact).join(" "),(p.systems||[]).join(" ")].join(" ").toLowerCase();
    if(blob.includes(q))hits.push({k:"Playbook",go:()=>{view="playbook";activePlayId=p.id;},label:`${PLAY_KINDS[p.kind].icon} ${p.title}${p.category?" · "+p.category:""}`});});
  state.images.forEach(im=>{if((im.label+" "+im.file).toLowerCase().includes(q))hits.push({k:"Image",go:()=>gotoImage(im),label:`📷 ${im.label||im.file}${im.expiry?" · exp "+im.expiry:""}`});});
  state.debug.forEach(s=>{
    const blob=[s.title,s.demandId,s.resume,s.notes,s.objects.map(o=>o.name+" "+o.note).join(" "),s.breakpoints.map(b=>b.object+" "+b.condition+" "+b.note).join(" "),s.findings.map(f=>f.text).join(" "),s.watches.map(w=>w.name+" "+w.value+" "+w.where).join(" ")].join(" ").toLowerCase();
    if(blob.includes(q))hits.push({k:"Debug",go:()=>{view="debug";activeDebugId=s.id;},label:`${s.title}${s.demandId?" · "+s.demandId:""}`});});
  if(!hits.length){box.innerHTML=`<div class="gsr faint">No matches</div>`;box.classList.remove("hide");return;}
  box.innerHTML=hits.slice(0,50).map((h,i)=>`<div class="gsr" data-i="${i}"><span class="k">${h.k}</span>${esc(h.label)}</div>`).join("");
  box.classList.remove("hide");
  box.querySelectorAll(".gsr[data-i]").forEach(el=>el.onclick=()=>{hits[+el.dataset.i].go();box.classList.add("hide");document.getElementById("globalSearch").value="";renderApp();});
}
